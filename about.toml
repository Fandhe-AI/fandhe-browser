# cargo-about 設定（TASK-78.2・OSS-4）。`make license-inventory`（scripts/about.sh）が本ファイルで
# 本体 workspace の全依存ツリーの「解決後ライセンス一覧」を生成する。
# cargo-deny（deny.toml）は許可外ライセンスの合否を fail-closed で判定し、cargo-about は
# 棚卸しの一次資料（crate ごとの解決後ライセンス）を出す。役割分担は licensing.md を参照。
#
# 同期の約束: `accepted` は deny.toml の [licenses].allow、`targets` は deny.toml の [graph].targets、
# dev/build 依存を含める設定は deny.toml の include-dev = true と同じ範囲に保つ。
# どれかを変えるときは deny.toml と本ファイルを同時に更新する。
#
# MPL-2.0 は本体 workspace では許可しない（licensing.md・RENDER-1）。許可するのは
# servo-host/about.toml だけ。

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

# deny.toml の include-dev = true に合わせ、dev / build 依存も棚卸し対象にする。
ignore-build-dependencies = false
ignore-dev-dependencies = false

[private]
# workspace crate（publish = false。`make check-publish-private` が全 member で保証）を一覧から外す。
# 本体の LICENSE-MIT / LICENSE-APACHE が適用されるため棚卸しの網羅性は欠けない。
# 必須: cargo-about 0.9.2 は `license.workspace = true` の crate の manifest を合成する際、
# 非 ASCII（日本語コメント）を含む manifest で文字境界 panic を起こすため、これで走査自体を避ける。
# registry・git 由来の外部 crate は対象に残る。
ignore = true
