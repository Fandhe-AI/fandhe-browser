# fandhe-browser-core の crate manifest。
#
# REPAIR-1（TASK-1（旧サブ番号 1.2）・MS-1）: workspace 分割の一環として
# `fandhe-browser-core` の空 skeleton を追加する。本 crate は fetch・HTML パース・
# DOM・query・CSSOM・config・可観測性を担う（CLAUDE.md のリポジトリ構成参照）。
# `fetch` モジュールの本実装（TASK-24.2・Issue #36・ビヘイビア `CORE-1`）で
# reqwest・rustls への依存を追加した（Issue #35 で採用承認済み）。`parse`
# モジュールの本実装（TASK-24.4・Issue #38・ビヘイビア `CORE-1`）で html5ever への
# 依存を追加した（同じく Issue #35 で採用承認済み）。`dom` の走査 API 本実装は
# TASK-24.5・Issue #39 で行った（新規依存なし）。`query` の本実装（セレクタ照合・
# querySelector(All) 相当の API）は TASK-24.10・Issue #418 で行った
# （新規依存なし。stdlib と既存の `selector`/`dom` の型のみを使う）。

[package]
name = "fandhe-browser-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# root Cargo.toml の [workspace.package] コメントに明記された契約: `publish` は
# 他フィールドと異なり自動継承されないため、各 crate が明示する
# （`make check-publish-private` が機械的に検証する）。
publish.workspace = true

# TASK-41.1（Issue #169）: `state` モジュール（共通 `AppState`）が `Profile` を保持する
# ため `fandhe-browser-profile` への path 依存を追加した。AGENTS.md「crate 間の許可依存」
# で core が依存してよいと定められた workspace 内 crate であり、外部（registry）依存では
# ないため dependency-policy.md のユーザー承認の対象外（ai crate の core への path 依存が前例）。
#
# 依存最小方針（dependency-policy.md）に従い、新規依存の追加はユーザー承認制。
# いずれも Issue #35（2026-09-25 承認済み）で採用が決まった依存であり、
# `=x.y.z` 完全固定で管理する。
#
# - html5ever: 「scraper は推移的に selectors/cssparser（MPL-2.0）を core の
#   既定ビルドへ持ち込むため不採用、html5ever を単体で使い TreeSink・DOM・
#   セレクタ照合は自作する」と決定された `parse` の依存（TASK-24（24.4）・#38）。
#   markup5ever・tendril 等の推移的依存は直接依存に追加せず、`html5ever::*` の
#   再エクスポート経由でのみ使う（parse.rs 冒頭コメント参照）。
# - reqwest・rustls: `fetch`（TASK-24.2・#36）が使う HTTP クライアント。
#   root `[workspace.dependencies]` に集約し、ここでは `{ workspace = true }` で
#   参照する。
# - toml・serde: `config`（TASK-91（91.1）・Issue #214）が使う TOML パーサーと
#   (de)serialize 基盤。Issue #213（TASK-91.hdep）で承認済み（2026-09-25）。
#   `config.rs` の doc コメントの通り、serde/toml の型は公開 API に漏らさない。
[dependencies]
fandhe-browser-profile = { path = "../fandhe-browser-profile" }
html5ever = "=0.40.1"
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# fandhe-browser-js: `config` の `[js] engine` 解析（TASK-91（91.2）・Issue #215）が
# `EngineKind`・`bundled_engines` を使う。ワークスペース内の path 依存であり
# 外部（registry）クレートの追加ではない（spec の依存方向: js に依存するのは
# core のみ）。js の既定 feature は `[]` のため既定ビルドの依存グラフへ v8 等を
# 持ち込まない。`js-v8`/`js-boa` は下の `[features]` で転送する。
fandhe-browser-js = { path = "../fandhe-browser-js" }

# `JsEngineNotCompiled` のエラーメッセージが案内する `--features js-v8` /
# `--features js-boa` を core 対象のビルドでも有効にするための feature 転送
# （spec 上の担当は TASK-30（30.1）・JS-2・MS-3、Issue #159。実装は TASK-91.2・
# Issue #215・PR #578 レビュー指摘で先に導入済み）。js crate の同名 feature を
# 有効にするだけで、新規依存は増えない。既定は空のため既定ビルドの依存グラフは不変。
# cli 側の転送と `default = ["js-v8"]` は TASK-30.2（Issue #160）が担う。
[features]
default = []
js-v8 = ["fandhe-browser-js/js-v8"]
js-boa = ["fandhe-browser-js/js-boa"]

[dev-dependencies]
tokio = { workspace = true }

# TASK-91（91.2）・Issue #215: `[js] engine` の fail-closed 起動エラーを、子プロセス
# の非 0 終了・stderr として検証する結合テスト。cli は追加済み（TASK-41.5・#616）だが `[js] engine` の起動シーケンスをまだ持たないため、
# このテストバイナリ自身の再実行（`std::env::current_exe()`）で起動シーケンスを
# 模す。親が終了コードと stderr を集計する独自 `main` を持つため `harness = false`。
[[test]]
name = "config_js_engine"
harness = false

# TASK-30（30.3）・Issue #161: `js_stub` が V8 で実際に評価する結合テスト。V8 は子プロセス版の
# ため、子として再実行されたときにワーカーとして振る舞うよう独自 `main` の先頭で
# `run_js_worker_if_requested` を呼ぶ必要があり `harness = false`。V8 同梱時のみ意味を持つため
# `required-features` で既定構成のビルド対象から外す。
[[test]]
name = "js_stub_v8"
harness = false
required-features = ["js-v8"]

# TASK-32.3（`JS-1`・Issue #167）: 設定 `[js] engine = "boa"` で boa が実際に評価に使われることの
# 結合テスト。`js_stub_v8` と同じ理由で子プロセス役を兼ねるため `harness = false`。boa 同梱時のみ
# 意味を持つため `required-features` で既定構成のビルド対象から外す。
[[test]]
name = "js_stub_boa"
harness = false
required-features = ["js-boa"]

# TASK-108・Issue #778・`JS-5`: JS shim（`document` / Node 系）を V8・boa それぞれで評価する
# 結合テスト。ケース本体は `tests/support/js_shim_cases.rs` で共通。子プロセス版エンジンの
# ワーカー役を兼ねるため独自 `main`（`harness = false`）。
[[test]]
name = "js_shim_v8"
harness = false
required-features = ["js-v8"]

[[test]]
name = "js_shim_boa"
harness = false
required-features = ["js-boa"]

# TASK-109・Issue #780・`JS-4`/`JS-6`: ページスクリプトランナーを V8・boa それぞれで実行する
# 結合テスト。ケース本体は `tests/support/page_runner_cases.rs` で共通。ワーカー役を兼ねるため
# 独自 `main`（`harness = false`）。
[[test]]
name = "page_runner_v8"
harness = false
required-features = ["js-v8"]

[[test]]
name = "page_runner_boa"
harness = false
required-features = ["js-boa"]

# TASK-30・`JS-2`・Issue #513: core が再エクスポートする `run_js_worker_if_requested` のシグネチャ固定と、
# エンジン非同梱ビルドでワーカー起動要求を受けたときの fail-closed を検証する。自身を再実行する
# 独自 `main` を持つため `harness = false`。
[[test]]
name = "js_worker_hook"
harness = false

# TASK-100.6・Issue #270・`PLUG-8`: Chrome/Safari プロファイル読み込みのバイナリ増分・
# アイドル RSS 増分を測る計測専用プローブ（control は cssom_profile 非参照・profiled は読み込みあり）。
# 呼び出し元は benches/cssom_profile_cost.sh。出荷物ではない。
[[example]]
name = "cssom_profile_cost_control"
path = "../../benches/cssom_profile_cost/control.rs"

[[example]]
name = "cssom_profile_cost_profiled"
path = "../../benches/cssom_profile_cost/profiled.rs"

# TASK-106・`JS-5`・Issue #771: b5・d2・d3 のページ内 JS が要求する Web API を実測する
# 計測専用スパイク。DOM バインディングを注入しない素のエンジンで bundle を評価し、最初の
# 未定義 API 名と例外分類を JSONL で出す。取得は `Fetcher` 経由のみ。ソースは harness 配下に
# 置き、非同期取得に必要な dev-dependency の tokio を再利用するため core の example とした
# （新規依存なし）。出荷物ではない。`test = true` で自己テストを `cargo test` に載せる。
[[example]]
name = "compat_js_api_spike"
path = "../../harness/compat-practical/js_api_spike/main.rs"
test = true
