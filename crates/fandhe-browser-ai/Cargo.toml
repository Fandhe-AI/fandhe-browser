# fandhe-browser-ai の crate manifest。
#
# REPAIR-1（TASK-1・MS-1）が定める 8 crate 構成のうち、AI 最適化 API・
# プラグイン API を担う crate。本 manifest は TASK-1（旧 TASK-1.5・Issue #26）が
# 追加したビルド可能な最小骨格に、TASK-11.1（AISNAP-1・MS-2）で core への
# path 依存と snapshot モジュールのスケルトンを追加したもの。公開 API の
# 実装はまだ含まない（詳細は src/lib.rs のドキュメンテーションコメントを参照）。

[package]
name = "fandhe-browser-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# TASK-11.1（AISNAP-1・MS-2）: AGENTS.md「crate 間の許可依存」に基づき、
# ai → core への一方向 path 依存を追加した。workspace 内 path 依存であり
# registry（外部）依存は増えないため、dependency-policy.md がユーザー承認を
# 要求する「依存の追加」（外部クレートの新規採用）には該当しない
# （private crate 間の内部配線）。root の `[workspace.dependencies]` は
# render のように複数 crate が共有するケース向けであり、core の利用者は
# 現時点で本 crate のみのため、ここに直接 path 依存として書く。
# `fandhe-browser-profile` への依存は、それを必要とするタスクが出るまで
# 追加しない（依存最小方針）。
[dependencies]
fandhe-browser-core = { path = "../fandhe-browser-core" }
# TASK-19.1（Issue #223・AISNAP-6）: `/ai/snapshot` のルータ・レスポンス構築・JSON 生成。
# いずれも workspace 定義の完全固定版を参照するだけで新規バージョンは導入しない
# （fandhe-backend-* は #171、serde_json は #419 の承認範囲。cdp と同じ構成）。
# ai crate での利用を明記した承認ではないため PR レビューで可否を確認する。
fandhe-backend-http = { workspace = true }
fandhe-backend-routes = { workspace = true }
serde_json = { workspace = true }

# TASK-14.2（Issue #93・AISNAP-1・MS-2）: 生 HTML のトークン量算出に使う
# tiktoken-rs（cl100k_base）。採否は Issue #92 に記録済み。計測は benches/ に
# 閉じるため dev-dependencies のみとし、配布バイナリの依存グラフへ入れない。
[dev-dependencies]
tiktoken-rs = { workspace = true }
# api の結合テストで AppState 構築に使う Profile::open 専用（ai → profile は許可済み）
fandhe-browser-profile = { path = "../fandhe-browser-profile" }
# 結合テストの #[tokio::test]（feature は workspace 定義のまま）
tokio = { workspace = true }

# 生 HTML トークン量の計測ベンチ。独自 main で結果を stdout へ出すため
# harness = false。TASK-14.3（Issue #94・AISNAP-1）で snapshot 側の計測・削減率・平均を追加した。
[[bench]]
name = "token_reduction"
path = "benches/token_reduction.rs"
harness = false

# トークンカウント純関数のユニットテスト。bench ターゲットは libtest として
# 起動されず `cargo test --workspace` で実行されないため、別ファイルの
# [[test]] ターゲットに分ける（fandhe-browser-js の worker_spawn_latency_stats と同構成）。
[[test]]
name = "token_reduction_tokens"
path = "benches/token_reduction/tokens_tests.rs"

# 削減率算出・snapshot テキスト化のユニットテスト（TASK-14.3・Issue #94・AISNAP-1）。
[[test]]
name = "token_reduction_reduction"
path = "benches/token_reduction/reduction_tests.rs"

# 情報保持チェック（TASK-14.4・AISNAP-3・Issue #95）の判定ロジックのテスト。
# bench ターゲットは libtest として起動されないため、別 [[test]] ターゲットに分ける。
[[test]]
name = "token_reduction_retention_check"
path = "benches/token_reduction/retention_check_tests.rs"

# 生 DOM シリアライザ（TASK-14.5・AISNAP-5・Issue #96）のユニットテスト。
[[test]]
name = "token_reduction_raw_dom"
path = "benches/token_reduction/raw_dom_tests.rs"

# 巨大静的ページ単体の削減率測定（TASK-14.5・AISNAP-5・Issue #96）の具体値固定テスト。
[[test]]
name = "token_reduction_huge_static"
path = "benches/token_reduction/huge_static_tests.rs"

# 生 DOM シリアライズのトークンカウント（TASK-23.1・Issue #129・AISNAP-15）。
# bench ターゲットは cargo test で実行されないため別 [[bench]] / [[test]] に分ける。依存は増やさない。
[[bench]]
name = "raw_dom_serialize_reduction"
path = "benches/raw_dom_serialize_reduction.rs"
harness = false

[[test]]
name = "raw_dom_serialize_tokens"
path = "benches/raw_dom_serialize_reduction/raw_dom_tokens_tests.rs"

# 対生 DOM 比の削減率・平均集計テスト（TASK-23.2・Issue #130・AISNAP-15）。
# bench ターゲットは cargo test で実行されないため別 [[test]] に分ける。依存は増やさない。
[[test]]
name = "raw_dom_serialize_reduction_rows"
path = "benches/raw_dom_serialize_reduction/raw_dom_reduction_tests.rs"

# エージェント評価ハーネスのタスク定義テスト（TASK-21.1・Issue #119・AISNAP-8）。
# harness/ は cargo の自動検出対象外のため path を明示する。外部依存は増やさない。
[[test]]
name = "agent_eval_tasks"
path = "harness/agent_eval/tasks_tests.rs"

# 簡約表現生成ハーネス（TASK-21.2・Issue #120・AISNAP-8）。依存は増やさない。
[[test]]
name = "agent_eval_generate_reduced"
path = "harness/agent_eval/generate_reduced_tests.rs"

# 採点・種別別集計（TASK-21.3・Issue #121・AISNAP-8）。依存は増やさない（serde_json は既存）。
[[test]]
name = "agent_eval_score"
path = "harness/agent_eval/score_tests.rs"

# 簡約・生 DOM 両方式の比較実行ハーネス（TASK-22.2・Issue #125・AISNAP-9）。依存は増やさない。
[[test]]
name = "agent_eval_compare"
path = "harness/agent_eval/compare_tests.rs"

# 方式 B 本体の MCP エンベロープ測定ハーネス（TASK-97.1・Issue #385・PLUG-5・MS-9）。
# mcp バイナリ（別プロセス）を stdio で駆動するため mcp crate へは依存せず、依存も増やさない。
# 実行は `make measure-mcp-envelope`。unix 以外では測定不能として非 0 で終了する。
[[bench]]
name = "mcp_envelope"
path = "benches/mcp_envelope.rs"
harness = false

# JSON-RPC 純関数のユニットテスト（PLUG-5・TASK-97.1）。bench は cargo test で実行されないため別 [[test]]。
[[test]]
name = "mcp_envelope_jsonrpc"
path = "benches/mcp_envelope/jsonrpc_tests.rs"

# 統計・TSV 整形のユニットテスト（PLUG-5・TASK-97.1）。
[[test]]
name = "mcp_envelope_stats"
path = "benches/mcp_envelope/stats_tests.rs"

# 実バイナリを使う e2e smoke（PLUG-5・TASK-97.1）。#[ignore] のため `make check-mcp-envelope` が
# `--ignored` 付きで実行する。
[[test]]
name = "mcp_envelope_e2e"
path = "benches/mcp_envelope/e2e_tests.rs"
