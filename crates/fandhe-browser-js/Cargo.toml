[package]
name = "fandhe-browser-js"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 依存は追加しない（依存最小方針・TASK-1（1.3）のスコープは雛形のみ）。
# V8（rusty_v8）/ boa（boa_engine）の具体的な依存追加は TASK-29（V8）/
# TASK-32（boa）でユーザー承認を経て行う（dependency-policy.md）。
[dependencies]

# feature 名は docs/spec/04-behavior/js-engine.md（JS-1）「JS エンジンの
# 切替方式」2. の設計（js-v8 = ["dep:v8"]・js-boa = ["dep:boa_engine"]）に
# 対応する予約枠（TASK-28.1）。
#
# Cargo の `dep:` 接頭辞 feature は、対応する optional 依存が
# [dependencies] に存在しないと、その feature が無効なままでも
# manifest 解析自体（cargo build/check/metadata/test）が失敗する
# （実測で確認済み。エラーメッセージ:
# 「feature `js-boa` includes `dep:boa_engine`, but `boa_engine` is not
# listed as a dependency」）。
# そのため「dep: 接頭辞で宣言する」ことと「実依存をまだ追加しない」ことは
# 現行 Cargo の下では両立できない。依存追加はユーザー承認制
# （dependency-policy.md）であるため、本 crate は当面 `dep:` 接頭辞なしの
# プレースホルダ feature のみを宣言し、依存には結び付けない
# （実装済みを装わない。REPAIR-3）。
#
# `dep:v8` / `dep:boa_engine` への書き換えは、対応する optional 依存
# （v8 crate は TASK-29、boa_engine crate は TASK-32）をユーザー承認済みの
# 完全固定バージョン（`=x.y.z`）で追加するタイミングと同時に行う。
[features]
default = []
js-v8 = []
js-boa = []
