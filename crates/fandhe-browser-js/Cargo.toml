[package]
name = "fandhe-browser-js"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# V8（rusty_v8 = crates.io の `v8` crate）は TASK-29（29.1）・JS-1 で
# Issue #151（2026-09-25 承認）に従い追加した（dependency-policy.md）。
# `optional = true` として `js-v8` feature 経由でのみ有効化し、既定ビルド
# （`default = []`）の依存グラフには含めない（RENDER-1 の Servo 隔離と
# 同じ考え方。3 OS 一級対応の既定ビルドを軽量に保つ）。
#
# boa（boa_engine）の具体的な依存追加は TASK-32（Issue #165）でユーザー
# 承認を経て行う（dependency-policy.md）。それまで `js-boa` は
# プレースホルダ feature のまま残す。
[dependencies]
v8 = { workspace = true, optional = true }

# JS ワーカーの子プロセスが自身へ OS のメモリ上限を掛けるための依存（TASK-29・
# Issue #503。ユーザー承認 2026-09-28）。いずれも `js-v8` feature からのみ有効化し、
# 既定ビルドの依存グラフには含めない。unix は RLIMIT_DATA（rustix の safe な
# `setrlimit`）、Windows は Job Object（Win32 API を windows-sys で直接呼ぶ。unsafe は
# Win32 呼び出しに限定。ユーザー承認 2026-09-28）を使う。
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

# feature 名は docs/spec/04-behavior/js-engine.md（JS-1）「JS エンジンの
# 切替方式」2. の設計（js-v8 = ["dep:v8"]・js-boa = ["dep:boa_engine"]）に
# 対応する（TASK-28.1 が予約枠として定義し、本 TASK-29.1 で `js-v8` を
# 実依存へ結合した）。
#
# `js-v8` は `dep:v8` と結合済みだが、`v8` crate を呼び出す具象実装
# （`JsEngine` トレイトの V8 実装）はまだない。`create_engine`
# （`engine_trait.rs`）は `js-v8` 有効時も `CreateEngineError::NotYetImplemented`
# を返し続ける（実装済みを装わない。REPAIR-3）。具象実装は TASK-29 の
# 後続サブタスクで追加する。
#
# `js-boa` は Cargo の制約（`dep:` 接頭辞 feature は対応する optional
# 依存が [dependencies] に無いと feature が無効でも manifest 解析自体が
# 失敗する）により、`boa_engine` を追加する TASK-32（Issue #165）まで
# 引き続き `dep:` 接頭辞なしのプレースホルダのままにする。
[features]
default = []
js-v8 = ["dep:v8", "dep:rustix", "dep:windows-sys"]
js-boa = []
# テスト専用入口（`*_for_test`）を本番ビルドから隔離する feature（Issue
# #528・TASK-29・`JS-1`）。`process_engine` のテスト専用メソッド・
# `WorkerSpawnConfigForTest` はこの feature が有効なときだけ crate 外から
# 参照できる（無効時は非公開になり、名前自体を付けられない）。`js-v8` を
# 含めているのは、テスト専用 API が `js-v8` 配下にしか存在しないため
# （`--features test-support` だけで揃う）。
#
# 注意: 本 feature は利用側 crate（将来 core 等）の `[dev-dependencies]`
# でのみ有効化すること。`[dependencies]` で有効化すると feature
# unification により本番バイナリへテスト専用 API が再び露出する
# （dependency-policy.md の対象外だが、本番からの隔離という本 feature の
# 目的そのものを壊すため各 crate の Cargo.toml でも同じ注意を守る）。
test-support = ["js-v8"]

# JS プロセス分離（TASK-29・Issue #503 設計書 §3.1・§7 W6）の結合テスト。
# このテストバイナリ自身が自己再実行の対象になる（`main` の先頭で
# `fandhe_browser_js::run_js_worker_if_requested` を呼び、環境変数
# `FANDHE_BROWSER_JS_WORKER` が設定されていれば子プロセス役に徹する）。
# fake MCP の前例（`crates/fandhe-browser-core/Cargo.toml:67-73`）と同じ
# 理由で `harness = false` にする: 子プロセス役のときの stdout は
# `super::worker_protocol` のフレーム専用であり、通常の libtest ハーネスが
# stdout へ書く "running N tests" 等の文字列が混入すると、親（テスト本体）
# 側のフレーム読み取りが壊れる。`js-v8` feature が無効なビルドでは
# `V8ProcessEngine`（`process_engine` モジュール）自体が存在しないため、
# また `js-v8` のみ（`test-support` 無効）のビルドではテスト専用入口
# （`new_for_test` 等）自体が存在しないため、`required-features` で
# `test-support`（`js-v8` を包含）を要求して除外する（Issue #528）。
[[test]]
name = "v8_worker"
harness = false
required-features = ["test-support"]
