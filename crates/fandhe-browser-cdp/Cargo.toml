[package]
name = "fandhe-browser-cdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CDP 互換サーバー crate（fandhe-browser）。状態型は TASK-41.2、ルータは TASK-41.3、WS 受け口は TASK-41.4、プロトコル層は TASK-42"

# workspace 内 path 依存のみ（AGENTS.md「crate 間の許可依存」。registry クレートの追加ではない）
[dependencies]
fandhe-browser-core = { path = "../fandhe-browser-core" }
# `/json/*` のルータ・レスポンス構築・JSON 生成（TASK-41.3・Issue #171/#419 で承認済み）
# `/devtools/browser/{id}` の WS 受け口（TASK-41.4・Issue #173。#171 で承認済み）
fandhe-backend-core = { workspace = true }
fandhe-backend-http = { workspace = true }
fandhe-backend-routes = { workspace = true }
serde_json = { workspace = true }

# feature は新規依存を増やさない転送のみ。`test-support` は結合テスト専用の入口
# （`test_support`）を有効にする。js-v8 / js-boa は core の同名 feature を転送する。
[features]
default = []
js-v8 = ["fandhe-browser-core/js-v8"]
js-boa = ["fandhe-browser-core/js-boa"]
test-support = []

[dev-dependencies]
# テストで AppState 構築に使う Profile::open 専用
fandhe-browser-profile = { path = "../fandhe-browser-profile" }
# 結合テストの #[tokio::test]（feature は workspace 定義のまま）
tokio = { workspace = true }

# TASK-112・Issue #785・`JS-4`/`CDP-1`: `Page.navigate` がページ JS を実行した後の DOM を
# `DOM.getDocument` で取得できることと、イベント送出順を実エンジン（boa）で検証する結合テスト。
# JS ワーカー役を兼ねるため独自 `main`（`harness = false`）。
[[test]]
name = "page_scripts_navigate"
harness = false
required-features = ["js-boa", "test-support"]

# TASK-113・Issue #786・`JS-4`〜`JS-8`・`JS-1`・`PERF-7`: `Page.navigate` 入口からのページ JS 実行の結合テストと
# 上限検証（SPA 風・form 生成・例外継続・件数 / タイマー / ノード数 / シリアライズ / 実時間の各上限・SSRF）。
# ケース本体は `tests/support/page_js_cases.rs`（エンジン共通）。JS ワーカー役を兼ねるため独自 `main`。
[[test]]
name = "page_js_limits_v8"
harness = false
required-features = ["js-v8", "test-support"]

[[test]]
name = "page_js_limits_boa"
harness = false
required-features = ["js-boa", "test-support"]

# TASK-44.7・Issue #1218・`CDP-2`/`CDP-6`/`CDP-7`/`SEC-2`/`REPAIR-3`: `Runtime.evaluate`・
# `Runtime.releaseObject`・`Runtime.callFunctionOn`・`awaitPromise`（TASK-44.8・#1219）を CDP の入口から実エンジンで検証する結合テスト（プリミティブ・RemoteObject・
# 例外・ハンドル上限・結果サイズ・タイムアウト・インジェクション対策）。ケース本体は
# `tests/support/runtime_evaluate_cases.rs`（エンジン共通）。JS ワーカー役を兼ねるため独自 `main`。
[[test]]
name = "runtime_evaluate_v8"
harness = false
required-features = ["js-v8", "test-support"]

[[test]]
name = "runtime_evaluate_boa"
harness = false
required-features = ["js-boa", "test-support"]

# TASK-44.9・Issue #1220・`CDP-2`: Playwright 接続試験の実行基盤。実ケース（`test-support` +
# エンジン feature）が V8 の JS ワーカー役を兼ねるため独自 `main`（`harness = false`）。
# 自己テスト群を feature なしの `cargo test --workspace` から外さないよう `required-features` は付けない。
[[test]]
name = "playwright_flow"
harness = false
