[package]
name = "fandhe-browser-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "fandhe-browser の CLI バイナリ crate。現状は core・profile・cdp を組み立ててサーバーを起動するだけの最小雛形（TASK-41.5）で、サブコマンドは TASK-47 で追加する"

[[bin]]
name = "fandhe-browser"
path = "src/main.rs"

# workspace 内 path 依存・承認済みの workspace 依存のみ（registry クレートの追加ではない）。
# ai は AI API ルータを合成する TASK-19 まで依存に加えない。
[dependencies]
fandhe-browser-core = { path = "../fandhe-browser-core" }
fandhe-browser-profile = { path = "../fandhe-browser-profile" }
fandhe-browser-cdp = { path = "../fandhe-browser-cdp" }
# Server・BoundServer（#171 で承認済み）
fandhe-backend-core = { workspace = true }
# Router・RouterMergeError（#171 で承認済み）
fandhe-backend-routes = { workspace = true }
# ランタイム構築（#35 で承認済み。feature は workspace 定義のまま）
tokio = { workspace = true }
# render（Servo・MPL-2.0）の optional 依存。workspace 内 path 依存（TASK-33.1・#45 で登録済み。registry クレートではない）。
# `dep:` 経由でのみ有効化し、暗黙の feature は作らない
fandhe-browser-render = { workspace = true, optional = true }

# TASK-33.4・RENDER-1・MS-1（#459）: render を optional 依存に持つのは cli だけ（spec TASK-33）。
# `rendering` は既定 feature に含めないオプトイン。`dep:` 接頭辞により、外から有効にできる入口を
# `rendering` だけにする（暗黙の feature `fandhe-browser-render` を作らない）。
# 既定ビルドの依存グラフへ render が入らないことは scripts/check-render-isolation.sh の検査 B が担保する。
# 現状は依存の結線だけで挙動は変わらない（REPAIR-3）。render crate はまだ雛形で `Renderer` 実装を持たず、
# cli のコードからも参照していない。将来、core::render の描画トレイトへ render 実装を結線し
# Servo を組み込む（TASK-38・RENDER-1 系）。
[features]
# TASK-30.2・JS-2・JS-1「JS エンジンの切替方式」決定 2・3・MS-3（#160）: JS エンジンの同梱を決める
# feature 連鎖 `cli → core → js` の最上流。JS エンジンの `default` を持つのは cli だけにする
# （core / js に置くと ai・cdp 経由の feature 統合で、軽量ビルドから V8 を外せなくなるため）。
# ビルド構成の対応:
#   既定                                          = V8 のみ同梱
#   --no-default-features --features js-boa       = 軽量（boa。js 側は TASK-32・#165 までプレースホルダ）
#   --no-default-features                         = エンジンなし（JS 実行要求はエラーで、成功を装わない）
# 現状は同梱の結線だけ（REPAIR-3）。実行経路から `create_engine` はまだ呼ばれず、
# js_stub の置換は #161（TASK-30.3）、main 先頭のワーカーフックは #514 で行う。
default = ["js-v8"]
js-v8 = ["fandhe-browser-core/js-v8"]
js-boa = ["fandhe-browser-core/js-boa"]
# `rendering` は JS の feature と独立に組み合わせられる（既定には含めない）
rendering = ["dep:fandhe-browser-render"]

[dev-dependencies]
# テストでの JSON 検証（#419 で承認済み）
serde_json = { workspace = true }
# テストの追加ルータ（ai ルータ相当）が返す Response 型
fandhe-backend-http = { workspace = true }

# TASK-84.3（Issue #460・ビヘイビア PERF-1・PERF-3・PERF-6・AISNAP-1・MS-3）:
# Lightpanda 比較ベンチのホスト。TASK-84.1（Issue #211）では実ビルドを持つ member が
# core しかなく暫定で core に置いていたが、計測対象バイナリの所有者である cli へ移設した。
# core のテスト（`cargo test -p fandhe-browser-core`）からベンチ由来のプロセス起動を伴う
# 結合テストを外すことも狙い。`path` は workspace ルート直下の `benches/` を指す相対パスで
# （core・cli とも `crates/<name>/` で深さが同じためそのまま有効）、新規依存の追加ではない
# （dependency-policy.md の対象外）。ソース本体は移動していない。
[[bench]]
name = "competitor_lightpanda"
path = "../../benches/competitor_lightpanda.rs"
harness = false

[[test]]
name = "competitor_lightpanda_support"
path = "../../benches/competitor_lightpanda/support.rs"

# fixture サーバーの起動・対象プロセスとの通信・計測結果・終了コードまでを通す結合テスト
# （対象: PERF-3・PERF-6・AISNAP-1）。対象バイナリを模したローカルプロセスはこのテスト
# バイナリ自身の再実行（`std::env::current_exe()`）で実現し、役割は `--fandhe-fake-role`
# 引数で渡す。fake MCP は stdout に JSON-RPC 応答の行だけを書く契約のため、libtest の出力
# （"running N tests" 等）が混入しないよう `harness = false` にし、`measure_tests.rs`
# 自身が独自の `main` でケースを順に実行する。
[[test]]
name = "competitor_lightpanda_measure"
path = "../../benches/competitor_lightpanda/measure_tests.rs"
harness = false
