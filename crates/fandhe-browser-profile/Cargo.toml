[package]
name = "fandhe-browser-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "プロファイル分離 crate（fandhe-browser）。Profile 型の骨格・パストラバーサル防止ユーティリティ・advisory lock・ProfileStore・OS 慣習パス解決・明示指定による上書きを実装（TASK-50（50.1・50.2・50.3）・TASK-60（60.2・60.3・60.4）・TASK-61（61.1）Windows 長パス変換）"

# unix 限定。ディレクトリハンドル基準の openat/mkdirat/fchmod で TOCTOU を
# 解消するために使う（PR #437 レビュー指摘対応・ビヘイビア PROF-1）。
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# Windows 限定。親ディレクトリのハンドル相対で子を作成・open する NtCreateFile を
# `src/win32.rs` に隔離して呼ぶために使う（ビヘイビア PROF-1・PROF-4・XOS-10）。
# Issue #947 のオーナー承認（2026-10-12）の範囲: 直接依存の追加と、`unsafe` を
# profile crate の `cfg(windows)` モジュール 1 つに限ること。バージョンと基本 feature は
# workspace の `=0.61.2` を継承し、ここでは NtCreateFile に必要な feature だけを加算する。
# `Win32_UI_Shell`（SHGetKnownFolderPath・FOLDERID_LocalAppData）と `Win32_System_Com`
# （CoTaskMemFree）は既知フォルダ API（Issue #951）用。いずれも既存の依存への feature 追加のみ。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  # 新規ルートの保護付き DACL（SDDL 変換・読み戻し。Issue #952。#947 承認範囲の feature 追加のみ）
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_UI_Shell",
] }
