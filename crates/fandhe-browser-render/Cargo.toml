[package]
name = "fandhe-browser-render"
version.workspace = true
edition.workspace = true
license.workspace = true
# ルート Cargo.toml の [workspace.package] コメントが定める契約: `publish` は
# 他フィールドと異なり自動継承されないため、各 crate 側で明示しないと Cargo の
# 既定値 `publish = true` になってしまう。`make check-publish-private` が
# 全 member crate に対してこの明記を機械検証する。
publish.workspace = true

[dependencies]
# プロトコル型・コーデック（TASK-38・#989）。workspace 承認済み（Issue #419）の固定版への
# 辺を足すだけで、新しいパッケージは Cargo.lock に入らない。serde（derive）は core 限定の
# 配置方針のため使わず、`Value` から手作業で解釈する。
serde_json = { workspace = true }
# feature `rendering` は cli 側に定義済み（TASK-33.4・#459。workspace 登録は #45）で、
# 本 crate を optional 依存として有効化する。Servo（MPL-2.0）の導入は TASK-38
# （ビヘイビア RENDER-1）でユーザー承認を経て行う。

# 偽ホスト結合テスト（TASK-38・#994）。テストバイナリ自身が `--stdio` 付きで再実行されて
# 偽ホストとして動く。そのときの stdout はフレーム専用で、libtest の出力が混ざると壊れるため
# `harness = false` にして自前の main を持つ（js の `v8_worker`、core の
# `config_js_engine` が先例）。feature 条件は付けず既定の `cargo test` で実行する。
[[test]]
name = "host_process"
harness = false
