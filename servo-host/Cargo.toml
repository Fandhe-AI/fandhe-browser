# Servo ホスト（fandhe-browser-servo-host）の manifest。
#
# 役割: Servo（MPL-2.0）を本体の依存グラフから隔離するため、本体の workspace とは
# 別の workspace・別の Cargo.lock を持つ単一 package として置く（#915・#935。
# docs/design/servo-host-design.md §1.1〜§1.3）。ルート Cargo.toml は
# `exclude = ["servo-host"]` で本ディレクトリを物理的に除外している。
# Servo は #988（TASK-38）で `=0.6.0` 完全固定・default-features 無効で追加した
# （`baked-in-resources` は起動に必須。オーナー承認 2026-10-15）。`dpi`・`url` は未承認のため
# 直接依存にせず、Servo の再エクスポート（`ServoUrl` 等）を使う。`image` はスクリーンショットの PNG エンコード用に
# #232 の記載（オーナー承認 2026-10-15）に基づき `png` 機能のみで追加した（Cargo.lock に同版が既にあり新規 crate は増えない）。
# `serde_json` は stdio サーバー（#993）のフレーム JSON 用（オーナー承認済み。Servo 経由で
# Cargo.lock に同版が既にあり新規 crate は増えない）。`serde` の derive は未承認で使わない。toolchain は親ディレクトリの
# rust-toolchain.toml を rustup が探索して使う（ここにはコピーを置かない）。

[package]
name = "fandhe-browser-servo-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fandhe-browser-servo-host"
path = "src/main.rs"

[dependencies]
servo = { version = "=0.6.0", default-features = false, features = ["baked-in-resources"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# 本体とは独立した workspace ルートであることを宣言する（空テーブル）。
[workspace]

# ルート Cargo.toml の [profile.release] と同一にする（本体と同じサイズ最小化方針。
# `[profile.*]` は workspace ルートでしか効かないため、本 workspace にも複製が要る）。
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
