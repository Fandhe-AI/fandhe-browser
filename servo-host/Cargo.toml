# Servo ホスト（fandhe-browser-servo-host）の manifest。
#
# 役割: Servo（MPL-2.0）を本体の依存グラフから隔離するため、本体の workspace とは
# 別の workspace・別の Cargo.lock を持つ単一 package として置く（#915・#935。
# docs/design/servo-host-design.md §1.1〜§1.3）。ルート Cargo.toml は
# `exclude = ["servo-host"]` で本ディレクトリを物理的に除外している。
# Servo は #988（TASK-38）で `=0.6.0` 完全固定・default-features 無効で追加した
# （`baked-in-resources` は起動に必須。オーナー承認 2026-10-15）。#1297 で `=0.7.0` に上げた
# （オーナー承認 2026-10-28）。0.7.0 は LTS ではない月次版で、spec の採用版（0.6 LTS 系列。#229）を
# 一時的に緩めている。MDN のハング（servo/servo#45915）の修正を取り込み IntersectionObserver を
# 有効にするためで、修正を含む次の LTS が出たら LTS 系列へ戻す。`dpi` は未承認のため
# 直接依存にせず、Servo の再エクスポート（`ServoUrl` 等）を使う。`url` は通知の型のためだけに足した（下の `[dependencies]`）。`image` はスクリーンショットの PNG エンコード用に
# #232 の記載（オーナー承認 2026-10-15）に基づき `png` 機能のみで追加した（Cargo.lock に同版が既にあり新規 crate は増えない）。
# `serde_json` は stdio サーバー（#993）のフレーム JSON 用（オーナー承認済み。Servo 経由で
# Cargo.lock に同版が既にあり新規 crate は増えない）。`serde` の derive は未承認で使わない。toolchain は親ディレクトリの
# rust-toolchain.toml を rustup が探索して使う（ここにはコピーを置かない）。
#
# crates.io の公開対象（オーナー判断 2026-11-07・#1541。`cargo install` した CLI の `screenshot` が
# ホストを使えるようにするため）。crate に入るのは自前のコードと Cargo.lock だけで、Servo のソースは含まない
# （依存として crates.io の servo を取得する）。ビルドしたバイナリには MPL-2.0 が適用される（NOTICE）。
# 隔離（別 workspace・本体の依存グラフに入れない）は変わらない。対象は macOS・Linux で、Windows は対象外。

[package]
name = "fandhe-browser-servo-host"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Out-of-process Servo rendering host of fandhe-browser (built binary includes MPL-2.0 components)"
repository = "https://github.com/Fandhe-AI/fandhe-browser"
readme = "README.md"
# 公開 package から外す開発用ファイル（Windows 向け rustflags と cargo-deny / cargo-about 設定）。
exclude = ["/.cargo/", "/about.toml", "/deny.toml"]

[[bin]]
name = "fandhe-browser-servo-host"
path = "src/main.rs"

[dependencies]
# 版を上げるときは servo-net の `disk_cache.rs` `storage_dir()` の分岐を再確認する
# （engine.rs の `DISABLED_HTTP_DISK_CACHE` の前提。RUSTSEC-2026-0459）。
servo = { version = "=0.7.0", default-features = false, features = ["baked-in-resources"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# `WebViewDelegate::notify_url_changed` の引数の型（`url::Url`。servo は再エクスポートしない）を書くためだけに使う。
# 操作モードの文書番号（`doc_seq`）を URL 変更の通知で上げるため（TASK-121 の確定条件 3・#1582。オーナー承認 2026-11-18）。
# Cargo.lock に servo 経由で同版が既にあり、新しい crate は増えない。servo の版を上げるときは、servo が使う
# `url` の版に合わせて同時に上げる（型が一致しないとトレイトを実装できない）。
url = "=2.5.8"
# WebDriver の命令（`Servo::execute_webdriver_command`）の答えの受け口（`generic_channel::channel`）と、閲覧文脈の
# ID（`id::BrowsingContextId`）を作るためだけに使う。servo が再エクスポートしないため直接依存にする（操作モードの
# クリックを、ページが偽れない Rust 側の判定〔画面に入るか・他の要素に隠れていないか〕で確かめる。TASK-126・
# 設計 §14.4・試作 (4)。オーナー承認 2026-11-19）。Cargo.lock に servo 経由で同版が既にあり、新しい crate は増えない
# （MPL-2.0。servo-host の workspace だけ）。servo の版を上げるときは同じ版へ同時に上げる。
servo-base = "=0.7.0"

# Unix のみ。Servo 0.7.0 は `alert()` の文字列をプロセスの stdout へ無条件に書く（`servo-script` の
# `Window::Alert`）。stdout はフレーム専用のため、起動直後に fd 1 を捨てる先（/dev/null）へ付け替え、フレームは
# 複製した fd へ書く（#1597・設計 §2.1）。`dup2_stdout` は safe な関数で、自前の `unsafe` は足さない。
# servo 経由で既に入っている crate で、新しい crate は増えない（MIT / Apache 系。オーナー承認 2026-11-19）。
# 版は RUSTSEC-2026-0486（1.1.5 の xattr 系の unsound。修正は 1.1.6）を避けるため 1.1.6 にした。servo の版を
# 上げるときは servo が使う rustix の版と合わせて見直す。
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "stdio"] }

# Windows のみ ANGLE（mozangle）を既定にする `no-wgl` を足す（#999・オーナー承認 2026-10-16）。
# 既定の WGL バックエンドは GPU の無い環境で WGL_NV_DX_interop が無く software rendering context を
# 作れない。ANGLE なら D3D11 WARP で動く。feature は上の `servo` と統合され、Linux・macOS は変わらない。
# 実行時に libEGL.dll・libGLESv2.dll（mozangle の OUT_DIR）が exe の隣か PATH に要る。
[target.'cfg(windows)'.dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["baked-in-resources", "no-wgl"] }

# 本体とは独立した workspace ルートであることを宣言する（空テーブル）。
[workspace]

# ルート Cargo.toml の [profile.release] と同一にする（本体と同じサイズ最小化方針。
# `[profile.*]` は workspace ルートでしか効かないため、本 workspace にも複製が要る）。
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
