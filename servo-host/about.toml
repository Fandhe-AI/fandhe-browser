# cargo-about 設定（Servo ホスト。TASK-78.2・OSS-4）。`make license-inventory-servo-host`
# （scripts/about.sh servo-host）が、別 workspace・別 Cargo.lock の servo-host の
# 全依存ツリーの「解決後ライセンス一覧」を生成する。
#
# 同期の約束: `accepted` は servo-host/deny.toml の [licenses].allow、`targets` は同 [graph].targets、
# [webpki-roots] の例外は同 [[licenses.exceptions]] と一致させる。変更時は両ファイルを同時に更新する。
# MPL-2.0 を許可するのは Servo ホストだけ（licensing.md・RENDER-1・#915）。
# servo-host/deny.toml が all-features = false のため、一覧生成でも --all-features は付けない。

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

ignore-build-dependencies = false
ignore-dev-dependencies = false

[private]
# 自リポの workspace crate を外す。理由はルートの about.toml と同じ（cargo-about 0.9.2 の panic 回避）。
ignore = true

[webpki-roots]
# servo-host/deny.toml の exceptions と同じ 1 件だけ（CDLA-Permissive-2.0）。
accepted = ["CDLA-Permissive-2.0"]
