            exit 0
          fi
          echo "node is missing or older than 22; installing v${NODE_VERSION} from nodejs.org"
          # macos-latest は Apple Silicon（arm64）
          archive="node-v${NODE_VERSION}-darwin-arm64.tar.gz"
