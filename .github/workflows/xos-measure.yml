          retention-days: 30
          if-no-files-found: error

  # Windows 版。run_core.sh は Git Bash で動かす。Windows のバイナリは XDG_DATA_HOME・HOME を見ず `%LOCALAPPDATA%` を使うため、
  # 既定では起動不可（実プロファイルに触れる恐れ）。--windows-localappdata-profile でオプトインし、`launch --profile-dir` で
  # %LOCALAPPDATA% 配下の一時領域へ隔離して起動する（XOS-7・XOS-10。使い捨ての runner なので既定プロファイルへの影響もない）
  compat-practical-windows:
    if: ${{ inputs.suite == 'compat-practical' }}
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      REPEAT: ${{ inputs.repeat }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "入力の検証（repeat は 1〜5）"
        run: |
          case "$REPEAT" in
            [1-5]) ;;
            *) echo "error: repeat must be an integer in 1..5 (got: ${REPEAT})" >&2; exit 1 ;;
          esac
      - name: "node 22 以上の確認・導入（sha256 照合）"
        shell: pwsh
        run: |
          $ok = $false
          try {
            node -e "process.exit(typeof WebSocket === 'function' ? 0 : 1)"
            $ok = ($LASTEXITCODE -eq 0)
          } catch {
            $ok = $false
          }
          if ($ok) {
            Write-Host "node is sufficient: $(node --version)"
            exit 0
          }
          Write-Host "node is missing or older than 22; installing v$env:NODE_VERSION from nodejs.org"
          $work = Join-Path $env:RUNNER_TEMP 'node-dl'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work "node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" `
            -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:NODE_SHA256_WIN_X64) {
            Write-Host "::error::node zip sha256 mismatch (got: $hash)"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $work
          "$work\node-v$env:NODE_VERSION-win-x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "ツールの確認"
        run: |
          node --version
          node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)' \
            || { echo "error: Node 22+ (built-in WebSocket) is required" >&2; exit 1; }
          for t in jq curl; do
            command -v "$t" >/dev/null 2>&1 || { echo "error: $t is required but was not found on PATH" >&2; exit 1; }
          done
          jq --version
          curl --version | head -n 1
      - name: "[cli] cargo build --release（既定 feature）"
        run: cargo build --release --locked -p fandhe-browser-cli
      - name: "[compat-practical] 実行（--page-js v8 --page-modules × ${{ inputs.repeat }} 回）"
        run: |
          OUT_UNIX="$(cygpath -u "$RUNNER_TEMP")/compat-practical"
          bash harness/compat-practical/repeat_core.sh --repeat "$REPEAT" --bin target/release/fandhe-browser.exe \
            --out-dir "$OUT_UNIX" --page-js v8 --page-modules --windows-localappdata-profile
      - name: "[compat-practical] 集計表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          OUT_UNIX="$(cygpath -u "$RUNNER_TEMP")/compat-practical"
          if [ -f "$OUT_UNIX/summary.md" ]; then
            cat "$OUT_UNIX/summary.md"
            cat "$OUT_UNIX/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[compat-practical] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-practical-windows
          path: ${{ runner.temp }}\compat-practical
          retention-days: 30
          if-no-files-found: error
