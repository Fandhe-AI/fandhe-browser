name: XOS Measure

# 3 OS の GitHub ホステッドランナーで、人間担当の計測 2 件の「実機」計測を行う手動専用 workflow
# （オーナー承認 2026-10-29: 3 OS の実機を GitHub ホステッドランナーで代替してよい。手動実行専用の workflow を追加してよい）。
#   suite=cli-conformance  TASK-49（#292）。CLI 基本操作コマンドのコンフォーマンステストを 3 OS で実行する
#                          （仕様 docs/design/cli-conformance-tests.md・実体 harness/cli-conformance/run.sh。CLI-1）
#   suite=compat-practical TASK-59（#294）。PoC-1 の代表タスクを 3 OS で実行し動作率の差を見る
#                          （harness/compat-practical/repeat_core.sh。22 件と 28 件の両方の成功数を出す。MEAS-4・COMPAT-4）
#   suite=egress-isolation Servo ホストの egress 隔離を macOS・Windows で実測する（#1387・TASK-38・RENDER-3。
#                          harness/egress-isolation/measure.py。macOS は Seatbelt、Windows は baseline と
#                          AppContainer〔ctypes のランチャー。#1396・loopback の切り分けつき〕。ubuntu は対象外）
#   suite=egress-host      render の real_host で、隔離（Linux: bwrap・macOS: sandbox-exec）下の実 Servo ホストを検証する
#                          （#1437・TASK-38・RENDER-3。`render3_egress_*` の 3 本。Windows は対象外〔既知の制約 D〕。
#                          起動例: gh workflow run xos-measure.yml -f suite=egress-host）
#                          egress-host-ubuntu はさらに host-capture（#1461）で、隔離下の Servo ホストの DNS・UDP・直接 TCP 送信を
#                          host netns の外から tcpdump で観測する。sudo は tcpdump の導入・起動・停止だけに使う
#                          （使い捨てランナー限定。オーナー承認 2026-11-03〔#1457 のコメント〕）
#                          egress-host-ubuntu は ubuntu-latest と ubuntu-22.04（AppArmor の userns 制限なし。#1487・#1457）の matrix
# Windows の egress-isolation は #1401 で opt-in のループバック免除（CheckNetIsolation LoopbackExempt。ハーネスが作った
# AppContainer の SID だけ・計測後に解除）を付ける（オーナー承認 2026-11-01。使い捨て runner に限る）。
# macOS の egress-isolation は sudo なしの `log show` で拒否行を取る（#1402。実測で sudo・`log config` が不要と分かり、
# オーナー判断 2026-11-01 で opt-in を削除した。ハーネス自身は sudo を使わない）。
# 本 workflow は計測結果を出すだけで、合否・OS 間の差の判定はしない（判定は人間。.claude/rules/delegation-impl.md）。
#
# 設計上の位置づけ:
# - on: workflow_dispatch のみ。pull_request・push・schedule では動かない（ci.yml の required checks に影響しない）。
#   ここで出る check-run は required に登録しない（登録すると PR で pending のままになりマージできなくなる）。
# - ci.yml とは別 workflow にする理由: ci.yml が出す check-run はすべて required にする規約のため、非 required の
#   補助ジョブを足せない（.claude/rules/ci.md「ジョブ構成と required checks」）。bench-competitor.yml と同じ事情。
# - ジョブは OS × suite の明示ジョブ 10 本（egress-isolation は macOS・Windows、egress-host は ubuntu・macOS のみ。
#   egress-host-ubuntu だけは同じ Ubuntu 系の 2 版〔latest・22.04〕で前提ステップが同じため matrix。#1487）。
#   required にしないので matrix でもよいが、OS ごとに前提ステップの形が
#   大きく違う（Windows は Servo の MSVC v143・ATL・MozTools・ANGLE、macOS は LLVM_OBJDUMP）ため、
#   matrix にすると `if: runner.os` だらけになる。timeout も suite × OS で違う。
# - concurrency は設けない。計測はジョブごとに別 VM で、固定ポート（9333）は VM 内で閉じる。途中キャンセルしない。
# - cache は使わない。dispatch の単発計測で、cache を足すと 1 世代 10GB の予算（github-actions.md）を圧迫する。
# - 外部アクセス: cli-conformance は example.com のみ（仕様書 2.3）。compat-practical は tasks.json の 28 サイト
#   （実ネットワーク。runner の IP 帯により一部サイトの応答が変わりうる点が結果に混ざる）。
# - サードパーティ action は ci.yml・bench-competitor.yml と同じ SHA 固定のもの（checkout・dtolnay/rust-toolchain・
#   upload-artifact）だけ。node 22 未満の runner には nodejs.org の公式アーカイブを sha256 照合して導入する。
#
# egress-isolation の macOS 実測（#1415）: 拒否ログの取りこぼしが件数によるか時間によるかを測るため、遮断される予熱の回数と
# 予熱後の待ち時間を入力で変えられる（egress_warmup_count: 0〜10、egress_warmup_wait_ms: 0〜30000。macOS のみ）。入力は env 経由で
# 渡し、シェルで形式と範囲を検証してから measure.py へ渡す（run: に直接展開しない）。
#   gh workflow run xos-measure.yml -f suite=egress-isolation -f egress_warmup_count=1 -f egress_warmup_wait_ms=5000
#
# 起動例（main へマージ後）:
#   gh workflow run xos-measure.yml -f suite=cli-conformance
#   gh workflow run xos-measure.yml -f suite=compat-practical -f repeat=3
#   gh workflow run xos-measure.yml --ref <ブランチ> -f suite=cli-conformance   # 検証用（ブランチに本ファイルがあること）

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "実行する計測（cli-conformance: TASK-49 / compat-practical: TASK-59 / egress-*: #1387・#1437）"
        type: choice
        required: true
        options:
          - cli-conformance
          - compat-practical
          - egress-isolation
          - egress-host
      repeat:
        description: "compat-practical の繰り返し回数（1〜5。cli-conformance では使わない）"
        type: string
        required: false
        default: "3"
      egress_warmup_count:
        description: "egress-isolation（macOS）の遮断される予熱の回数（0〜10。#1415。他の suite では使わない）"
        type: string
        required: false
        default: "5"
      egress_warmup_wait_ms:
        description: "egress-isolation（macOS）の予熱後の待ち時間 ms（0〜30000。#1415。他の suite では使わない）"
        type: string
        required: false
        default: "0"

permissions:
  contents: read

env:
  # compat-practical で node 22 未満のときに導入する版。sha256 は https://nodejs.org/dist/v22.23.4/SHASUMS256.txt から
  # 転記した固定値（取得元と同じサーバーから都度引かない）。更新時は 3 つとも同じ版で取り直す
  NODE_VERSION: "22.23.4"
  NODE_SHA256_LINUX_X64: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
  NODE_SHA256_DARWIN_ARM64: c9e1dbc748b33ed2d14f42445191ecaf14c56259c7a9a26d0042c49ec2b66428
  NODE_SHA256_WIN_X64: cbc74b5e0982c9dbb41525fd8fb5dcd32fbee237863f7829072f4639a1ce5f20

jobs:
  # --------------------------------------------------
  # cli-conformance（TASK-49・#292）
  # --------------------------------------------------
  cli-conformance-ubuntu:
    if: ${{ inputs.suite == 'cli-conformance' }}
    runs-on: ubuntu-latest
    # 参考: servo-host-ubuntu の cache なし・release 込み 49 分（run 38779636655）のうち release ビルドは約 15 分。
    # 本ジョブは CLI の release ビルドと Servo ホストの release ビルド（いずれも cache なし）+ 実行
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: |
          echo "SERVO_HOST_TARGET_DIR=$RUNNER_TEMP/servo-host-release" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/cli-conformance" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "Servo ホストの system 依存の確認・導入"
        run: |
          df -h /
          sudo apt-get update -qq
          # docs/setup/linux.md の apt パッケージ（Ubuntu 公式リポジトリのみ。servo-host-ubuntu と同じ）
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev libssl-dev \
            llvm
          for t in clang cmake pkg-config python3 make llvm-objdump jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
      - name: "[cli] cargo build --release（既定 feature）"
        run: cargo build --release --locked -p fandhe-browser-cli
      - name: "[servo-host] cargo build --release"
        run: cargo build --manifest-path servo-host/Cargo.toml --locked --release --target-dir "$SERVO_HOST_TARGET_DIR"
      - name: "[servo-host] --selftest"
        run: |
          out="$("$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" --selftest)"
          echo "$out"
          case "$out" in "selftest ok:"*) ;; *) echo "error: unexpected --selftest output" >&2; exit 1 ;; esac
      - name: "[cli-conformance] 自己テスト"
        run: bash harness/cli-conformance/self-test.sh
      - name: "[cli-conformance] 実行"
        run: |
          mkdir -p "$OUT_DIR"
          node --version || echo "note: node not found (CT-LAUNCH-E2 will be recorded as unmet)"
          bash harness/cli-conformance/run.sh \
            --bin target/release/fandhe-browser \
            --render-host "$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" \
            --out-jsonl "$OUT_DIR/results.jsonl" --out-md "$OUT_DIR/results.md"
      - name: "[cli-conformance] 結果表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/results.md" ]; then
            cat "$OUT_DIR/results.md"
            cat "$OUT_DIR/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[cli-conformance] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-conformance-ubuntu
          path: ${{ runner.temp }}/cli-conformance
          retention-days: 30
          if-no-files-found: error

  cli-conformance-macos:
    if: ${{ inputs.suite == 'cli-conformance' }}
    runs-on: macos-latest
    # 参考: servo-host-macos の release 込み 35.3 分（release ビルド 23.9 分。run 40396545036）に CLI の release ビルドと実行が加わる
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: |
          echo "SERVO_HOST_TARGET_DIR=$RUNNER_TEMP/servo-host-release" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/cli-conformance" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "Servo ホストの system 依存の確認"
        run: |
          df -h /
          # servo-host-macos と同じ。mozjs_sys の configure（LLVM_OBJDUMP）は llvm-objdump を要求する。
          # Xcode 同梱の LLVM 系 objdump を xcrun で探し、LLVM_OBJDUMP でパスを渡す（PATH は変えない）
          objdump=""
          for name in llvm-objdump objdump; do
            if found="$(xcrun --find "$name" 2>/dev/null)" && [ -x "$found" ]; then
              objdump="$found"
              break
            fi
          done
          if [ -z "$objdump" ]; then
            echo "error: neither llvm-objdump nor objdump was found via xcrun" >&2
            exit 1
          fi
          echo "LLVM_OBJDUMP=$objdump" >> "$GITHUB_ENV"
          echo "LLVM_OBJDUMP: $objdump"
          for t in clang cmake pkg-config python3 make jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
      - name: "[cli] cargo build --release（既定 feature）"
        run: cargo build --release --locked -p fandhe-browser-cli
      - name: "[servo-host] cargo build --release"
        run: cargo build --manifest-path servo-host/Cargo.toml --locked --release --target-dir "$SERVO_HOST_TARGET_DIR"
      - name: "[servo-host] --selftest"
        run: |
          out="$("$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" --selftest)"
          echo "$out"
          case "$out" in "selftest ok:"*) ;; *) echo "error: unexpected --selftest output" >&2; exit 1 ;; esac
      - name: "[cli-conformance] 自己テスト"
        run: bash harness/cli-conformance/self-test.sh
      - name: "[cli-conformance] 実行"
        run: |
          mkdir -p "$OUT_DIR"
          node --version || echo "note: node not found (CT-LAUNCH-E2 will be recorded as unmet)"
          bash harness/cli-conformance/run.sh \
            --bin target/release/fandhe-browser \
            --render-host "$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" \
            --out-jsonl "$OUT_DIR/results.jsonl" --out-md "$OUT_DIR/results.md"
      - name: "[cli-conformance] 結果表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/results.md" ]; then
            cat "$OUT_DIR/results.md"
            cat "$OUT_DIR/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[cli-conformance] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-conformance-macos
          path: ${{ runner.temp }}/cli-conformance
          retention-days: 30
          if-no-files-found: error

  # Windows 版。前提検証（SDK・MSVC v143・ATL・Python・uv・libclang・MozTools）は ci.yml の servo-host-windows と同一内容
  # （ci.yml は変えないため写している。更新時は両方を揃える）。inline pwsh は servo-host-windows の既存例外を引き継ぐ。
  cli-conformance-windows:
    if: ${{ inputs.suite == 'cli-conformance' }}
    runs-on: windows-latest
    # servo-host-windows の release 込み 57.6 分（dev 21.1 分 + release 27.9 分。run 40396545036）から dev を除き、
    # CLI の release ビルドと実行を足した見込み × 約 1.5
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      # Servo ホストの release の出力先。C: の空きが少ないため D:（空きの多い短いパス。servo-host-windows と同じ）
      SERVO_HOST_TARGET_DIR: D:\sr
      # Servo の Windows 前提の下限（XOS-6）
      MIN_WINDOWS_SDK: "10.0.19041.0"
      # v143 向け C++ ATL の VS コンポーネント ID（VS 2026 の 14.44 サイドバイサイド）
      ATL_V143_COMPONENT: Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL
      # uv は完全固定（win_amd64 wheel の sha256 で完全性を検証）
      UV_VERSION: "0.12.20"
      UV_WHEEL_SHA256: 1502e03f4da3280cbb493d356d59bdd401bf23197cd71df64e1c6feac156090c
      # MozTools は完全固定（zip の sha256 で検証）。build.rs の MOZTOOLS_VERSION と版を揃える
      MOZTOOLS_VERSION: "4.0"
      MOZTOOLS_URL: https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip
      MOZTOOLS_ZIP_SHA256: cceb354767ef3dad8813e63cb95ed081814225bf5fa15bfa083aa8b31a339153
    steps:
      - name: "長パスの有効化と空き容量の記録"
        run: |
          git config --global core.longpaths true
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      # CLI を先にビルドする。以降のステップが vcvarsall の環境（INCLUDE・LIB 等）を GITHUB_ENV へ足す前の、
      # runner 既定の環境で本体をビルドして、Servo 向けの前提が本体のビルドに影響しないようにする。
      # ルート .cargo/config.toml の +crt-static（#917）が効く本体のビルドで、CARGO_ENCODED_RUSTFLAGS は設定しない
      - name: "[cli] cargo build --release（既定 feature）"
        run: cargo build --release --locked -p fandhe-browser-cli
      - name: Windows SDK の検証
        run: |
          $min = [version]$env:MIN_WINDOWS_SDK
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $found = @()
          if (Test-Path $root) {
            $found = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Name } |
              Where-Object { $_ -ge $min } | Sort-Object -Descending
          }
          if ($found.Count -eq 0) {
            Write-Host "::error::Windows SDK >= $min not found under $root"
            exit 1
          }
          Write-Host "Windows SDK: $($found[0])"
      - name: VS と MSVC v143 ツールセットの検証
        run: |
          $vsInstaller = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $vsInstaller 'vswhere.exe'
          $installPath = & $vswhere -products * -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installPath)) {
            Write-Host "::error::Visual Studio with the MSVC toolset not found"
            exit 1
          }
          $installPath = $installPath.Trim()
          $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
          # v143 のうち ATL 導入対象（ATL_V143_COMPONENT）と対になる 14.44 系のみを
          # 検証対象にする（ATL は 14.44 固定のため、別版を選ぶと atlbase.h が見つからない）
          $v143 = @()
          if (Test-Path $msvcRoot) {
            $v143 = Get-ChildItem $msvcRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Where-Object { [version]$_.Name -ge [version]'14.44' } |
              Where-Object { [version]$_.Name -lt [version]'14.45' } |
              Sort-Object { [version]$_.Name } -Descending
          }
          if ($v143.Count -eq 0) {
            Write-Host "::error::MSVC v143 toolset 14.44 (paired with the ATL component) not found under $msvcRoot"
            exit 1
          }
          Write-Host "VS: $installPath"
          Write-Host "MSVC v143 toolset: $($v143[0].Name)"
          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSVC_V143_DIR=$($v143[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: v143 向け C++ ATL の検証（無ければ導入）
        run: |
          $header = Join-Path $env:MSVC_V143_DIR 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            Write-Host "ATL for v143 not found; installing $env:ATL_V143_COMPONENT"
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$env:VS_INSTALL_PATH`"",
              '--add', $env:ATL_V143_COMPONENT,
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Write-Host "::error::VS Installer failed with exit code $($p.ExitCode)"
              exit 1
            }
          }
          if (-not (Test-Path $header)) {
            Write-Host "::error::C++ ATL for v143 (atlbase.h) not found under $env:MSVC_V143_DIR"
            exit 1
          }
          Write-Host "C++ ATL for v143: $header"
      - name: Python の検証
        run: |
          $out = python --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^Python 3\.') {
            Write-Host "::error::Python 3.x not found (got: $out)"
            exit 1
          }
          Write-Host $out
      - name: uv の導入（バージョン・ハッシュ固定）
        run: |
          # 導入済みの uv があっても sha256 検証を必ず通すため、まず wheel を
          # 明示取得（--require-hashes で検証）し、その wheel を強制再導入する
          $work = Join-Path $env:RUNNER_TEMP 'uv-wheel'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $req = Join-Path $work 'uv-requirements.txt'
          "uv==$env:UV_VERSION --hash=sha256:$env:UV_WHEEL_SHA256" | Out-File -FilePath $req -Encoding ascii
          python -m pip download --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps -d $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::hash-verified download of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          python -m pip install --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps --force-reinstall `
            --no-index --find-links $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          # 出力は "uv 0.12.20 (<hash> <date> <target>)" 形式のため前方一致で比較する
          $ver = python -m uv --version
          if ($LASTEXITCODE -ne 0 -or $ver -notlike "uv $env:UV_VERSION *") {
            Write-Host "::error::unexpected uv version: $ver"
            exit 1
          }
          Write-Host $ver
      - name: "MSVC v143 環境の選択（vcvarsall -vcvars_ver）"
        run: |
          $vcvars = Join-Path $env:VS_INSTALL_PATH 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) {
            Write-Host "::error::vcvarsall.bat not found: $vcvars"
            exit 1
          }
          $ver = Split-Path $env:MSVC_V143_DIR -Leaf
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'VCToolsInstallDir',
            'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion',
            'UniversalCRTSdkDir', 'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkVerBinPath')
          $lines = cmd /c "`"$vcvars`" x64 -vcvars_ver=$ver >nul && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::vcvarsall.bat failed with exit code $LASTEXITCODE"
            exit 1
          }
          $tools = $null
          foreach ($line in $lines) {
            if ($line -match '^([A-Za-z0-9_]+)=(.*)$' -and $allowed -contains $Matches[1]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              if ($Matches[1] -eq 'VCToolsVersion') { $tools = [version]$Matches[2].Trim() }
            }
          }
          if ($null -eq $tools -or $tools -lt [version]'14.30' -or $tools -ge [version]'14.50') {
            Write-Host "::error::VCToolsVersion is not v143 (got: $tools)"
            exit 1
          }
          Write-Host "VCToolsVersion: $tools"
      - name: "libclang の検出（bindgen 用）"
        run: |
          $dirs = @("$env:ProgramFiles\LLVM\bin", "${env:ProgramFiles(x86)}\LLVM\bin")
          $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            Write-Host "::error::libclang.dll not found under $($dirs -join ', ')"
            exit 1
          }
          Write-Host "LIBCLANG_PATH: $found"
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # mozjs_sys の build.rs が llvm-objdump を要求するため、同じ LLVM の bin を PATH に足す
          if (-not (Get-Command llvm-objdump -ErrorAction SilentlyContinue)) {
            "$found" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: "MozTools の導入（バージョン・ハッシュ固定）"
        run: |
          # mozjs_sys の build.rs（find_moztools）は MOZTOOLS_PATH を最優先で使う。zip を取得・sha256 照合・展開して指す
          $work = Join-Path $env:RUNNER_TEMP 'moztools'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work 'moztools.zip'
          Invoke-WebRequest -Uri $env:MOZTOOLS_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:MOZTOOLS_ZIP_SHA256) {
            Write-Host "::error::moztools zip sha256 mismatch (got: $hash)"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          $dest = Join-Path $work 'x'
          Expand-Archive -Path $zip -DestinationPath $dest
          Remove-Item $zip -Force
          # zip の最上位は moztools-<版> ディレクトリ（msys2/ と bin/mozmake.exe を含む）
          $root = Join-Path $dest "moztools-$env:MOZTOOLS_VERSION"
          foreach ($rel in @('bin\mozmake.exe', 'msys2\usr\bin')) {
            if (-not (Test-Path (Join-Path $root $rel))) {
              Write-Host "::error::unexpected moztools layout: missing $rel under $root"
              exit 1
            }
          }
          Write-Host "MOZTOOLS_PATH: $root"
          "MOZTOOLS_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "[servo-host] cargo build --release"
        env:
          # ルート .cargo/config.toml の +crt-static（本体向け。#917）を Servo ホストでは打ち消す。mozjs_sys は動的 CRT 前提で
          # 静的 CRT ではリンクできない（LNK2019）。本体のビルドには効かせないため、ジョブ env ではなくこのステップだけに置く
          CARGO_ENCODED_RUSTFLAGS: "-Ctarget-feature=-crt-static"
        run: |
          cargo build --manifest-path servo-host/Cargo.toml --locked --release `
            --target-dir $env:SERVO_HOST_TARGET_DIR
      - name: "[servo-host] ANGLE の DLL を配置（libEGL.dll・libGLESv2.dll）"
        run: |
          # Windows は `no-wgl`（ANGLE）で動く。mozangle の build.rs が OUT_DIR に作る DLL は、実行時に exe の隣か PATH に要る。
          # 実行するため release の exe の隣へ置く。OUT_DIR を持つ mozangle-* ディレクトリが 1 件でない・DLL が欠けるときは fail する
          $build = Join-Path $env:SERVO_HOST_TARGET_DIR 'release\build'
          $outs = @(Get-ChildItem -Path $build -Directory -Filter 'mozangle-*' |
            ForEach-Object { Join-Path $_.FullName 'out' } |
            Where-Object {
              (Test-Path (Join-Path $_ 'libEGL.dll')) -and
              (Test-Path (Join-Path $_ 'libGLESv2.dll'))
            })
          if ($outs.Count -ne 1) {
            Write-Host "::error::expected 1 mozangle OUT_DIR with the ANGLE DLLs under $build (found: $($outs.Count))"
            exit 1
          }
          $dir = Join-Path $env:SERVO_HOST_TARGET_DIR 'release'
          foreach ($dll in @('libEGL.dll', 'libGLESv2.dll')) {
            Copy-Item -Path (Join-Path $outs[0] $dll) -Destination $dir -Force
            if (-not (Test-Path (Join-Path $dir $dll))) {
              Write-Host "::error::failed to place $dll in $dir"
              exit 1
            }
          }
          Write-Host "ANGLE DLLs placed in $dir"
      - name: "[servo-host] --selftest"
        run: |
          $bin = Join-Path $env:SERVO_HOST_TARGET_DIR 'release\fandhe-browser-servo-host.exe'
          if (-not (Test-Path $bin)) {
            Write-Host "::error::servo host binary not found: $bin"
            exit 1
          }
          $out = (& $bin --selftest) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or -not $out.StartsWith('selftest ok:')) {
            Write-Host "::error::--selftest failed (exit code $code)"
            exit 1
          }
      # 偽バイナリによる判定ロジックの確認。判定ロジックを信頼できない状態で計測しないよう、失敗したら止める（fail-closed）
      - name: "[cli-conformance] 自己テスト"
        shell: bash
        run: bash harness/cli-conformance/self-test.sh
      - name: "[cli-conformance] 実行"
        shell: bash
        run: |
          OUT_UNIX="$(cygpath -u "$RUNNER_TEMP")/cli-conformance"
          HOST_UNIX="$(cygpath -u "$SERVO_HOST_TARGET_DIR")/release/fandhe-browser-servo-host.exe"
          mkdir -p "$OUT_UNIX"
          node --version || echo "note: node not found (CT-LAUNCH-E2 will be recorded as unmet)"
          # %TEMP% は %LOCALAPPDATA% 配下のため、CT-PROFILE-E4 の「配下の外」は RUNNER_TEMP（D:）を使う（--outside-dir の既定）
          bash harness/cli-conformance/run.sh \
            --bin target/release/fandhe-browser.exe \
            --render-host "$HOST_UNIX" \
            --out-jsonl "$OUT_UNIX/results.jsonl" --out-md "$OUT_UNIX/results.md"
      - name: "[cli-conformance] 結果表を Step Summary へ"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          OUT_UNIX="$(cygpath -u "$RUNNER_TEMP")/cli-conformance"
          if [ -f "$OUT_UNIX/results.md" ]; then
            cat "$OUT_UNIX/results.md"
            cat "$OUT_UNIX/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[cli-conformance] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-conformance-windows
          path: ${{ runner.temp }}\cli-conformance
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------
  # egress-isolation（#1387・TASK-38・RENDER-3）
  # --------------------------------------------------
  egress-isolation-macos:
    if: ${{ inputs.suite == 'egress-isolation' }}
    runs-on: macos-latest
    # servo-host-macos の release 込み 35.3 分（release ビルド 23.9 分。run 40396545036）× 約 1.5。計測自体は数分
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: |
          echo "SERVO_HOST_TARGET_DIR=$RUNNER_TEMP/servo-host-release" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/egress-isolation" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "Servo ホストの system 依存の確認"
        run: |
          df -h /
          # servo-host-macos と同じ。mozjs_sys の configure（LLVM_OBJDUMP）は llvm-objdump を要求する。
          # Xcode 同梱の LLVM 系 objdump を xcrun で探し、LLVM_OBJDUMP でパスを渡す（PATH は変えない）
          objdump=""
          for name in llvm-objdump objdump; do
            if found="$(xcrun --find "$name" 2>/dev/null)" && [ -x "$found" ]; then
              objdump="$found"
              break
            fi
          done
          if [ -z "$objdump" ]; then
            echo "error: neither llvm-objdump nor objdump was found via xcrun" >&2
            exit 1
          fi
          echo "LLVM_OBJDUMP=$objdump" >> "$GITHUB_ENV"
          echo "LLVM_OBJDUMP: $objdump"
          for t in clang cmake pkg-config python3 make jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
      - name: "[servo-host] cargo build --release"
        run: cargo build --manifest-path servo-host/Cargo.toml --locked --release --target-dir "$SERVO_HOST_TARGET_DIR"
      - name: "[servo-host] --selftest"
        run: |
          out="$("$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" --selftest)"
          echo "$out"
          case "$out" in "selftest ok:"*) ;; *) echo "error: unexpected --selftest output" >&2; exit 1 ;; esac
      - name: "[egress-isolation] lo0 に 127.0.0.2・127.0.0.3 の alias を追加（使い捨て runner。固定 argv）"
        run: |
          # macOS の lo0 は既定で 127.0.0.1 しか持たない。ダミー宛先の listener に必要（ハーネス自身は sudo を使わない）
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up
          echo "loopback aliases added: 127.0.0.2 127.0.0.3" >> "$GITHUB_STEP_SUMMARY"
      - name: "[egress-isolation] 自己テスト"
        run: bash harness/egress-isolation/self-test.sh
      - name: "[egress-isolation] プラットフォームの記録（読み取りのみ）"
        run: python3 -I -B harness/egress-isolation/platform_probe.py
      - name: "[egress-isolation] 実行（baseline の対照と Seatbelt。sudo なしの拒否ログ。#1402。予熱の回数・待ちは #1415）"
        env:
          EGRESS_WARMUP_COUNT: ${{ inputs.egress_warmup_count }}
          EGRESS_WARMUP_WAIT_MS: ${{ inputs.egress_warmup_wait_ms }}
        run: |
          # 入力は形式（先頭 0 のない 10 進 5 桁以内）と範囲を検証してから渡す（measure.py の検査が二段目）
          re='^(0|[1-9][0-9]{0,4})$'
          if ! [[ "$EGRESS_WARMUP_COUNT" =~ $re ]] || [ "$EGRESS_WARMUP_COUNT" -gt 10 ]; then
            echo "egress_warmup_count must be an integer in [0, 10]" >&2
            exit 1
          fi
          if ! [[ "$EGRESS_WARMUP_WAIT_MS" =~ $re ]] || [ "$EGRESS_WARMUP_WAIT_MS" -gt 30000 ]; then
            echo "egress_warmup_wait_ms must be an integer in [0, 30000]" >&2
            exit 1
          fi
          echo "egress warm-up: count=$EGRESS_WARMUP_COUNT wait_ms=$EGRESS_WARMUP_WAIT_MS" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$OUT_DIR"
          python3 -I -B harness/egress-isolation/measure.py \
            --host "$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" \
            --modes baseline,seatbelt --out "$OUT_DIR" \
            --warmup-count "$EGRESS_WARMUP_COUNT" --warmup-wait-ms "$EGRESS_WARMUP_WAIT_MS"
      - name: "[egress-isolation] 結果表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[egress-isolation] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-isolation-macos
          path: ${{ runner.temp }}/egress-isolation
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------
  # egress-host（#1437・TASK-38・RENDER-3）。render の real_host で隔離下の実ホストを検証する（ubuntu・macOS。Windows は対象外）
  # --------------------------------------------------
  # ubuntu-latest と ubuntu-22.04 の 2 版 matrix（#1487・#1457）。22.04 は 24.04 以降の AppArmor による unprivileged userns
  # 制限が無い環境の確認用。同じ Ubuntu 系で前提ステップが同じため、このジョブだけ matrix にする（冒頭コメント参照）。
  # fail-fast: false は片方の失敗でもう片方の計測を止めないため（失敗を握りつぶすものではない）。
  egress-host-ubuntu:
    if: ${{ inputs.suite == 'egress-host' }}
    name: egress-host-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu # 既存の artifact 名 egress-host-ubuntu を保つ
          - os: ubuntu-22.04
            label: ubuntu-2204 # AppArmor の userns 制限なし（#1487・#1457）
    runs-on: ${{ matrix.os }}
    # cli-conformance-ubuntu と同じ根拠（Servo ホストの release ビルド約 15 分）+ 本体 workspace の debug ビルドと実行。
    # 22.04 も同じ値（clang 14 等でビルドが遅い場合は実測で見直す）
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # matrix の値は run: へ直接展開せず env 経由で渡す
      EGRESS_HOST_LABEL: ${{ matrix.label }}
      # tcpdump の -c（打ち切り件数）と host_capture.py judge の --max-packets で共用する（二重管理のずれを防ぐ。#1467）
      HOST_CAPTURE_MAX_PACKETS: "300000"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: |
          echo "SERVO_HOST_TARGET_DIR=$RUNNER_TEMP/servo-host-release" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/egress-host" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "Servo ホストの system 依存と bubblewrap の導入"
        id: deps
        run: |
          df -h /
          sudo apt-get update -qq
          # docs/setup/linux.md の apt パッケージ（Ubuntu 公式リポジトリのみ）+ 隔離に使う bubblewrap（Cargo の依存ではない）
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev libssl-dev \
            llvm bubblewrap
          for t in clang cmake pkg-config python3 make llvm-objdump jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
          if [ ! -x /usr/bin/bwrap ]; then
            echo "error: /usr/bin/bwrap was not found" >&2
            exit 1
          fi
          # bindgen（clang-sys）が別版 libclang を拾うと mozjs_sys が落ちるため、clang と同じ major の
          # libclang を導入し LIBCLANG_PATH で固定する（ci.yml の servo-host-ubuntu と同じ手順）
          major="$(clang --version | sed -n 's/.*clang version \([0-9]*\)\..*/\1/p' | head -1)"
          sudo apt-get install -y --no-install-recommends "libclang-${major}-dev"
          libdir="/usr/lib/llvm-${major}/lib"
          if ! ls "$libdir"/libclang*.so* >/dev/null 2>&1; then
            echo "error: libclang for LLVM ${major} not found under $libdir" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$libdir" >> "$GITHUB_ENV"
      # 環境情報（#1487）。読み取りのみ（sysctl は書き換えない）。apt やビルドが失敗しても必ず出す。
      # 6.7 は Landlock の TCP 制限（ABI 4）が入った版で、README の「6.7 未満は未測定」の軸に当たる。
      - name: "[egress-host] 環境情報（読み取りのみ。Step Summary へ）"
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$OUT_DIR"
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then
            aa="$(cat "$f" 2>/dev/null || echo unreadable)"
          else
            aa="absent ($f not found)"
          fi
          kr="$(uname -r)"
          kver="${kr%%-*}"
          if printf '%s' "$kver" | grep -Eq '^[0-9]+\.[0-9]+'; then
            if [ "$(printf '%s\n%s\n' 6.7 "$kver" | sort -V | head -n 1)" = "6.7" ]; then k67=yes; else k67=no; fi
          else
            k67=unknown
          fi
          os_name="$(. /etc/os-release 2>/dev/null && echo "${PRETTY_NAME:-unknown}")"
          {
            echo "## egress-host environment (${EGRESS_HOST_LABEL})"
            echo "- os: ${os_name} (ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown})"
            echo "- kernel: ${kr}"
            echo "- kernel >= 6.7: ${k67}"
            echo "- bwrap: $(/usr/bin/bwrap --version 2>/dev/null || echo 'not installed')"
            echo "- apparmor_restrict_unprivileged_userns: ${aa}"
          } | tee "$OUT_DIR/environment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: "[servo-host] cargo build --release"
        id: servo_build
        run: |
          mkdir -p "$OUT_DIR"
          cargo build --manifest-path servo-host/Cargo.toml --locked --release --target-dir "$SERVO_HOST_TARGET_DIR" \
            2>&1 | tee "$OUT_DIR/servo-host-build.log"
      - name: "[servo-host] --selftest"
        id: servo_selftest
        run: |
          out="$("$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" --selftest)"
          echo "$out"
          case "$out" in "selftest ok:"*) ;; *) echo "error: unexpected --selftest output" >&2; exit 1 ;; esac
      # ビルド等が不成立のとき、どの段階で失敗したかを記録する（#1487）。記録のみで fail-closed は変えない。
      - name: "[servo-host] 不成立の要因を Step Summary へ"
        if: ${{ failure() }}
        env:
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          BUILD_OUTCOME: ${{ steps.servo_build.outcome }}
          SELFTEST_OUTCOME: ${{ steps.servo_selftest.outcome }}
        run: |
          log="$OUT_DIR/servo-host-build.log"
          {
            echo "## servo-host failure (${EGRESS_HOST_LABEL})"
            echo "判定基準は緩めていない（#1487）。"
            echo "- deps: ${DEPS_OUTCOME}"
            echo "- build: ${BUILD_OUTCOME}"
            echo "- selftest: ${SELFTEST_OUTCOME}"
            if [ -f "$log" ]; then
              echo '```'
              grep -E '^error|error\[|error:' "$log" | head -n 40 | cut -c 1-300 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "[egress-host] プラットフォームの記録（読み取りのみ。sysctl は書き換えない）"
        run: |
          mkdir -p "$OUT_DIR"
          {
            uname -a
            /usr/bin/bwrap --version || true
            key=kernel.apparmor_restrict_unprivileged_userns
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              echo "$key=$(sysctl -n "$key" 2>/dev/null || echo unreadable)"
            else
              echo "$key=absent"
            fi
            python3 -I -B harness/egress-isolation/platform_probe.py || true
          } 2>&1 | tee "$OUT_DIR/platform.txt"
      # host-capture（#1461・RENDER-3・SEC-2）。隔離下の Servo ホストの DNS・UDP・直接 TCP 送信を host netns の外から観測する。
      # sudo は tcpdump の起動・停止（と apt の導入）だけに使い、-Z で直ちに実行ユーザーへ権限を落とす。サンプラーと判定は非特権。
      # sysctl・ルーティング・nftables・ruleset は変えない。pcap は書き込みを runner のシェルのリダイレクトで行う（-w -）。
      # 帰属の方法と限界は harness/egress-isolation/README.md「host-capture」。
      - name: "[egress-host] host-capture start（tcpdump は Ubuntu 公式 apt。sudo は起動のみ）"
        run: |
          set -euo pipefail
          cap="$OUT_DIR/host-capture"
          mkdir -p "$cap"
          sudo apt-get install -y --no-install-recommends tcpdump
          { tcpdump --version 2>&1 || true; } | tee "$cap/tcpdump.version"
          me="$(id -un)"
          case "$HOST_CAPTURE_MAX_PACKETS" in
            ''|*[!0-9]*|0) echo "error: HOST_CAPTURE_MAX_PACKETS must be a positive integer" >&2; exit 1 ;;
          esac
          # 送信元ポートで帰属させるため UDP・TCP を全て記録する（-s 256 でペイロードの大半を落とす。-c で件数上限）。
          # tcpdump の終了コードは tcpdump.exit に残す（異常終了は判定で unobservable）。
          setsid nohup bash -c '
            sudo tcpdump -i any -nn -U -s 256 -c "$3" -Z "$1" -w - "udp or tcp" \
              2> "$2/tcpdump.stderr" > "$2/capture.pcap"
            echo $? > "$2/tcpdump.exit"
          ' _ "$me" "$cap" "$HOST_CAPTURE_MAX_PACKETS" >/dev/null 2>&1 &
          for _ in $(seq 1 40); do
            if grep -q "listening on" "$cap/tcpdump.stderr" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if ! grep -q "listening on" "$cap/tcpdump.stderr" 2>/dev/null; then
            echo "error: tcpdump did not start listening" >&2
            cat "$cap/tcpdump.stderr" >&2 || true
            exit 1
          fi
          setsid nohup python3 -I -B harness/egress-isolation/host_capture.py sample \
            --servo-exe "$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" \
            --out "$cap/samples.jsonl" --stop-file "$cap/stop" >"$cap/sampler.log" 2>&1 &
          for _ in $(seq 1 20); do
            if [ -s "$cap/samples.jsonl" ]; then break; fi
            sleep 0.5
          done
          if [ ! -s "$cap/samples.jsonl" ]; then
            echo "error: sampler did not start" >&2
            cat "$cap/sampler.log" >&2 || true
            exit 1
          fi
      - name: "[egress-host] real_host の render3_egress_*（隔離を明示。fail-closed）"
        env:
          FANDHE_BROWSER_RENDER_EGRESS_ISOLATION: required
        run: |
          set -euo pipefail
          export FANDHE_BROWSER_RENDER_HOST="$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host"
          log="$OUT_DIR/real_host_egress.log"
          cargo test -p fandhe-browser-render --locked --test real_host render3_egress_ \
            -- --test-threads=1 --nocapture 2>&1 | tee "$log"
          passed="$(sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' "$log" | tail -n 1)"
          verified="$(grep -c 'EGRESS-VERIFIED ' "$log" || true)"
          backend="$(grep -c 'EGRESS-VERIFIED .* backend=Bwrap$' "$log" || true)"
          # 期待値 3 の前提: bwrap バックエンドで render3_egress_* の 3 本が各 1 行を出す。
          # 失敗行は接頭辞が別（EGRESS-PROCTREE-FAIL。末尾の空白つきの grep に数えられない。#1466）。
          proctree="$(grep -c 'EGRESS-PROCTREE ' "$log" || true)"
          proctree_fail="$(grep -c 'EGRESS-PROCTREE-FAIL ' "$log" || true)"
          {
            echo "## egress-host (${EGRESS_HOST_LABEL})"
            echo "- passed: ${passed:-none} (expected 3)"
            echo "- EGRESS-VERIFIED lines: $verified (expected 3)"
            echo "- backend=Bwrap lines: $backend (expected >= 2)"
            echo "- EGRESS-PROCTREE lines: $proctree (expected 3)"
            echo "- EGRESS-PROCTREE-FAIL lines: $proctree_fail (expected 0)"
            echo '```'
            grep -o 'EGRESS-PROCTREE .*' "$log" || true
            grep -o 'EGRESS-PROCTREE-FAIL .*' "$log" || true
            echo '```'
          } > "$OUT_DIR/summary.md"
          if [ "${passed:-}" != "3" ] || [ "$verified" != "3" ] || [ "$backend" -lt 2 ] \
            || [ "$proctree" != "3" ] || [ "$proctree_fail" != "0" ]; then
            echo "error: egress-host verification incomplete" >&2
            exit 1
          fi
      - name: "[egress-host] host-capture stop（サンプラー停止・tcpdump に SIGINT・pcap をテキストへ変換）"
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          cap="$OUT_DIR/host-capture"
          touch "$cap/stop"
          for _ in $(seq 1 30); do
            if grep -q '"type":"end"' "$cap/samples.jsonl" 2>/dev/null; then break; fi
            sleep 0.5
          done
          # 固定の待ちをやめ、pcap に最終カナリアが現れるまで上限つきでポーリングする（#1473 P2。#1470 の回帰対策）。
          # tcpdump の -U により書きかけの pcap も読める。結果に関係なく SIGINT へ進み、合否は judge が決める（fail-closed）。
          python3 -I -B harness/egress-isolation/host_capture.py wait-final-canary --out-dir "$cap" --timeout 15 \
            || echo "note: final canary wait did not confirm (judge decides)"
          sudo pkill -INT -x tcpdump || echo "note: no tcpdump process to stop"
          for _ in $(seq 1 60); do
            if [ -f "$cap/tcpdump.exit" ]; then break; fi
            sleep 0.5
          done
          if [ ! -f "$cap/tcpdump.exit" ]; then echo "note: tcpdump.exit is missing (judge reports unobservable)"; fi
          # 変換の終了状態は convert.exit に残す（途中切れ pcap の部分出力を合格にしないため。非 0・欠落は判定で unobservable）。
          # Actions 既定の errexit が残るため、tcpdump -r 失敗でも convert.exit を必ず書けるよう明示的に解除する。
          set +e
          tcpdump -r "$cap/capture.pcap" -nn -tt > "$cap/capture.txt" 2> "$cap/convert.stderr"
          echo $? > "$cap/convert.exit"
          exit 0
      - name: "[egress-host] host-capture judge（隔離下の Servo への帰属が 0 件か。fail-closed）"
        if: ${{ !cancelled() }}
        run: |
          set +e
          cap="$OUT_DIR/host-capture"
          python3 -I -B harness/egress-isolation/host_capture.py judge --out-dir "$cap" \
            --max-packets "$HOST_CAPTURE_MAX_PACKETS"
          rc=$?
          # pcap と変換テキストはランナー自身の通信ヘッダを含むため、アーティファクトには載せず削除する
          # （verdict.json・summary.md・samples.jsonl〔pid・ポートのみ〕を残す）。
          rm -f "$cap/capture.pcap" "$cap/capture.txt"
          exit "$rc"
      - name: "[egress-host] 結果を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          hc="$OUT_DIR/host-capture/summary.md"
          if [ -f "$hc" ]; then cat "$hc" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$OUT_DIR/platform.txt" ]; then
            { echo '```'; cat "$OUT_DIR/platform.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[egress-host] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-host-${{ matrix.label }}
          # if-no-files-found: error はパターン全体が 0 件のときしか効かない。個々のファイルの欠落は judge が unobservable にする
          # （tcpdump.exit・convert.exit・tcpdump.stderr・capture.txt・samples.jsonl）。
          # verdict.json・summary.md が無いのは judge の失敗（#1473）。
          # 許可リスト（pcap・変換テキストはランナー自身の通信ヘッダを含むため、削除漏れがあっても載せない。#1467）
          path: |
            ${{ runner.temp }}/egress-host/environment.md
            ${{ runner.temp }}/egress-host/servo-host-build.log
            ${{ runner.temp }}/egress-host/platform.txt
            ${{ runner.temp }}/egress-host/real_host_egress.log
            ${{ runner.temp }}/egress-host/summary.md
            ${{ runner.temp }}/egress-host/host-capture/tcpdump.version
            ${{ runner.temp }}/egress-host/host-capture/tcpdump.stderr
            ${{ runner.temp }}/egress-host/host-capture/tcpdump.exit
            ${{ runner.temp }}/egress-host/host-capture/convert.exit
            ${{ runner.temp }}/egress-host/host-capture/convert.stderr
            ${{ runner.temp }}/egress-host/host-capture/sampler.log
            ${{ runner.temp }}/egress-host/host-capture/samples.jsonl
            ${{ runner.temp }}/egress-host/host-capture/verdict.json
            ${{ runner.temp }}/egress-host/host-capture/summary.md
          retention-days: 30
          if-no-files-found: error

  egress-host-macos:
    if: ${{ inputs.suite == 'egress-host' }}
    runs-on: macos-latest
    # egress-isolation-macos と同じ根拠（release 込み 35.3 分 × 約 1.5）+ 本体 workspace の debug ビルド
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: |
          echo "SERVO_HOST_TARGET_DIR=$RUNNER_TEMP/servo-host-release" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/egress-host" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "Servo ホストの system 依存の確認"
        run: |
          df -h /
          # egress-isolation-macos と同じ（mozjs_sys の configure が LLVM_OBJDUMP を要求する）
          objdump=""
          for name in llvm-objdump objdump; do
            if found="$(xcrun --find "$name" 2>/dev/null)" && [ -x "$found" ]; then
              objdump="$found"
              break
            fi
          done
          if [ -z "$objdump" ]; then
            echo "error: neither llvm-objdump nor objdump was found via xcrun" >&2
            exit 1
          fi
          echo "LLVM_OBJDUMP=$objdump" >> "$GITHUB_ENV"
          for t in clang cmake pkg-config python3 make jq curl; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
          if [ ! -x /usr/bin/sandbox-exec ]; then
            echo "error: /usr/bin/sandbox-exec was not found" >&2
            exit 1
          fi
      - name: "[servo-host] cargo build --release"
        run: cargo build --manifest-path servo-host/Cargo.toml --locked --release --target-dir "$SERVO_HOST_TARGET_DIR"
      - name: "[servo-host] --selftest"
        run: |
          out="$("$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host" --selftest)"
          echo "$out"
          case "$out" in "selftest ok:"*) ;; *) echo "error: unexpected --selftest output" >&2; exit 1 ;; esac
      - name: "[egress-host] プラットフォームの記録（読み取りのみ）"
        run: |
          mkdir -p "$OUT_DIR"
          {
            uname -a
            python3 -I -B harness/egress-isolation/platform_probe.py || true
          } 2>&1 | tee "$OUT_DIR/platform.txt"
      - name: "[egress-host] real_host の render3_egress_*（隔離を明示。fail-closed）"
        env:
          FANDHE_BROWSER_RENDER_EGRESS_ISOLATION: required
        run: |
          set -euo pipefail
          export FANDHE_BROWSER_RENDER_HOST="$SERVO_HOST_TARGET_DIR/release/fandhe-browser-servo-host"
          log="$OUT_DIR/real_host_egress.log"
          cargo test -p fandhe-browser-render --locked --test real_host render3_egress_ \
            -- --test-threads=1 --nocapture 2>&1 | tee "$log"
          passed="$(sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' "$log" | tail -n 1)"
          verified="$(grep -c 'EGRESS-VERIFIED ' "$log" || true)"
          backend="$(grep -c 'EGRESS-VERIFIED .* backend=SandboxExec$' "$log" || true)"
          {
            echo "## egress-host (macos)"
            echo "- passed: ${passed:-none} (expected 3)"
            echo "- EGRESS-VERIFIED lines: $verified (expected 3)"
            echo "- backend=SandboxExec lines: $backend (expected >= 2)"
          } > "$OUT_DIR/summary.md"
          if [ "${passed:-}" != "3" ] || [ "$verified" != "3" ] || [ "$backend" -lt 2 ]; then
            echo "error: egress-host verification incomplete" >&2
            exit 1
          fi
      - name: "[egress-host] 結果を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$OUT_DIR/platform.txt" ]; then
            { echo '```'; cat "$OUT_DIR/platform.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[egress-host] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-host-macos
          path: ${{ runner.temp }}/egress-host
          retention-days: 30
          if-no-files-found: error

  # Windows 版。前提検証は cli-conformance-windows と同一内容（更新時は両方を揃える）。AppContainer は ctypes のランチャー（#1396）で実測する
  egress-isolation-windows:
    if: ${{ inputs.suite == 'egress-isolation' }}
    runs-on: windows-latest
    # cli-conformance-windows と同じ根拠（servo-host-windows の release 込み 57.6 分 × 約 1.5）
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      # Servo ホストの release の出力先。C: の空きが少ないため D:（空きの多い短いパス。servo-host-windows と同じ）
      SERVO_HOST_TARGET_DIR: D:\sr
      # Servo の Windows 前提の下限（XOS-6）
      MIN_WINDOWS_SDK: "10.0.19041.0"
      # v143 向け C++ ATL の VS コンポーネント ID（VS 2026 の 14.44 サイドバイサイド）
      ATL_V143_COMPONENT: Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL
      # uv は完全固定（win_amd64 wheel の sha256 で完全性を検証）
      UV_VERSION: "0.12.20"
      UV_WHEEL_SHA256: 1502e03f4da3280cbb493d356d59bdd401bf23197cd71df64e1c6feac156090c
      # MozTools は完全固定（zip の sha256 で検証）。build.rs の MOZTOOLS_VERSION と版を揃える
      MOZTOOLS_VERSION: "4.0"
      MOZTOOLS_URL: https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip
      MOZTOOLS_ZIP_SHA256: cceb354767ef3dad8813e63cb95ed081814225bf5fa15bfa083aa8b31a339153
    steps:
      - name: "長パスの有効化と空き容量の記録"
        run: |
          git config --global core.longpaths true
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Windows SDK の検証
        run: |
          $min = [version]$env:MIN_WINDOWS_SDK
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $found = @()
          if (Test-Path $root) {
            $found = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Name } |
              Where-Object { $_ -ge $min } | Sort-Object -Descending
          }
          if ($found.Count -eq 0) {
            Write-Host "::error::Windows SDK >= $min not found under $root"
            exit 1
          }
          Write-Host "Windows SDK: $($found[0])"
      - name: VS と MSVC v143 ツールセットの検証
        run: |
          $vsInstaller = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $vsInstaller 'vswhere.exe'
          $installPath = & $vswhere -products * -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installPath)) {
            Write-Host "::error::Visual Studio with the MSVC toolset not found"
            exit 1
          }
          $installPath = $installPath.Trim()
          $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
          # v143 のうち ATL 導入対象（ATL_V143_COMPONENT）と対になる 14.44 系のみを
          # 検証対象にする（ATL は 14.44 固定のため、別版を選ぶと atlbase.h が見つからない）
          $v143 = @()
          if (Test-Path $msvcRoot) {
            $v143 = Get-ChildItem $msvcRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Where-Object { [version]$_.Name -ge [version]'14.44' } |
              Where-Object { [version]$_.Name -lt [version]'14.45' } |
              Sort-Object { [version]$_.Name } -Descending
          }
          if ($v143.Count -eq 0) {
            Write-Host "::error::MSVC v143 toolset 14.44 (paired with the ATL component) not found under $msvcRoot"
            exit 1
          }
          Write-Host "VS: $installPath"
          Write-Host "MSVC v143 toolset: $($v143[0].Name)"
          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSVC_V143_DIR=$($v143[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: v143 向け C++ ATL の検証（無ければ導入）
        run: |
          $header = Join-Path $env:MSVC_V143_DIR 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            Write-Host "ATL for v143 not found; installing $env:ATL_V143_COMPONENT"
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$env:VS_INSTALL_PATH`"",
              '--add', $env:ATL_V143_COMPONENT,
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Write-Host "::error::VS Installer failed with exit code $($p.ExitCode)"
              exit 1
            }
          }
          if (-not (Test-Path $header)) {
            Write-Host "::error::C++ ATL for v143 (atlbase.h) not found under $env:MSVC_V143_DIR"
            exit 1
          }
          Write-Host "C++ ATL for v143: $header"
      - name: Python の検証
        run: |
          $out = python --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^Python 3\.') {
            Write-Host "::error::Python 3.x not found (got: $out)"
            exit 1
          }
          Write-Host $out
      - name: uv の導入（バージョン・ハッシュ固定）
        run: |
          # 導入済みの uv があっても sha256 検証を必ず通すため、まず wheel を
          # 明示取得（--require-hashes で検証）し、その wheel を強制再導入する
          $work = Join-Path $env:RUNNER_TEMP 'uv-wheel'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $req = Join-Path $work 'uv-requirements.txt'
          "uv==$env:UV_VERSION --hash=sha256:$env:UV_WHEEL_SHA256" | Out-File -FilePath $req -Encoding ascii
          python -m pip download --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps -d $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::hash-verified download of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          python -m pip install --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps --force-reinstall `
            --no-index --find-links $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          # 出力は "uv 0.12.20 (<hash> <date> <target>)" 形式のため前方一致で比較する
          $ver = python -m uv --version
          if ($LASTEXITCODE -ne 0 -or $ver -notlike "uv $env:UV_VERSION *") {
            Write-Host "::error::unexpected uv version: $ver"
            exit 1
          }
          Write-Host $ver
      - name: "MSVC v143 環境の選択（vcvarsall -vcvars_ver）"
        run: |
          $vcvars = Join-Path $env:VS_INSTALL_PATH 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) {
            Write-Host "::error::vcvarsall.bat not found: $vcvars"
            exit 1
          }
          $ver = Split-Path $env:MSVC_V143_DIR -Leaf
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'VCToolsInstallDir',
            'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion',
            'UniversalCRTSdkDir', 'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkVerBinPath')
          $lines = cmd /c "`"$vcvars`" x64 -vcvars_ver=$ver >nul && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::vcvarsall.bat failed with exit code $LASTEXITCODE"
            exit 1
          }
          $tools = $null
          foreach ($line in $lines) {
            if ($line -match '^([A-Za-z0-9_]+)=(.*)$' -and $allowed -contains $Matches[1]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              if ($Matches[1] -eq 'VCToolsVersion') { $tools = [version]$Matches[2].Trim() }
            }
          }
          if ($null -eq $tools -or $tools -lt [version]'14.30' -or $tools -ge [version]'14.50') {
            Write-Host "::error::VCToolsVersion is not v143 (got: $tools)"
            exit 1
          }
          Write-Host "VCToolsVersion: $tools"
      - name: "libclang の検出（bindgen 用）"
        run: |
          $dirs = @("$env:ProgramFiles\LLVM\bin", "${env:ProgramFiles(x86)}\LLVM\bin")
          $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            Write-Host "::error::libclang.dll not found under $($dirs -join ', ')"
            exit 1
          }
          Write-Host "LIBCLANG_PATH: $found"
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # mozjs_sys の build.rs が llvm-objdump を要求するため、同じ LLVM の bin を PATH に足す
          if (-not (Get-Command llvm-objdump -ErrorAction SilentlyContinue)) {
            "$found" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: "MozTools の導入（バージョン・ハッシュ固定）"
        run: |
          # mozjs_sys の build.rs（find_moztools）は MOZTOOLS_PATH を最優先で使う。zip を取得・sha256 照合・展開して指す
          $work = Join-Path $env:RUNNER_TEMP 'moztools'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work 'moztools.zip'
          Invoke-WebRequest -Uri $env:MOZTOOLS_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:MOZTOOLS_ZIP_SHA256) {
            Write-Host "::error::moztools zip sha256 mismatch (got: $hash)"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          $dest = Join-Path $work 'x'
          Expand-Archive -Path $zip -DestinationPath $dest
          Remove-Item $zip -Force
          # zip の最上位は moztools-<版> ディレクトリ（msys2/ と bin/mozmake.exe を含む）
          $root = Join-Path $dest "moztools-$env:MOZTOOLS_VERSION"
          foreach ($rel in @('bin\mozmake.exe', 'msys2\usr\bin')) {
            if (-not (Test-Path (Join-Path $root $rel))) {
              Write-Host "::error::unexpected moztools layout: missing $rel under $root"
              exit 1
            }
          }
          Write-Host "MOZTOOLS_PATH: $root"
          "MOZTOOLS_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "[servo-host] cargo build --release"
        env:
          # ルート .cargo/config.toml の +crt-static（本体向け。#917）を Servo ホストでは打ち消す。mozjs_sys は動的 CRT 前提で
          # 静的 CRT ではリンクできない（LNK2019）。本体のビルドには効かせないため、ジョブ env ではなくこのステップだけに置く
          CARGO_ENCODED_RUSTFLAGS: "-Ctarget-feature=-crt-static"
        run: |
          cargo build --manifest-path servo-host/Cargo.toml --locked --release `
            --target-dir $env:SERVO_HOST_TARGET_DIR
      - name: "[servo-host] ANGLE の DLL を配置（libEGL.dll・libGLESv2.dll）"
        run: |
          # Windows は `no-wgl`（ANGLE）で動く。mozangle の build.rs が OUT_DIR に作る DLL は、実行時に exe の隣か PATH に要る。
          # 実行するため release の exe の隣へ置く。OUT_DIR を持つ mozangle-* ディレクトリが 1 件でない・DLL が欠けるときは fail する
          $build = Join-Path $env:SERVO_HOST_TARGET_DIR 'release\build'
          $outs = @(Get-ChildItem -Path $build -Directory -Filter 'mozangle-*' |
            ForEach-Object { Join-Path $_.FullName 'out' } |
            Where-Object {
              (Test-Path (Join-Path $_ 'libEGL.dll')) -and
              (Test-Path (Join-Path $_ 'libGLESv2.dll'))
            })
          if ($outs.Count -ne 1) {
            Write-Host "::error::expected 1 mozangle OUT_DIR with the ANGLE DLLs under $build (found: $($outs.Count))"
            exit 1
          }
          $dir = Join-Path $env:SERVO_HOST_TARGET_DIR 'release'
          foreach ($dll in @('libEGL.dll', 'libGLESv2.dll')) {
            Copy-Item -Path (Join-Path $outs[0] $dll) -Destination $dir -Force
            if (-not (Test-Path (Join-Path $dir $dll))) {
              Write-Host "::error::failed to place $dll in $dir"
              exit 1
            }
          }
          Write-Host "ANGLE DLLs placed in $dir"
      - name: "[servo-host] --selftest"
        run: |
          $bin = Join-Path $env:SERVO_HOST_TARGET_DIR 'release\fandhe-browser-servo-host.exe'
          if (-not (Test-Path $bin)) {
            Write-Host "::error::servo host binary not found: $bin"
            exit 1
          }
          $out = (& $bin --selftest) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or -not $out.StartsWith('selftest ok:')) {
            Write-Host "::error::--selftest failed (exit code $code)"
            exit 1
          }
      - name: "[egress-isolation] 自己テスト"
        shell: bash
        run: bash harness/egress-isolation/self-test.sh
      - name: "[egress-isolation] プラットフォームの記録（読み取りのみ）"
        run: python -I -B harness/egress-isolation/platform_probe.py
      - name: "[egress-isolation] 実行（baseline の対照と AppContainer。ループバック免除つき preflight。#1401）"
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'egress-isolation'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = Join-Path $env:SERVO_HOST_TARGET_DIR 'release\fandhe-browser-servo-host.exe'
          python -I -B harness/egress-isolation/measure.py --host $bin --modes baseline,appcontainer `
            --appcontainer-loopback-exempt --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "[egress-isolation] AppContainer プロファイルの残骸の確認（読み取りのみ）"
        if: ${{ !cancelled() }}
        run: |
          $pk = Join-Path $env:LOCALAPPDATA 'Packages'
          $left = Get-ChildItem $pk -Filter 'fandhe.egressiso.*' -ErrorAction SilentlyContinue
          Write-Host "leftover AppContainer profile folders: $(@($left).Count)"
      - name: "[egress-isolation] ループバック免除の残骸の確認（読み取りのみ。#1401）"
        if: ${{ !cancelled() }}
        run: |
          $lines = & "$env:SystemRoot\System32\CheckNetIsolation.exe" LoopbackExempt -s
          $n = @($lines | Select-String -SimpleMatch 'S-1-15-2-').Count
          Write-Host "loopback-exempt SID lines: $n"
      - name: "[egress-isolation] servo-host の異常終了イベント（WER。読み取りのみ。#1413）"
        if: ${{ !cancelled() }}
        run: |
          # 0xC0000409 が panic（故障モジュールが exe 自身）か ANGLE / CRT かを切り分ける。固定フィルタで読むだけ。
          $flt = @{ LogName = 'Application'; Id = 1000; StartTime = (Get-Date).AddHours(-3) }
          $ev = @(Get-WinEvent -FilterHashtable $flt -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*fandhe-browser-servo-host*' } |
            Select-Object -First 5)
          if ($ev.Count -eq 0) { Write-Host 'servo-host application errors: none' }
          foreach ($e in $ev) {
            $p = $e.Properties
            Write-Host ("servo-host application error: module={0} exception={1} offset={2}" -f `
              $p[3].Value, $p[6].Value, $p[7].Value)
          }
      - name: "[egress-isolation] 結果表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'egress-isolation\summary.md'
          if (Test-Path $f) { Get-Content $f | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
      - name: "[egress-isolation] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-isolation-windows
          path: ${{ runner.temp }}\egress-isolation
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------
  # compat-practical（TASK-59・#294）
  # --------------------------------------------------
  compat-practical-ubuntu:
    if: ${{ inputs.suite == 'compat-practical' }}
    runs-on: ubuntu-latest
    # CLI の release ビルド（cache なし）+ run_core.sh の全体期限（既定 1200 秒）× 最大 5 回
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      REPEAT: ${{ inputs.repeat }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "出力先の決定（runner context は job env で使えないため GITHUB_ENV 経由）"
        run: echo "OUT_DIR=$RUNNER_TEMP/compat-practical" >> "$GITHUB_ENV"
      - name: "入力の検証（repeat は 1〜5）"
        run: |
          case "$REPEAT" in
            [1-5]) ;;
            *) echo "error: repeat must be an integer in 1..5 (got: ${REPEAT})" >&2; exit 1 ;;
          esac
      - name: "node 22 以上の確認・導入（sha256 照合）"
        run: |
          if node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)' 2>/dev/null; then
            echo "node is sufficient: $(node --version)"
            exit 0
          fi
          echo "node is missing or older than 22; installing v${NODE_VERSION} from nodejs.org"
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          dir="$RUNNER_TEMP/node-dl"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://nodejs.org/dist/v${NODE_VERSION}/${archive}"
          echo "${NODE_SHA256_LINUX_X64}  $dir/$archive" | sha256sum -c -
          tar -xJf "$dir/$archive" -C "$dir"
          echo "$dir/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "ツールの確認"
        run: |
          node --version
          node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)' \
            || { echo "error: Node 22+ (built-in WebSocket) is required" >&2; exit 1; }
          for t in jq curl; do
            command -v "$t" >/dev/null 2>&1 || { echo "error: $t is required but was not found on PATH" >&2; exit 1; }
          done
          jq --version
          curl --version | head -n 1
      - name: "[cli] cargo build --release（既定 feature）"
        run: cargo build --release --locked -p fandhe-browser-cli
      - name: "[compat-practical] 実行（--page-js v8 --page-modules × ${{ inputs.repeat }} 回）"
        run: |
          bash harness/compat-practical/repeat_core.sh --repeat "$REPEAT" --bin target/release/fandhe-browser \
            --out-dir "$OUT_DIR" --page-js v8 --page-modules
      - name: "[compat-practical] 集計表を Step Summary へ"
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md"
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[compat-practical] 結果をアーティファクトへ"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-practical-ubuntu
          path: ${{ runner.temp }}/compat-practical
          retention-days: 30
          if-no-files-found: error

