      - name: "node 22 以上の確認・導入（sha256 照合）"
        run: |
          if node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)' 2>/dev/null; then
            echo "node is sufficient: $(node --version)"
            exit 0
          fi
          echo "node is missing or older than 22; installing v${NODE_VERSION} from nodejs.org"
          # macos-latest は Apple Silicon（arm64）
          archive="node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          dir="$RUNNER_TEMP/node-dl"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://nodejs.org/dist/v${NODE_VERSION}/${archive}"
          echo "${NODE_SHA256_DARWIN_ARM64}  $dir/$archive" | shasum -a 256 -c -
          tar -xzf "$dir/$archive" -C "$dir"
          echo "$dir/node-v${NODE_VERSION}-darwin-arm64/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
