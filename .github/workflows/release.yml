name: release

# crates.io 公開ワークフロー（#1531。fandhe-frontend の release.yml の構成を参考にした）。
# workflow_dispatch の明示入力（crate・version・mode）で起動し、次のジョブで進める。
#   verify        入力のガードと `cargo publish --dry-run`（ubuntu。トークン不要）
#   verify-macos  同じ dry-run を macOS で行い、ビルドされた `fandhe-browser` をスモーク実行する
#   publish       mode=publish のときだけ。Environment `crates-io-release`（承認ゲートのみ）の承認後、公開順に `cargo publish`
#   smoke-macos   公開後（crate が all か fandhe-browser-cli のとき）に macOS で `cargo install` し、同じスモークを実行する
# mode の既定は dry-run-only（安全側）。タグ push 起点は採用しない（入力のバージョン整合ガードのほうが誤公開に対して
# fail-closed なため）。ガード・公開・スモークの実体は scripts/release.sh・scripts/release-smoke.sh にあり、
# 本ファイルは呼び出しだけを持つ（.claude/rules/makefile.md）。入力は env 経由で扱い、`${{ }}` を run に展開しない。
#
# 公開対象は 8 crate（fandhe-browser-profile・js・core・ai・cdp・render・cli・mcp。版は共通）。
# `harness/wpt_subset_runner`（publish = false）と `servo-host/`（別 workspace・MPL-2.0 の隔離。別配布）は対象外。
# crate 入力を choice 型に固定して任意文字列・存在しない crate の指定を構造的に排除する。選択肢は
# scripts/publish-crates.sh の一覧と一致させる（`make check-publish-ready` が検査する）。
#
# 公開順（`all`）: profile -> js -> core -> ai -> cdp -> render -> cli -> mcp（依存の下位から。mcp は独立）。
# 単一 crate の公開は、その crate の workspace 依存（dev 依存を含む）が公開済みのときだけ通る。
# 途中再開: `all` は一部が公開済みでも未公開分だけ続行し、全件公開済みなら失敗する。単一指定は公開済みなら失敗する。
# dry-run は未公開の全 crate を一括で検証する（未公開の依存は registry から解決できないため）。
#
# レート制限: crates.io の新規 crate 公開は burst 5 件、以後 10 分に 1 件（crates.io の rate_limiter.rs）。
# 8 crate の初回公開では 6 件目以降が 429 になるため、publish は待って再試行する（5 分間隔・crate ごとに最大 12 回）。
#
# 前提（オーナー作業。本ワークフローは存在確認のみ行い作成しない）:
#   - GitHub Environment `crates-io-release` を作成し required reviewers を設定する（承認ゲートのみ。初回 run で
#     自動作成された場合は保護ルールが空のため、必ず手動で追加する。secret は置かない）
#   - org secret `CARGO_REGISTRY_TOKEN`（crates.io の API トークン。publish-new / publish-update スコープ）が
#     本リポから参照できること。トークンは publish ステップの env にだけ注入し、他のステップ・ジョブへは渡さない
#   - private submodule（docs/spec）は公開処理に不要なため取得しない
# 各ステップは crates.io（index.crates.io・static.crates.io）への到達性を前提とする。到達できない場合の失敗は環境エラー。

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "公開対象 crate（all は依存順の一括公開。途中再開では公開済みを飛ばす）"
        type: choice
        required: true
        default: all
        options:
          - all
          - fandhe-browser-profile
          - fandhe-browser-js
          - fandhe-browser-core
          - fandhe-browser-ai
          - fandhe-browser-cdp
          - fandhe-browser-render
          - fandhe-browser-cli
          - fandhe-browser-mcp
      version:
        description: "公開するバージョン（例: 0.1.0）。対象 crate の Cargo.toml の version と完全一致する必要がある"
        type: string
        required: true
      mode:
        description: "dry-run-only: 検証のみ（既定・安全側）。publish: 実際に cargo publish を実行する"
        type: choice
        required: true
        default: dry-run-only
        options:
          - dry-run-only
          - publish

permissions:
  contents: read

concurrency:
  # 公開処理の二重実行を防ぐためワークフロー全体で直列化する（all と単体は対象が重なる）。
  # 途中キャンセルは crates.io 側の中途半端な状態を招くため cancel-in-progress はしない。
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: "verify: guards + cargo publish --dry-run (${{ inputs.crate }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "guard: 入力・バージョン一致・crates.io 公開状況"
        run: bash scripts/release.sh plan
      - name: "cargo publish --dry-run（未公開の全 crate・--locked）"
        run: bash scripts/release.sh dry-run

  verify-macos:
    name: "verify-macos: cargo publish --dry-run + smoke (${{ inputs.crate }})"
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "検証ビルドの出力先を空の target に分離"
        # dry-run の検証ビルド（パッケージ化した crate のビルド）の成果物だけを smoke に使うため。
        # `runner` コンテキストはジョブ env では使えないためステップで設定する。
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/verify-target" >> "${GITHUB_ENV}"
      - name: "guard: 入力・バージョン一致・crates.io 公開状況"
        run: bash scripts/release.sh plan
      - name: "cargo publish --dry-run（未公開の全 crate・--locked）"
        run: bash scripts/release.sh dry-run
      - name: "smoke: 検証ビルドされた fandhe-browser"
        # cli が公開済みで検証対象外のときはバイナリが無いため、スモークは publish 後の smoke-macos が担う。
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR}/debug/fandhe-browser"
          if [ ! -x "${bin}" ]; then
            case " ${RELEASE_DRYRUN} " in
              *" fandhe-browser-cli "*) echo "::error::verified binary not found: ${bin}"; exit 1 ;;
              *) echo "::notice::fandhe-browser-cli is not part of this dry-run; smoke is skipped"; exit 0 ;;
            esac
          fi
          bash scripts/release-smoke.sh "${bin}"

  publish:
    name: "publish: cargo publish (${{ inputs.crate }})"
    if: ${{ inputs.mode == 'publish' }}
    needs: [verify, verify-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 承認ゲート（Environment は承認のみで secret は持たない）。mode=publish の実公開だけが保護ルールを通る。
    environment: crates-io-release
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # 承認待ちの間に ref が進んでも、検証した commit をそのまま公開する。
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "guard: CARGO_REGISTRY_TOKEN の存在確認"
        env:
          # 値は渡さず、設定の有無だけを評価する。
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::secret CARGO_REGISTRY_TOKEN is not available to this repository (org secret)"
            exit 1
          fi
      - name: "guard: 公開状況の再判定（承認待ちの間の変化に備える）"
        run: bash scripts/release.sh plan
      - name: "cargo publish（公開順・公開済みは飛ばす・429 は待って再試行）"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release.sh publish

  smoke-macos:
    name: "smoke-macos: cargo install + smoke"
    if: ${{ inputs.mode == 'publish' && (inputs.crate == 'all' || inputs.crate == 'fandhe-browser-cli') }}
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # スモークのスクリプトを取得するためだけに checkout する（導入するのは crates.io 上の公開物）。
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "cargo install fandhe-browser-cli --locked"
        # 公開直後は index への反映待ちがあり得るため、数回再試行する。
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if cargo install fandhe-browser-cli --version "${RELEASE_VERSION}" --locked \
              --root "${RUNNER_TEMP}/install"; then
              exit 0
            fi
            echo "install attempt ${attempt} failed; retrying in 60s"
            sleep 60
          done
          echo "::error::cargo install failed"
          exit 1
      - name: "smoke: インストールされた fandhe-browser"
        run: bash scripts/release-smoke.sh "${RUNNER_TEMP}/install/bin/fandhe-browser"
