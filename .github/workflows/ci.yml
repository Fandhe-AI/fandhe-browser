name: CI

# push/pull_request で自動起動する（TASK-55.2・Issue #59・対象ビヘイビア XOS-1・MS-1）。
# workflow_dispatch は手動再実行・検証用に併存させる。
#
# ジョブ構成（時間と過剰なチェックを減らすための統合版）:
#   changes                      常時。変更ファイルから rust / harness の実行要否を決める
#   lint-docs                    常時。markdownlint・yamllint・editorconfig-checker・commitlint
#   rust-lint                    rust 時。fmt・cargo deny・deny-license-reject（ubuntu のみ）
#   rust-test-{ubuntu,macos,windows}      rust 時。clippy + test（3 OS）
#   rust-features-{ubuntu,macos,windows}  rust 時。feature 構成別の clippy・test（3 OS）
#   harness-{ubuntu,macos,windows}        rust または harness 時。分離検証・ハーネス・サイズ検査
#   windows-servo-prereqs        rust 時。Servo の Windows ビルド前提の検証
# 詳細・required checks の一覧は .claude/rules/ci.md を参照。
#
# 設計上の制約:
# - required にするジョブは matrix を使わない OS ごとの明示ジョブにする。job-level if で
#   スキップされた matrix ジョブは展開されず check 名が変わり、required を満たせなくなるため。
# - reusable workflow 呼び出し（`caller / callee` 形式の check 名）は使わない。
# - 出る check-run はすべて required にする前提（自動マージは未 required の check-run があると
#   マージしない）。非 required の補助ジョブを追加しない。
# - docs-only 判定は fail-closed。allowlist 外のパスが 1 つでもあれば rust=true。
# - clippy -D warnings ゲートは REPAIR-6（TASK-5.2・#32 / TASK-7・#335）。ライセンス検査は
#   TASK-77（#64）・TASK-9.1（#338・REPAIR-8）。Servo 前提は TASK-56.1（#195・XOS-6・MS-3）。
#   TASK-9.3（#340・REPAIR-8・MS-7）: push / pull_request トリガーと本格 CI 統合の完了記録。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR・同じ ref（main への push を含む）の新しい run が始まったら、実行中の古い run は
# 中止して最新のコミットだけを検証する（main へ続けてマージされても 3 OS の run は 1 本に保つ）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # changes（変更ファイルから後続ジョブの実行要否を決める。常時実行・required）
  # --------------------------------------------------
  # pull_request のとき docs 扱いの allowlist に全ファイルが一致した場合だけ rust=false に
  # する（判定本体は scripts/ci-changes.sh。--self-test あり）。push（main）・
  # workflow_dispatch・merge_group・git diff 失敗・出力不正は常に全実行（fail-closed）。
  # 下流が skipped になっても、changes 自体が required かつ失敗し得るため見逃さない。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      harness: ${{ steps.detect.outputs.harness }}
      xos: ${{ steps.detect.outputs.xos }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "判定スクリプトの自己テスト"
        run: bash scripts/ci-changes.sh --self-test
      - name: "変更ファイルから実行対象（rust・harness）を判定"
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          emit() {
            echo "rust=$1" >> "$GITHUB_OUTPUT"
            echo "harness=$2" >> "$GITHUB_OUTPUT"
            echo "xos=$3" >> "$GITHUB_OUTPUT"
            echo "changes: rust=$1 harness=$2 xos=$3 (${4})"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            emit true true true "event=$EVENT_NAME"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            emit true true true "base/head SHA unavailable"
            exit 0
          fi
          if ! files="$(git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "::warning::git diff failed; running all jobs (fail-closed)"
            emit true true true "git diff failed"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$files"
          if ! result="$(printf '%s\n' "$files" | bash scripts/ci-changes.sh)"; then
            echo "::warning::scripts/ci-changes.sh failed; running all jobs (fail-closed)"
            emit true true true "classifier failed"
            exit 0
          fi
          # 出力は厳密な 2 行形式のみ受理する。欠落・想定外の値は下流ジョブが
          # skipped（= 成功扱い）になる fail-open を招くため全実行へ倒す
          if [ "$(printf '%s\n' "$result" | grep -cxE 'rust=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | grep -cxE 'harness=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | grep -cxE 'xos=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | wc -l | tr -d ' ')" -ne 3 ]; then
            echo "::warning::unexpected classifier output; running all jobs (fail-closed)"
            emit true true true "unexpected output"
            exit 0
          fi
          # Rust ソースの差分に OS 分岐（cfg(target_os / windows / unix / target_family)）の
          # 追加・削除があれば、パスによらず PR でも 3 OS を走らせる
          if ! diff_body="$(git diff --no-renames -U0 "$BASE_SHA...$HEAD_SHA" -- '*.rs')"; then
            echo "::warning::git diff (content) failed; running all jobs (fail-closed)"
            emit true true true "git diff content failed"
            exit 0
          fi
          os_cfg_re='cfg!?\(.*(target_os|target_family|windows|unix)'
          # grep -q は早期終了で上流が SIGPIPE になり pipefail 下で偽になるため、件数で判定する
          os_cfg_hits="$(printf '%s\n' "$diff_body" | grep -E '^[+-]' | grep -cE "$os_cfg_re" || true)"
          if [ "${os_cfg_hits:-0}" != "0" ]; then
            result="$(printf '%s\n' "$result" | sed 's/^xos=false$/xos=true/')"
            echo "OS-specific cfg change detected; xos=true"
          fi
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          echo "changes: $(printf '%s' "$result" | tr '\n' ' ')"

  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint。常時実行・required）
  # --------------------------------------------------
  # 旧 Fandhe-AI/actions の lint-docs reusable workflow（markdownlint・
  # editorconfig-checker・yamllint・commitlint・lint-docs-complete の 5 ジョブ）を
  # 1 ジョブの複数ステップへ畳んだもの。ツール版は reusable の既定値と同じ
  # （markdownlint-cli 0.49.1・yamllint 1.38.0・editorconfig-checker v3.8.0・
  # commitlint 21.2.1 / config-conventional 21.2.0）。Makefile の *_VERSION と揃える。
  # 各ステップは !cancelled() で独立に走らせ、1 回の実行で全指摘を得られるようにする。
  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Node.js 版の確認（markdownlint-cli・commitlint は 22.12 以上が必要）"
        run: |
          node --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>22||(a===22&&b>=12)?0:1)' \
            || { echo "::error::Node.js 22.12 or later is required"; exit 1; }
      - name: "markdownlint"
        if: ${{ !cancelled() }}
        run: npx --yes markdownlint-cli@0.49.1 --ignore-path .markdownlintignore "**/*.md"
      - name: "yamllint"
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint-venv"
          "$RUNNER_TEMP/yamllint-venv/bin/pip" install --quiet --disable-pip-version-check yamllint==1.38.0
          "$RUNNER_TEMP/yamllint-venv/bin/yamllint" -f parsable .
      - name: "editorconfig-checker（v3.8.0・sha256 検証）"
        if: ${{ !cancelled() }}
        run: |
          ec_dir="$RUNNER_TEMP/editorconfig-checker"
          mkdir -p "$ec_dir"
          curl -fsSL --retry 3 -o "$ec_dir/ec.tar.gz" \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.8.0/ec-linux-amd64.tar.gz
          echo "613bd88f34165a334adcb6b7e92a123c9de0eada65846d31af63613b779ff3be  $ec_dir/ec.tar.gz" | sha256sum -c -
          tar -xzf "$ec_dir/ec.tar.gz" -C "$ec_dir"
          "$ec_dir/bin/ec-linux-amd64"
      - name: "commitlint（pull_request のみ・PR の commit 範囲）"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes \
            -p "@commitlint/cli@21.2.1" \
            -p "@commitlint/config-conventional@21.2.0" \
            commitlint \
            --extends "@commitlint/config-conventional" \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose

  # --------------------------------------------------
  # rust-lint（OS 非依存の静的検査。ubuntu のみ）
  # --------------------------------------------------
  # 旧 rust-ci の fmt・deny と旧 deny-license-reject を統合した。
  # - cargo fmt --all --check: REPAIR-6 のローカルゲートと同じ
  # - cargo deny check（deny-checks: advisories bans licenses sources）: TASK-77（#64）
  #   のライセンス検査（licensing.md）。cargo-deny の版は Makefile の CARGO_DENY_VERSION と同期
  # - check-deny-license-reject（TASK-9.1・#338・REPAIR-8）: GPL/AGPL/LGPL/MPL-2.0・
  #   ライセンス未記載の canary を cargo deny が reject し続けることの negative test
  rust-lint:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_DENY_VERSION: "0.20.2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: "cargo fmt --all --check"
        run: cargo fmt --all --check
      - name: "cargo-deny の導入キャッシュ復元"
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - name: "cargo-deny の導入（未導入・版不一致のときのみ）"
        if: ${{ !cancelled() }}
        run: |
          if cargo deny --version 2>/dev/null | grep -qF "cargo-deny $CARGO_DENY_VERSION"; then
            echo "cargo-deny $CARGO_DENY_VERSION is already installed"
          else
            cargo install --locked --force "cargo-deny@$CARGO_DENY_VERSION"
          fi
          cargo deny --version
      - name: "cargo deny check（advisories bans licenses sources）"
        if: ${{ !cancelled() }}
        run: cargo deny --locked check advisories bans licenses sources
      - name: "許可外ライセンスの reject 検証（make check-deny-license-reject）"
        if: ${{ !cancelled() }}
        run: make check-deny-license-reject

  # --------------------------------------------------
  # rust-test-{ubuntu,macos,windows}（clippy + test。3 OS 必須・rust 変更時のみ）
  # --------------------------------------------------
  # 旧 rust-ci（Fandhe-AI/actions の rust-base-ci.yml）の clippy・test を OS ごとの
  # 明示ジョブへインライン化した（XOS-1・TASK-55.1）。matrix にしないのは、job-level if で
  # スキップされた matrix ジョブが展開されず check 名が変わり required を満たさなくなるため。
  # clippy -D warnings は REPAIR-6（TASK-5.2・#32 / TASK-7・#335）の fail-closed ゲート。
  # cache は windows のみ除外（cache prune に既知問題。旧 rust-ci と同じ）。
  # CARGO_INCREMENTAL=0 は cache 利用 OS のみ。
  rust-test-ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fandhe-browser-${{ runner.os }}-test-v4-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fandhe-browser-${{ runner.os }}-test-v4-
            fandhe-browser-${{ runner.os }}-test-v3-
      - name: "cargo clippy（workspace・--all-features・-D warnings）"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: "cargo test（workspace・--all-features）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features
      - name: "cache 保存前に workspace 成果物を prune"
        run: bash scripts/ci-prune-target.sh

  rust-test-macos:
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && needs.changes.outputs.xos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fandhe-browser-${{ runner.os }}-test-v4-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fandhe-browser-${{ runner.os }}-test-v4-
            fandhe-browser-${{ runner.os }}-test-v3-
      - name: "cargo clippy（workspace・--all-features・-D warnings）"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: "cargo test（workspace・--all-features）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features
      - name: "cache 保存前に workspace 成果物を prune"
        run: bash scripts/ci-prune-target.sh

  rust-test-windows:
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && needs.changes.outputs.xos == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo clippy（workspace・--all-features・-D warnings）"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: "cargo test（workspace・--all-features）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features

  # --------------------------------------------------
  # rust-features-{ubuntu,macos,windows}（feature 構成別の clippy・test。rust 変更時のみ）
  # --------------------------------------------------
  # 旧 rust-ci-default-features・rust-ci-js-boa・rust-ci-js-v8 の全コマンドを 1 ジョブへ
  # 順に束ねた（同一 target dir で依存ビルドを共有する）。ステップ名の接頭辞が旧ジョブ:
  #   [default] = rust-ci-default-features（既定 feature・エンジンなし・両エンジン同梱の共通
  #               テスト。TASK-32.4・#168・JS-1。clippy -D warnings は REPAIR-6）
  #   [js-boa]  = rust-ci-js-boa（軽量ビルド `--no-default-features --features js-boa`。
  #               TASK-32.4・#168・JS-1）
  #   [js-v8]   = rust-ci-js-v8（`--features js-v8` 単独で TASK-28 共通コンフォーマンス
  #               テストを V8 に対して検証。TASK-29.7・#158・JS-1）
  # 各ステップは !cancelled() で独立に走らせ、失敗構成を 1 回の実行で特定できるようにする。
  # cache は windows のみ除外（cache prune に既知問題。旧 rust-ci と同じ）。
  rust-features-ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fandhe-browser-${{ runner.os }}-features-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fandhe-browser-${{ runner.os }}-features-v1-
      - name: "[default] cargo clippy（既定 feature）"
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "[default] cargo test（既定 feature）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace
      - name: "[default] cargo clippy（core 単独・エンジンなし）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-core --all-targets -- -D warnings
      - name: "[default] cargo test（core 単独・エンジンなし）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-core
      - name: "[default] cargo test（js 両エンジン同梱）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-js --features js-v8 --features js-boa
      - name: "[default] cargo test（core 両エンジン同梱）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-core --features js-v8 --features js-boa
      - name: "[js-boa] cargo build（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo build -p fandhe-browser-cli --no-default-features --features js-boa
      - name: "[js-boa] cargo clippy（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-cli --all-targets --no-default-features --features js-boa -- -D warnings
      - name: "[js-boa] cargo test（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-cli --no-default-features --features js-boa
      - name: "[js-boa] cargo clippy（js js-boa）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-js --all-targets --features js-boa -- -D warnings
      - name: "[js-boa] cargo test（js js-boa）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-js --features js-boa
      - name: "[js-boa] cargo test（core js-boa）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-core --features js-boa
      - name: "[js-boa] cargo check（cli エンジンなし）"
        if: ${{ !cancelled() }}
        run: cargo check -p fandhe-browser-cli --no-default-features
      - name: "[js-v8] cargo clippy（js js-v8 単独）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-js --all-targets --features js-v8 -- -D warnings
      - name: "[js-v8] cargo test（js js-v8 単独）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-js --features js-v8
      - name: "cache 保存前に workspace 成果物を prune"
        run: bash scripts/ci-prune-target.sh

  rust-features-macos:
    needs: changes
    if: ${{ (needs.changes.outputs.rust == 'true') && needs.changes.outputs.xos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
