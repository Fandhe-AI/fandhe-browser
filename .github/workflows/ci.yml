name: CI

# ジョブ追加・変更時は .claude/rules/github-actions.md に従う。
# push/pull_request で自動起動する（TASK-55.2・Issue #59・対象ビヘイビア XOS-1・MS-1）。
# workflow_dispatch は手動再実行・検証用に併存させる。
#
# ジョブ構成（時間と過剰なチェックを減らすための統合版）:
#   changes                      常時。変更ファイルから rust / harness の実行要否を決める
#   lint-docs                    常時。markdownlint・yamllint・editorconfig-checker・commitlint
#   rust-lint                    rust または servo 時。fmt・cargo deny（本体・Servo ホスト）・deny-license-reject（ubuntu のみ）
#   rust-test-{ubuntu,macos,windows}      rust 時。clippy + test（3 OS）
#   rust-features-{ubuntu,macos}          rust 時。feature 構成別の clippy・test
#   rust-features-windows-{default,engines,boa}  rust 時。Windows の feature 構成別を 3 並列に分割
#   harness-{ubuntu,macos,windows}        rust または harness 時。分離検証・ハーネス・サイズ検査
#   windows-servo-prereqs        rust 時。Servo の Windows ビルド前提の検証
#   servo-host-ubuntu            servo 時（PR でも実行）。Servo ホストの fmt・clippy・test・分離検証・release（main/dispatch のみ）
#   cross-target-check           rust 時。Linux 上で macOS・Windows 向けに型検査（PR でも実行）
#
# 3 OS の実行時機（オーナー判断 2026-10-10。.claude/rules/ci.md「3 OS CI」）:
#   - pull_request: ubuntu のネイティブ実行のみ。macOS・Windows の各ジョブは skipped になり
#     （required を満たす）、代わりに cross-target-check が Linux 上で型検査する
#   - push（main）・workflow_dispatch: 3 OS すべてのネイティブ実行（release 前は
#     `gh workflow run ci.yml --ref <ref>` で 3 OS を回す）
# 詳細・required checks の一覧は .claude/rules/ci.md を参照。
#
# 設計上の制約:
# - required にするジョブは matrix を使わない OS ごとの明示ジョブにする。job-level if で
#   スキップされた matrix ジョブは展開されず check 名が変わり、required を満たせなくなるため。
# - reusable workflow 呼び出し（`caller / callee` 形式の check 名）は使わない。
# - 出る check-run はすべて required にする前提（自動マージは未 required の check-run があると
#   マージしない）。非 required の補助ジョブを追加しない（cross-target-check も required に含める）。
#   macOS・Windows の各ジョブは pull_request で skipped になる（skipped は required を満たす）。
# - docs-only 判定は fail-closed。allowlist 外のパスが 1 つでもあれば rust=true。
# - clippy -D warnings ゲートは REPAIR-6（TASK-5.2・#32 / TASK-7・#335）。ライセンス検査は
#   TASK-77（#64）・TASK-9.1（#338・REPAIR-8）。Servo 前提は TASK-56.1（#195・XOS-6・MS-3）。
#   TASK-9.3（#340・REPAIR-8・MS-7）: push / pull_request トリガーと本格 CI 統合の完了記録。
#
# cargo cache（詳細は .claude/rules/github-actions.md「キャッシュ方針」）:
# - restore（actions/cache/restore）は全イベント、save（actions/cache/save）は main（refs/heads/main）
#   で exact hit しなかったときだけ。PR は main の cache を読むだけで書かない
# - key は `rust-<OS>-<種別>-vN-<rustc cachekey>-<hashFiles('Cargo.lock')>`。
#   lockfile はルートのみ（`**/Cargo.lock` は .agents 配下のサンプルまで拾い、依存不変でも
#   全 cache が作り直されるため使わない）。例外は servo-host-ubuntu の種別 `servohost` だけで、
#   別 workspace の `servo-host/Cargo.lock` を単一ファイルで hash する（ルートの cache と独立）。rustc を含めるのは stable 更新後に古い target を
#   exact hit で復元し続けないため。restore-keys は同じ rustc の範囲に限る
# - `-vN` は cache 内容（path・ビルド条件・prune・profile）を変えたら上げる（既存 key に exact hit
#   すると保存がスキップされ、新しい内容が保存されないため。restore-keys に旧版を残さない）。
#   test v6・features v3・harness v3 は Cargo.toml へ `[profile.dev.package."*"]` を追加した
#   ことによる bump（依存のビルドスクリプト・proc-macro が debuginfo なし → 行番号付きに変わり、
#   それらに依存する crate の `-C metadata` も連鎖して変わるため、旧版の blob では依存を毎回
#   再ビルドする）。registry のみの cross は target を含まないため上げない
# - Windows も同じ形で cache する。以前は prune が「想定外の crate / target 名」で fail したため
#   除外していた（Windows の jq の CRLF 出力が原因と推定。対処は scripts/ci-prune-target.sh の
#   ヘッダー参照）。Windows の key は runner.os が `Windows` になるため Linux・macOS と衝突しない

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR・同じ ref（main への push を含む）の新しい run が始まったら、実行中の古い run は
# 中止して最新のコミットだけを検証する（main へ続けてマージされても 3 OS の run は 1 本に保つ）。
# push（main）では group が `CI-refs/heads/main` になり、main への新しい push は実行中の古い
# main の CI（macOS・Windows のネイティブ実行を含む 3 OS）を取り消す。取り消された commit の
# macOS・Windows の結果は残らず、OS 固有の実行時の誤りは後続 commit の main の CI（最新 commit を
# 含む 3 OS 実行）で検出する（オーナー承認の挙動。ci.md「3 OS CI」）。workflow_dispatch を main へ
# 向けて起動した場合も同じ group になる
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # changes（変更ファイルから後続ジョブの実行要否を決める。常時実行・required）
  # --------------------------------------------------
  # pull_request のとき docs 扱いの allowlist に全ファイルが一致した場合だけ rust=false に
  # する（判定本体は scripts/ci-changes.sh。--self-test あり）。push（main）・
  # workflow_dispatch・merge_group・git diff 失敗・出力不正は常に全実行（fail-closed）。
  # 下流が skipped になっても、changes 自体が required かつ失敗し得るため見逃さない。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      harness: ${{ steps.detect.outputs.harness }}
      servo: ${{ steps.detect.outputs.servo }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "判定スクリプトの自己テスト"
        run: bash scripts/ci-changes.sh --self-test
      - name: "変更ファイルから実行対象（rust・harness）を判定"
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          emit() {
            echo "rust=$1" >> "$GITHUB_OUTPUT"
            echo "harness=$2" >> "$GITHUB_OUTPUT"
            echo "servo=$3" >> "$GITHUB_OUTPUT"
            echo "changes: rust=$1 harness=$2 servo=$3 ($4)"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            emit true true true "event=$EVENT_NAME"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            emit true true true "base/head SHA unavailable"
            exit 0
          fi
          if ! files="$(git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "::warning::git diff failed; running all jobs (fail-closed)"
            emit true true true "git diff failed"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$files"
          if ! result="$(printf '%s\n' "$files" | bash scripts/ci-changes.sh)"; then
            echo "::warning::scripts/ci-changes.sh failed; running all jobs (fail-closed)"
            emit true true true "classifier failed"
            exit 0
          fi
          # 出力は厳密な 3 行形式のみ受理する。欠落・想定外の値は下流ジョブが
          # skipped（= 成功扱い）になる fail-open を招くため全実行へ倒す
          if [ "$(printf '%s\n' "$result" | grep -cxE 'rust=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | grep -cxE 'harness=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | grep -cxE 'servo=(true|false)')" -ne 1 ] \
            || [ "$(printf '%s\n' "$result" | wc -l | tr -d ' ')" -ne 3 ]; then
            echo "::warning::unexpected classifier output; running all jobs (fail-closed)"
            emit true true true "unexpected output"
            exit 0
          fi
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          echo "changes: $(printf '%s' "$result" | tr '\n' ' ')"

  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint。常時実行・required）
  # --------------------------------------------------
  # 旧 Fandhe-AI/actions の lint-docs reusable workflow（markdownlint・
  # editorconfig-checker・yamllint・commitlint・lint-docs-complete の 5 ジョブ）を
  # 1 ジョブの複数ステップへ畳んだもの。ツール版は reusable の既定値と同じ
  # （markdownlint-cli 0.49.1・yamllint 1.38.0・editorconfig-checker v3.8.0・
  # commitlint 21.2.1 / config-conventional 21.2.0）。scripts/versions.sh の *_VERSION と揃える。
  # 各ステップは !cancelled() で独立に走らせ、1 回の実行で全指摘を得られるようにする。
  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Node.js 版の確認（markdownlint-cli・commitlint は 22.12 以上が必要）"
        run: |
          node --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>22||(a===22&&b>=12)?0:1)' \
            || { echo "::error::Node.js 22.12 or later is required"; exit 1; }
      - name: "markdownlint"
        if: ${{ !cancelled() }}
        run: npx --yes markdownlint-cli@0.49.1 --ignore-path .markdownlintignore "**/*.md"
      - name: "yamllint"
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint-venv"
          "$RUNNER_TEMP/yamllint-venv/bin/pip" install --quiet --disable-pip-version-check yamllint==1.38.0
          "$RUNNER_TEMP/yamllint-venv/bin/yamllint" -f parsable .
      - name: "editorconfig-checker（v3.8.0・sha256 検証）"
        if: ${{ !cancelled() }}
        run: |
          ec_dir="$RUNNER_TEMP/editorconfig-checker"
          mkdir -p "$ec_dir"
          curl -fsSL --retry 3 -o "$ec_dir/ec.tar.gz" \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.8.0/ec-linux-amd64.tar.gz
          echo "613bd88f34165a334adcb6b7e92a123c9de0eada65846d31af63613b779ff3be  $ec_dir/ec.tar.gz" | sha256sum -c -
          tar -xzf "$ec_dir/ec.tar.gz" -C "$ec_dir"
          "$ec_dir/bin/ec-linux-amd64"
      - name: "commitlint（pull_request のみ・PR の commit 範囲）"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes \
            -p "@commitlint/cli@21.2.1" \
            -p "@commitlint/config-conventional@21.2.0" \
            commitlint \
            --extends "@commitlint/config-conventional" \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose

  # --------------------------------------------------
  # rust-lint（OS 非依存の静的検査。ubuntu のみ）
  # --------------------------------------------------
  # 旧 rust-ci の fmt・deny と旧 deny-license-reject を統合した。
  # - cargo fmt --all --check: REPAIR-6 のローカルゲートと同じ
  # - cargo deny check（deny-checks: advisories bans licenses sources）: TASK-77（#64）
  #   のライセンス検査（licensing.md）。cargo-deny の版は scripts/versions.sh の CARGO_DENY_VERSION と同期
  # - check-deny-license-reject（TASK-9.1・#338・REPAIR-8）: GPL/AGPL/LGPL/MPL-2.0・
  #   ライセンス未記載の canary を cargo deny が reject し続けることの negative test
  # - Servo ホストの cargo deny（TASK-38・#991・#995・OSS-2・OSS-3）: servo=true のときだけ
  #   `scripts/deny.sh servo-host`（ホスト用 deny.toml。MPL-2.0 の許可はホスト側のみ）を実行する。
  #   servo-host-ubuntu に置かないのは、新しい check-run を増やさず rust-lint の一部とするため
  #   （docs/design/servo-host-design.md §6.2）
  rust-lint:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.servo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_DENY_VERSION: "0.20.2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: "cargo fmt --all --check"
        run: cargo fmt --all --check
      - name: "cargo-deny の導入キャッシュ復元"
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - name: "cargo-deny の導入（未導入・版不一致のときのみ）"
        if: ${{ !cancelled() }}
        run: |
          if cargo deny --version 2>/dev/null | grep -qF "cargo-deny $CARGO_DENY_VERSION"; then
            echo "cargo-deny $CARGO_DENY_VERSION is already installed"
          else
            cargo install --locked --force "cargo-deny@$CARGO_DENY_VERSION"
          fi
          cargo deny --version
      - name: "cargo deny check（advisories bans licenses sources）"
        if: ${{ !cancelled() }}
        run: cargo deny --locked check advisories bans licenses sources
      - name: "許可外ライセンスの reject 検証（make check-deny-license-reject）"
        if: ${{ !cancelled() }}
        run: make check-deny-license-reject
      - name: "cargo deny check（servo-host・servo-host/deny.toml）"
        if: ${{ !cancelled() && needs.changes.outputs.servo == 'true' }}
        run: bash scripts/deny.sh servo-host

  # --------------------------------------------------
  # rust-test-{ubuntu,macos,windows}（clippy + test。rust 変更時のみ。macOS・Windows は PR では skipped）
  # --------------------------------------------------
  # 旧 rust-ci（Fandhe-AI/actions の rust-base-ci.yml）の clippy・test を OS ごとの
  # 明示ジョブへインライン化した（XOS-1・TASK-55.1）。matrix にしないのは、job-level if で
  # スキップされた matrix ジョブが展開されず check 名が変わり required を満たさなくなるため。
  # clippy -D warnings は REPAIR-6（TASK-5.2・#32 / TASK-7・#335）の fail-closed ゲート。
  # cache は 3 OS 共通（Windows の prune 失敗の原因と対処は scripts/ci-prune-target.sh の
  # ヘッダー参照）。CARGO_INCREMENTAL=0・CARGO_PROFILE_DEV_DEBUG も 3 OS 共通。
  rust-test-ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # cache サイズ削減: workspace メンバーを含む全体の debuginfo を行番号のみにする（CI 限定。
      # backtrace のファイル名・行番号は残る。release / bench プロファイルには影響しない）。
      # 依存 crate は Cargo.toml の `[profile.dev.package."*"]` でも同じ値に固定済みで衝突
      # しない（package 指定が優先されるが値が同じ）。メンバーまで行番号のみにするのは本 env だけ
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-test-v6-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-test-v6-${{ steps.toolchain.outputs.cachekey }}-
      - name: "cargo clippy（workspace・--all-features・-D warnings）"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # real_host は test = false で --all-targets から外れる。コンパイル崩れを PR で検出する（実行はしない）
      - name: "cargo clippy（real_host・コンパイル確認のみ）"
        run: cargo clippy -p fandhe-browser-render --test real_host --all-features -- -D warnings
      - name: "cargo test（workspace・--all-features）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features
      # prune は save のためだけの処理なので、save と同じ条件（main かつ exact hit でない）のときだけ
      # 走らせる。PR と exact hit の main では prune に Windows で約 1 分、ubuntu・macOS で
      # 7〜20 秒かかるため省く。9 ジョブ（rust-test・rust-features・harness の 3 OS）で同じ形にする
      - name: "cache 保存前に workspace 成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  rust-test-macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # cache サイズ削減: workspace メンバーを含む全体の debuginfo を行番号のみにする（CI 限定。
      # backtrace のファイル名・行番号は残る。release / bench プロファイルには影響しない）。
      # 依存 crate は Cargo.toml の `[profile.dev.package."*"]` でも同じ値に固定済みで衝突
      # しない（package 指定が優先されるが値が同じ）。メンバーまで行番号のみにするのは本 env だけ
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-test-v6-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-test-v6-${{ steps.toolchain.outputs.cachekey }}-
      - name: "cargo clippy（workspace・--all-features・-D warnings）"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: "cargo test（workspace・--all-features）"
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features
      - name: "cache 保存前に workspace 成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
