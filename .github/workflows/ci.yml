  # --------------------------------------------------
  # windows-servo-prereqs（Servo 組込 Windows ビルドの前提検証）
  # --------------------------------------------------
  # TASK-56.1（#195・XOS-6・MS-3）: Servo を組み込む Windows ビルドは Windows SDK
  # 10.0.19041.0 以上・MSVC v143 ツールセット・C++ ATL（v143 向け）・Python と uv を
  # 必要とする。本ジョブはそれらが windows-latest で揃うことを fail-closed で検証し、
  # 不足するもの（v143 向け ATL・uv）だけ導入する。
  #
  # 別ジョブにした理由: rust-test-*・rust-features-* は Servo を使わないため、前提の不備で既定
  # feature ゲートが落ちる（単一責務に反する）のを避ける。将来の Windows rendering ビルド
  # ジョブ（TASK-58 等）は本ジョブのステップ群を統合・再利用する。
  #
  # runner の実態（runner-images 公開 README・2026-09 時点）: windows-latest は
  # VS 2026（既定ツールセット v145）。Windows SDK 10.0.26100.0・v143 系ツールセット
  # （MSVC 14.44）・Python 3 は導入済みで検証のみ。v143 向け ATL は未導入の可能性が
  # あるため、無い場合のみ VS Installer で追加する。uv は未導入のためバージョンと
  # sha256 を固定して pip で導入する（iwr | iex や新規サードパーティ action は使わない）。
  #
  # pwsh は末尾でしか $LASTEXITCODE を検査しないため、ネイティブコマンドごとに
  # 明示判定する。checkout・secrets は不要。
  #
  # 出る check-run はすべて required にする前提のため、windows-servo-prereqs も required に含める。
  windows-servo-prereqs:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    # VS Installer の modify に時間がかかりうるため 30 分。ハング防止（NFR-10）
    timeout-minutes: 30
    # checkout も GitHub API も使わないため権限は不要（最小権限）
    permissions: {}
    defaults:
      run:
        shell: pwsh
    env:
      # Servo の Windows 前提の下限（XOS-6）
      MIN_WINDOWS_SDK: "10.0.19041.0"
      # v143 向け C++ ATL の VS コンポーネント ID（VS 2026 の 14.44 サイドバイサイド）
      ATL_V143_COMPONENT: Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL
      # uv は完全固定（win_amd64 wheel の sha256 で完全性を検証）
      UV_VERSION: "0.12.20"
      UV_WHEEL_SHA256: 1502e03f4da3280cbb493d356d59bdd401bf23197cd71df64e1c6feac156090c
    steps:
      - name: Windows SDK の検証
        run: |
          $min = [version]$env:MIN_WINDOWS_SDK
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $found = @()
          if (Test-Path $root) {
            $found = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Name } |
              Where-Object { $_ -ge $min } | Sort-Object -Descending
          }
          if ($found.Count -eq 0) {
            Write-Host "::error::Windows SDK >= $min not found under $root"
            exit 1
          }
          Write-Host "Windows SDK: $($found[0])"
      - name: VS と MSVC v143 ツールセットの検証
        run: |
          $vsInstaller = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $vsInstaller 'vswhere.exe'
          $installPath = & $vswhere -products * -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installPath)) {
            Write-Host "::error::Visual Studio with the MSVC toolset not found"
            exit 1
          }
          $installPath = $installPath.Trim()
          $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
          # v143 のうち ATL 導入対象（ATL_V143_COMPONENT）と対になる 14.44 系のみを
          # 検証対象にする（ATL は 14.44 固定のため、別版を選ぶと atlbase.h が見つからない）
          $v143 = @()
          if (Test-Path $msvcRoot) {
            $v143 = Get-ChildItem $msvcRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Where-Object { [version]$_.Name -ge [version]'14.44' } |
              Where-Object { [version]$_.Name -lt [version]'14.45' } |
              Sort-Object { [version]$_.Name } -Descending
          }
          if ($v143.Count -eq 0) {
            Write-Host "::error::MSVC v143 toolset 14.44 (paired with the ATL component) not found under $msvcRoot"
            exit 1
          }
          Write-Host "VS: $installPath"
          Write-Host "MSVC v143 toolset: $($v143[0].Name)"
          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSVC_V143_DIR=$($v143[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: v143 向け C++ ATL の検証（無ければ導入）
        run: |
          $header = Join-Path $env:MSVC_V143_DIR 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            Write-Host "ATL for v143 not found; installing $env:ATL_V143_COMPONENT"
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$env:VS_INSTALL_PATH`"",
              '--add', $env:ATL_V143_COMPONENT,
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Write-Host "::error::VS Installer failed with exit code $($p.ExitCode)"
              exit 1
            }
          }
          if (-not (Test-Path $header)) {
            Write-Host "::error::C++ ATL for v143 (atlbase.h) not found under $env:MSVC_V143_DIR"
            exit 1
          }
          Write-Host "C++ ATL for v143: $header"
      - name: Python の検証
        run: |
          $out = python --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^Python 3\.') {
            Write-Host "::error::Python 3.x not found (got: $out)"
            exit 1
          }
          Write-Host $out
      - name: uv の導入（バージョン・ハッシュ固定）
        run: |
          # 導入済みの uv があっても sha256 検証を必ず通すため、まず wheel を
          # 明示取得（--require-hashes で検証）し、その wheel を強制再導入する
          $work = Join-Path $env:RUNNER_TEMP 'uv-wheel'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $req = Join-Path $work 'uv-requirements.txt'
          "uv==$env:UV_VERSION --hash=sha256:$env:UV_WHEEL_SHA256" | Out-File -FilePath $req -Encoding ascii
          python -m pip download --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps -d $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::hash-verified download of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          python -m pip install --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps --force-reinstall `
            --no-index --find-links $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          # 出力は "uv 0.12.20 (<hash> <date> <target>)" 形式のため前方一致で比較する
          $ver = python -m uv --version
          if ($LASTEXITCODE -ne 0 -or $ver -notlike "uv $env:UV_VERSION *") {
            Write-Host "::error::unexpected uv version: $ver"
            exit 1
          }
          Write-Host $ver

  # --------------------------------------------------
  # cross-target-check（Linux 上のクロス型検査: macOS・Windows。rust 変更時。PR でも実行）
  # --------------------------------------------------
  # pull_request では macOS・Windows のネイティブジョブを走らせない（オーナー判断 2026-10-10）ため、
  # ubuntu ランナー上で aarch64-apple-darwin と x86_64-pc-windows-msvc 向けに型検査し、OS 固有の
  # コンパイルエラー・clippy 警告・feature 構成の誤りを PR で検出する。参考: Fandhe-AI/fandhe-container
  # の cross-target-check。check / clippy のみでリンクもテスト実行もしないため、実行時の挙動
  # （パス・大文字小文字・改行・OS のツール差）は保証しない。実行時の誤りは push（main）・
  # workflow_dispatch の 3 OS ネイティブ実行で検出する（ci.md「3 OS CI」）。
  #
  # 検査範囲は限定される（2026-10-10 にローカルで実測。REPAIR-3）: 依存の rustls が使う `ring` は
  # build.rs で cc-rs 経由の C / アセンブラのコンパイルを行い、クロスでは macOS SDK / MSVC の
  # ツールチェーン（ヘッダ・lib.exe）が要る。ubuntu 上の cc / clang ではヘッダ不足で失敗するため、
  # `ring` に至る fandhe-browser-core（reqwest / rustls）とそれに依存する -ai・-cdp・-cli、および
  # wpt-subset-runner は --exclude で外す。render も fandhe-browser-core に依存する（HostRenderer。
  # TASK-38・#235）ため同様に外す。残る js（V8・boa）・profile・mcp は
  # `cc` / `ring` / `cmake` を依存に持たず（`cargo tree` で確認。bindgen は v8 の build-dependency
  # だが prebuilt 利用時は動かない）、check / clippy が両ターゲットで通る。
  # 未検査の範囲: core・ai・cdp・cli・render・wpt-subset-runner の OS 固有分岐（cfg(target_os) 等）。
  # これらの OS 固有のコンパイル・lint の誤りは push（main）の macOS・Windows ネイティブ実行でしか
  # 検出されない。--exclude 方式のため、除外対象の crate が増えれば ring を引く新しい crate は
  # ここで失敗として表面化する（黙って検査対象が狭まらない）。cc を使う依存を js・profile・
  # mcp に追加した場合は、その crate もここで --exclude する。
  # v8 の build.rs は prebuilt の静的ライブラリ（約 150MB / ターゲット）をダウンロードする
  # （target/ 配下。時間とネットワークを使うため、target は cache しない）。
  # 実行コマンドはターゲットごとに check（--all-features）・clippy（--all-features と既定 feature）。
  cross-target-check:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc
      - name: "cargo cache の復元（registry のみ）"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-${{ runner.os }}-cross-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-cross-v2-
      - name: "cargo check（aarch64-apple-darwin・--all-features）"
        run: >-
          cargo check --workspace --all-targets --all-features --target aarch64-apple-darwin
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render
      - name: "cargo clippy（aarch64-apple-darwin・--all-features・-D warnings）"
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --all-targets --all-features --target aarch64-apple-darwin
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render -- -D warnings
      - name: "cargo clippy（aarch64-apple-darwin・既定 feature・-D warnings）"
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render -- -D warnings
      - name: "cargo check（x86_64-pc-windows-msvc・--all-features）"
        if: ${{ !cancelled() }}
        run: >-
          cargo check --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render
      - name: "cargo clippy（x86_64-pc-windows-msvc・--all-features・-D warnings）"
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render -- -D warnings
      - name: "cargo clippy（x86_64-pc-windows-msvc・既定 feature・-D warnings）"
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc
          --exclude fandhe-browser-core --exclude fandhe-browser-ai --exclude fandhe-browser-cdp
          --exclude fandhe-browser-cli --exclude wpt-subset-runner --exclude fandhe-browser-render -- -D warnings
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache.outputs.cache-primary-key }}
