name: CI

# push/pull_request で自動起動する（TASK-55.2・Issue #59・対象ビヘイビア XOS-1・MS-1）。
# workflow_dispatch は手動再実行・検証用に併存させる。有効化に伴い、本リポに存在しない
# make ターゲット・scripts/ を前提にした vector-db 由来のジョブ（test-default-build
# 以降。前バージョンの本ファイル参照）はすべて削除した。lint-docs が参照する設定
# ファイル（.markdownlint.jsonc 等）の整備・rust-ci の cache-key-prefix のリポ名への
# 変更は TASK-55.3（Issue #60）で完了済み。3 OS matrix 対応（.claude/rules/ci.md）は
# rust-ci ジョブで対応済み（TASK-55.1・Issue #58）。lint-docs は引き続き
# ubuntu-latest 単独実行。clippy -D warnings ゲート（fail-closed）の明文化は
# TASK-5.2（#32・REPAIR-6）を参照。TASK-7（#335・REPAIR-6）が求める
# 「clippy 警告 0 件の維持確認」も、下記 rust-ci・rust-ci-default-features の
# 同ゲートで担保する（新規ジョブ追加ではなく既存ゲートの明文化）。
# TASK-9.1（#338・REPAIR-8）: 下記 deny-license-reject ジョブを追加した。
# 受入基準 1（cargo deny check licenses を CI で実行する）は TASK-77（#64）の
# 時点で rust-ci（deny-checks: ... licenses ...）が満たしており、
# deny-license-reject はその fail-closed 性（許可外ライセンス混入時に確実に
# reject するか）を negative test で継続的に検証する
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う。PR #4 codex P2 指摘）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の集約ジョブ `lint-docs / lint-docs-complete`
  # （fail-closed。各 lint ジョブは boolean input の if: を持つ条件付きジョブとして
  # 明示リストで skipped を判定する）を branch protection の必須チェックに使う。
  # rust-base-ci reusable workflow のジョブは下記 rust-ci として本 workflow に
  # 定義済み（#31。TASK-66 の Cargo.toml 追加で有効化）。3 OS matrix
  # （TASK-55.1・#58）により OS ごとに別名のチェックが生成されるため、
  # branch protection の必須チェックへは、その集約ジョブを OS 数分
  # （`rust-ci (ubuntu-latest|macos-latest|windows-latest) /
  # rust-base-ci-complete` の 3 件）に加え、既定 feature 検証ジョブ（下記。
  # 同じく 3 OS matrix のため OS ごとに別名）の
  # `rust-ci-default-features (ubuntu-latest)`・
  # `rust-ci-default-features (macos-latest)`・
  # `rust-ci-default-features (windows-latest)` の 3 件も追加する必要がある
  # （TASK-55.2・#59 時点で
  # push/pull_request トリガーが有効化されたため、この登録作業はユーザー作業と
  # して実施可能になった。登録自体は本変更の対象外）。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準。AGENTS.md「CI・ワークフローの改変」の例外を参照）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # TASK-66 の workspace 追加（Cargo.toml）に伴い有効化。reusable workflow 側の
  # `test` ジョブが `cargo test --workspace --all-features` を continue-on-error
  # 無しで実行し、集約ジョブ `rust-base-ci-complete` が fmt/clippy/test/deny 各
  # ジョブの result を明示チェックしてフェイルクローズで判定する
  # （TASK-5.1・`REPAIR-5`。本呼び出しからは `rust-ci (<os>) / rust-base-ci-complete`
  # として見える）。branch protection の必須チェックへ追加する運用はユーザー
  # 作業（PR 本文参照）。
  #
  # clippy -D warnings ゲート（TASK-5.2・`REPAIR-6`）: reusable 側 `clippy` ジョブが
  # `cargo clippy --workspace --all-targets --all-features -- -D warnings` を
  # 上記 3 OS で実行し、警告が 1 件でもあれば非ゼロ終了する。`rust-base-ci-complete`
  # は他ジョブと同様に `needs.clippy.result` を検査するため、clippy 失敗時は
  # `rust-ci (<os>) / rust-base-ci-complete` 自体が fail-closed で失敗する。
  # TASK-7（#335・REPAIR-6）の「警告 0 件維持確認」の CI ゲートを兼ねる
  # （--all-features 構成側。確認記録は #335 の PR 本文を参照）。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1・TASK-55.1）: Linux・macOS・Windows の
  # ネイティブ runner で rust-base-ci（fmt/clippy/test/deny）をそれぞれ実行する。
  # fail-fast: false は 1 OS の失敗で他 OS の実行を打ち切らせないため
  # （3 OS すべての結果を必ず得る。ci.md「特定 OS のみの skip で CI を通さない」）。
  # matrix.os の要素数だけ別名のチェックが生成されるため、branch protection の
  # 必須チェックへは OS 数分（3 件）を追加する必要がある。
  rust-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # 3 OS matrix。matrix.os をそのまま runner-label へ渡す
      # （public リポジトリの GitHub ホステッド runner 方針は維持）
      runner-label: ${{ matrix.os }}
      # make deny（Makefile の deny ターゲット）と同一のチェック集合。
      # licenses チェックは TASK-77・OSS-3（MS-1）対応（deny.toml の [licenses] 参照）
      deny-checks: advisories bans licenses sources
      # cargo レジストリ・target の cache（reusable 側のオプトイン入力。
      # `actions/cache`・key は `**/Cargo.lock` のハッシュに加え `runner.os` を
      # 含む形で reusable workflow 側が OS ごとに分離する）。ホステッド runner は
      # 毎回まっさらなため、無効のままだと fmt／clippy／test／deny の各ジョブが
      # 依存クレートを毎回フルビルドすることになる。cache-key-prefix は
      # 他リポジトリ（既定値 `rust-base-ci` や、CI 設定を輸入した際の残置物
      # `vector-db`）との衝突回避のため本リポ名にする（TASK-55.3・Issue #60）
      #
      # windows-latest のみ既定 false（Issue #59 レビュー指摘。PR #409 CI 失敗の
      # 実測: rust-base-ci.yml（Fandhe-AI/actions・@latest）の
      # 「workspace メンバー成果物を prune（cache 保存前・cache 有効時のみ）」
      # ステップが `cargo clippy`/`cargo test` 自体は成功しているにも関わらず、
      # windows-latest のみ ##[error]想定外の crate / target 名を検出したため
      # prune を中止します（名前: fandhe-browser-ai）で exit code 1 になり、
      # rust-ci (windows-latest) / rust-base-ci-complete を fail させていた
      # （ubuntu-latest・macos-latest では未再現。実行ログでは jq 側のエラー出力は
      # 見えず、cargo metadata の出力を読む `while IFS= read -r -d ''` ループの
      # 最初の 1 件目（sort -u で先頭になった fandhe-browser-ai）で即座に失敗して
      # おり、crate 名自体は `^[\p{L}\p{N}_-]+$` を満たす正当な値のため、
      # windows-latest（git-bash/MSYS）環境でこの prune スクリプトの
      # 名前検証ロジックが誤検出している可能性が高い）。原因は本リポではなく
      # 呼び出し先の reusable workflow（Fandhe-AI/actions）側にあり、本リポの
      # crate 構成・PR #409 の差分（ci.yml の cache-key-prefix 変更・render crate
      # 追加等）には起因しない。恒久修正は Fandhe-AI/actions 側の対応を要する
      # ため、それまでの回避策として windows-latest のみ cache を無効化する
      # （現時点は各 crate が雛形のみで依存もなく、cache 無効化によるビルド時間
      # 増加コストは小さい）。Fandhe-AI/actions 側で修正され次第この条件式は削除
      # してよい
      cache: ${{ matrix.os != 'windows-latest' }}
      cache-key-prefix: fandhe-browser

  # --------------------------------------------------
  # rust-ci-default-features（既定 feature でのローカルゲート再現）
  # --------------------------------------------------
  # 上記 rust-ci（reusable workflow）は `cargo clippy/test --all-features` で
  # 検証するため、既定 feature（`--all-features` なし）の構成は別途検証されない。
  # AGENTS.md「ローカルゲート」・.claude/rules/ci.md が要求する
  #   cargo clippy --workspace --all-targets -- -D warnings
  #   cargo test --workspace
  # （いずれも既定 feature）を、pull_request/push で自動起動する本 workflow 内で
  # 直接実行し、既定 feature 側の回帰も CI で検出できるようにする
  # （TASK-55.2・Issue #59 レビュー指摘。REPAIR-5・REPAIR-6）。
  # Makefile の `lint`/`test` ターゲット（既定 feature 用）と同一コマンドを実行する。
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1）に従い、rust-ci と同じ 3 OS matrix で
  # 実行する（既定 feature 構成の OS 依存回帰を --all-features 側だけでは検出できない
  # ため。PR #409 レビュー指摘）。
  #
  # clippy -D warnings ゲート（TASK-5.2・`REPAIR-6`）: 下記 `cargo clippy` ステップは
  # 3 OS すべてで同一コマンドを実行し、1 ステップ 1 コマンドのためステップの
  # 非ゼロ終了がそのままジョブ失敗になる。windows-latest の既定シェルは pwsh だが、
  # Actions が単一コマンドステップの末尾に付与する `exit $LASTEXITCODE` 相当の
  # 挙動により終了コードが伝播し、他 OS と同様に fail-closed で機能する
  # （`shell:` 明示指定は不要。誤って追加修正しないこと）。
  # TASK-7（#335・REPAIR-6）の「警告 0 件維持確認」の CI ゲートを兼ねる
  # （既定 feature 構成側。確認記録は #335 の PR 本文を参照）。
  rust-ci-default-features:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブの無期限実行を防ぐ多層防御（NFR-10・.claude/rules/ci.md）。
    # 他の raw-step ジョブ（release.yml の verify 等）と同じ 30 分を採用する。
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy（既定 feature）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（既定 feature）
        run: cargo test --workspace

  # --------------------------------------------------
  # compat-regression（対象サイト群の動作率マトリクスに対する回帰チェック）
  # --------------------------------------------------
  # TASK-9.2（Issue #339・REPAIR-8。Could）: 対象サイト群の互換性回帰を機械的に
  # 検出する CI ゲート。閾値の根拠は COMPAT-4（全体動作率 70% 以上）・COMPAT-1
  # （静的・SPA・フォーム等の類型別動作率 70% 以上）。判定本体は
  # harness/compat-regression/check-matrix.sh（bash + jq。新規 Cargo 依存・新規
  # サードパーティ action は追加しない。dependency-policy.md）で、スキーマ契約・
  # 終了コードは harness/compat-regression/README.md を参照。
  #
  # self-test を毎回先に実行し、fixture（合成データ）に対して「閾値未満で fail
  # する」ことをこのジョブのログへ証跡として残してから、実マトリクスの判定へ進む
  # （REPAIR-5・REPAIR-8。品質ゲートが無言で素通りしないことの担保）。
  #
  # 実マトリクス harness/compat-practical/results/matrix.json は TASK-71.3
  # （Issue #312）が生成予定でまだ存在しないため、当面 --allow-missing を渡す
  # （ファイル不在時は ::warning:: を出して exit 0）。#312 がマトリクスをコミット
  # したら --allow-missing を削除し、ファイル不在を fail-closed（exit 2）に戻す
  # こと（harness/compat-regression/README.md にも同じ削除条件を明記）。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1）に合わせ ubuntu/macos/windows の
  # 3 OS matrix で実行する。全ステップ shell: bash を明示する（rust-ci-default-
  # features 上部コメントの「shell: 明示不要」は cargo 単一コマンドのステップに
  # のみ当てはまる注記であり、本ジョブの複数コマンド・jq を含むシェルスクリプト
  # 実行には当てはまらないため、Windows（既定 pwsh）でも git-bash で確実に動く
  # よう明示する）。cargo・ネットワークアクセス・secrets は使わない。
  #
  # branch protection の必須チェックへ追加する場合は OS 数分
  # （`compat-regression (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`
  # の 3 件）を登録する必要がある（ユーザー作業。本変更の対象外）。
  compat-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: jq の導入確認
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
      - name: 自己テスト（fixture による閾値未満 fail の証跡確認）
        run: bash harness/compat-regression/self-test.sh
      - name: 対象サイト群の動作率回帰チェック
        run: |
          bash harness/compat-regression/check-matrix.sh \
            --matrix harness/compat-practical/results/matrix.json \
            --threshold 70 \
            --categories static,spa,form \
            --all-categories \
            --allow-missing

  # --------------------------------------------------
  # deny-license-reject（cargo-deny の許可外ライセンス reject negative test）
  # --------------------------------------------------
  # TASK-9.1（#338・REPAIR-8）: 受入基準 2（許可外ライセンスが混入したら fail
  # することをログで示す）の証跡ジョブ。受入基準 1 の本体（実依存グラフに対する
  # `cargo deny check licenses` の実行）は上記 rust-ci ジョブ（TASK-77・#64・
  # `deny-checks: advisories bans licenses sources`）が 3 OS で担っており、
  # 本ジョブは重ねて追加しない。ここでは `make check-deny-license-reject`
  # （依存ゼロの canary crate へ本リポの deny.toml を当てる negative test。
  # Makefile 側のコメント参照）を実行し、GPL/AGPL/LGPL/MPL-2.0・ライセンス欄なし
  # の canary がいずれも `error[rejected]`/`error[unlicensed]` で reject され、
  # 陽性対照（`MIT OR Apache-2.0`）は通ることをログに残す（fail-closed 性の
  # 継続的な証跡）。
  #
  # ubuntu-latest 単独にする理由: このジョブが検証するのは deny.toml の
  # ライセンス評価という設定意味論であり、OS 差異に依存しない
  # （実依存グラフに対する `cargo deny check` 本体はすでに rust-ci の 3 OS
  # matrix で走っている。lint-docs も同様の理由で ubuntu-latest 単独）。
  # 「特定 OS のみ skip して CI を通す」（ci.md）には当たらない。
  #
  # cargo-deny の導入は `make check-deny-license-reject`（Makefile の
  # `CARGO_DENY_VERSION` を単一の版管理箇所とする）に委ねるため、本ジョブでは
  # 新たに `cargo-deny` 専用の action は追加しない。
  deny-license-reject:
    runs-on: ubuntu-latest
    # ハングしたジョブの無期限実行を防ぐ多層防御（NFR-10・.claude/rules/ci.md）
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: make check-deny-license-reject
        run: make check-deny-license-reject
