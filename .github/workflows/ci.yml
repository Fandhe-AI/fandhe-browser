name: CI

# push/pull_request で自動起動する（TASK-55.2・Issue #59・対象ビヘイビア XOS-1・MS-1）。
# workflow_dispatch は手動再実行・検証用に併存させる。有効化に伴い、本リポに存在しない
# make ターゲット・scripts/ を前提にした vector-db 由来のジョブ（test-default-build
# 以降。前バージョンの本ファイル参照）はすべて削除し、rust-ci の cache-key-prefix も
# vector-db から fandhe-browser 由来の値へ修正した。3 OS matrix 対応
# （.claude/rules/ci.md）は rust-ci ジョブで対応済み（TASK-55.1・Issue #58）。
# lint-docs は引き続き ubuntu-latest 単独実行
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う。PR #4 codex P2 指摘）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の集約ジョブ `lint-docs / lint-docs-complete`
  # （fail-closed。各 lint ジョブは boolean input の if: を持つ条件付きジョブとして
  # 明示リストで skipped を判定する）を branch protection の必須チェックに使う。
  # rust-base-ci reusable workflow のジョブは下記 rust-ci として本 workflow に
  # 定義済み（#31。TASK-66 の Cargo.toml 追加で有効化）。3 OS matrix
  # （TASK-55.1・#58）により OS ごとに別名のチェックが生成されるため、
  # branch protection の必須チェックへは、その集約ジョブを OS 数分
  # （`rust-ci (ubuntu-latest|macos-latest|windows-latest) /
  # rust-base-ci-complete` の 3 件）に加え、既定 feature 検証ジョブ
  # `rust-ci-default-features`（下記）も追加する必要がある（TASK-55.2・#59 時点で
  # push/pull_request トリガーが有効化されたため、この登録作業はユーザー作業と
  # して実施可能になった。登録自体は本変更の対象外）。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準。AGENTS.md「CI・ワークフローの改変」の例外を参照）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # TASK-66 の workspace 追加（Cargo.toml）に伴い有効化。reusable workflow 側の
  # `test` ジョブが `cargo test --workspace --all-features` を continue-on-error
  # 無しで実行し、集約ジョブ `rust-base-ci-complete` が fmt/clippy/test/deny 各
  # ジョブの result を明示チェックしてフェイルクローズで判定する
  # （TASK-5.1・`REPAIR-5`。本呼び出しからは `rust-ci (<os>) / rust-base-ci-complete`
  # として見える）。branch protection の必須チェックへ追加する運用はユーザー
  # 作業（PR 本文参照）。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1・TASK-55.1）: Linux・macOS・Windows の
  # ネイティブ runner で rust-base-ci（fmt/clippy/test/deny）をそれぞれ実行する。
  # fail-fast: false は 1 OS の失敗で他 OS の実行を打ち切らせないため
  # （3 OS すべての結果を必ず得る。ci.md「特定 OS のみの skip で CI を通さない」）。
  # matrix.os の要素数だけ別名のチェックが生成されるため、branch protection の
  # 必須チェックへは OS 数分（3 件）を追加する必要がある。
  rust-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # 3 OS matrix。matrix.os をそのまま runner-label へ渡す
      # （public リポジトリの GitHub ホステッド runner 方針は維持）
      runner-label: ${{ matrix.os }}
      # make deny（Makefile の deny ターゲット）と同一のチェック集合。
      # licenses チェックは TASK-77・OSS-3（MS-1）対応（deny.toml の [licenses] 参照）
      deny-checks: advisories bans licenses sources
      # cargo レジストリ・target の cache（reusable 側のオプトイン入力。
      # `actions/cache`・key は `**/Cargo.lock` のハッシュ）。ホステッド runner は毎回
      # まっさらなため、無効のままだと clippy／test／deny の各ジョブが `--all-features`
      # の依存を毎回フルビルドすることになる（現時点では crates/fandhe-browser-js・
      # crates/fandhe-browser-cdp の雛形のみで重依存は無いが、V8（rusty_v8）・Servo
      # 導入後はビルド時間が増える見込み）。cache-key-prefix は他リポジトリと
      # 同じ既定値 `rust-base-ci` との衝突回避のため本リポ名にする
      cache: true
      cache-key-prefix: fandhe-browser

  # --------------------------------------------------
  # rust-ci-default-features（既定 feature でのローカルゲート再現）
  # --------------------------------------------------
  # 上記 rust-ci（reusable workflow）は `cargo clippy/test --all-features` で
  # 検証するため、既定 feature（`--all-features` なし）の構成は別途検証されない。
  # AGENTS.md「ローカルゲート」・.claude/rules/ci.md が要求する
  #   cargo clippy --workspace --all-targets -- -D warnings
  #   cargo test --workspace
  # （いずれも既定 feature）を、pull_request/push で自動起動する本 workflow 内で
  # 直接実行し、既定 feature 側の回帰も CI で検出できるようにする
  # （TASK-55.2・Issue #59 レビュー指摘。REPAIR-5・REPAIR-6）。
  # Makefile の `lint`/`test` ターゲット（既定 feature 用）と同一コマンドを実行する。
  # 3 OS matrix は rust-ci（--all-features 側）で担保済みのため、本ジョブは
  # コスト抑制のため ubuntu-latest 単独実行とする（既定 feature は OS 依存差分が
  # 小さいクレート構成である現時点の判断。OS 依存差分が生じた場合は 3 OS へ拡張する）。
  rust-ci-default-features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy（既定 feature）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（既定 feature）
        run: cargo test --workspace
