      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: "cargo cache の復元"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # yamllint disable-line rule:line-length
          key: rust-${{ runner.os }}-features-boa-v1-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-features-boa-v1-${{ steps.toolchain.outputs.cachekey }}-
      - name: "[js-boa] cargo build（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo build -p fandhe-browser-cli --no-default-features --features js-boa
      - name: "[js-boa] cargo clippy（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-cli --all-targets --no-default-features --features js-boa -- -D warnings
      - name: "[js-boa] cargo test（cli 軽量ビルド）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-cli --no-default-features --features js-boa
      - name: "[js-boa] cargo clippy（js js-boa）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-js --all-targets --features js-boa -- -D warnings
      - name: "[js-boa] cargo test（js js-boa）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-js --features js-boa
      - name: "[js-boa] cargo test（core js-boa）"
        if: ${{ !cancelled() }}
        run: cargo test -p fandhe-browser-core --features js-boa
      - name: "cache 保存前に workspace 成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # --------------------------------------------------
  # harness-{ubuntu,macos,windows}（分離検証・ハーネス自己テスト・サイズ検査。
  # rust または harness 変更時）
  # --------------------------------------------------
  # 旧 render-isolation・js-engine-isolation・compat-regression・puppeteer-connect-selftest・
  # bench-record-selftest・mcp-envelope-smoke・binary-size の各 3 OS ジョブを OS ごとの
  # 1 ジョブへ束ねた。ステップ名の接頭辞が旧ジョブ名。各ステップは !cancelled() で独立に
  # 走らせ、失敗箇所を 1 回の実行で特定できるようにする。
  #   [render-isolation]       既定ビルドに Servo が無いこと（TASK-34.1・#465・RENDER-1）
  #   [js-engine-isolation]    JS エンジン構成別の依存グラフ（TASK-32.4・#168・JS-1）
  #   [compat-regression]      動作率回帰（TASK-9.2・#339・REPAIR-8・COMPAT-1/4）と
  #                            compat-practical の自己テスト（TASK-71.1〜71.3・MEAS-4）。
  #                            --allow-missing は #312（TASK-71.3）の完了まで維持
  #   [bench-record-selftest]  competitor_lightpanda ベンチ記録（TASK-84.2・#212）
  #   [puppeteer-connect-selftest] Puppeteer 接続試験ハーネス（TASK-45.2・#481・CDP-3）
  #   [mcp-envelope-smoke]     MCP エンベロープ e2e（TASK-97.1・#385・PLUG-5。unix のみ
  #                            のため windows ジョブには含めない）
  #   [binary-size]            feature 無効時のサイズ上限（TASK-34.2・#466 / TASK-34.3・#467・
  #                            RENDER-2。上限値・package 名は scripts/versions.sh が単一真実源）。
  #                            対象 package が workspace に無い場合は exit 2 で fail-closed
  #                            （TASK-41.5・#174・REPAIR-5・#633）
  #   [static-link]            musl 配布バイナリ（既定・軽量）の動的リンクなし検査（TASK-93.3・#362・
  #                            PLUG-1・CTR-4）。Linux の ELF 成果物の検査のため ubuntu のみ
  #                            （macOS は #364・Windows は #365 が別手段で担う。前例は unix のみの
  #                            [mcp-envelope-smoke]）。`*-linux-gnu` のネイティブ配布物は対象外（#363）。
  #                            ビルド先は target/ の外（RUNNER_TEMP）に置き、cache に入れない
  # cache・CARGO_INCREMENTAL=0・CARGO_PROFILE_DEV_DEBUG は 3 OS 共通（上記 rust-test と同じ）。
  harness-ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.harness == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # cache サイズ削減: workspace メンバーを含む全体の debuginfo を行番号のみにする（CI 限定。
      # backtrace のファイル名・行番号は残る。release / bench プロファイルには影響しない）。
      # 依存 crate は Cargo.toml の `[profile.dev.package."*"]` でも同じ値に固定済みで衝突
      # しない（package 指定が優先されるが値が同じ）。メンバーまで行番号のみにするのは本 env だけ
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: "cargo cache の復元"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-harness-v3-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-harness-v3-${{ steps.toolchain.outputs.cachekey }}-
      - name: "前提ツール（jq・node 22 以降）の確認"
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
          if ! node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)'; then
            echo "error: node 22 or later (built-in WebSocket) is required" >&2
            exit 1
          fi
      - name: "[render-isolation] 自己テスト（合成データによる Servo 系検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh --self-test
      - name: "[render-isolation] 既定ビルドの依存グラフ検査"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh
      - name: "[js-engine-isolation] 自己テスト（合成データによる検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-js-engine-isolation.sh --self-test
      - name: "[js-engine-isolation] JS エンジン構成の依存グラフ検査"
        if: ${{ !cancelled() }}
        run: bash scripts/check-js-engine-isolation.sh
      - name: "[compat-regression] 自己テスト（fixture による閾値未満 fail の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash harness/compat-regression/self-test.sh
      - name: "[compat-regression] compat-practical 自己テスト・tasks.json スキーマ検証"
        if: ${{ !cancelled() }}
        run: |
          bash harness/compat-practical/self-test.sh
          bash harness/compat-practical/access_check.sh --validate-only
          bash harness/compat-practical/run_core.sh --validate-only
          bash harness/compat-practical/make_matrix.sh --validate-only
      - name: "[compat-regression] 対象サイト群の動作率回帰チェック"
        if: ${{ !cancelled() }}
        run: |
          bash harness/compat-regression/check-matrix.sh \
            --matrix harness/compat-practical/results/matrix.json \
            --threshold 70 \
            --categories static,spa,form \
            --all-categories \
            --allow-missing
      - name: "[bench-record-selftest] record.sh 自己テスト"
        if: ${{ !cancelled() }}
        run: bash benches/competitor_lightpanda/self-test.sh
      - name: "[puppeteer-connect-selftest] puppeteer-connect 自己テスト・契約テスト"
        if: ${{ !cancelled() }}
        run: bash harness/puppeteer-connect/self-test.sh
      - name: "[mcp-envelope-smoke] MCP エンベロープ e2e smoke"
        if: ${{ !cancelled() }}
        run: make check-mcp-envelope
      - name: "[binary-size] scripts/versions.sh から上限値・package 名を抽出"
        id: config
        if: ${{ !cancelled() }}
        run: |
          normalized="$(tr -d '\r' < scripts/versions.sh)"
          limit_re='^: "\$\{BINARY_SIZE_LIMIT_BYTES:=([0-9]{1,15})\}"$'
          package_re='^: "\$\{BINARY_SIZE_PACKAGE:=([A-Za-z0-9._-]{1,64})\}"$'
          limit_matches="$(printf '%s\n' "$normalized" | grep -cE "$limit_re" || true)"
          package_matches="$(printf '%s\n' "$normalized" | grep -cE "$package_re" || true)"
          if [ "$limit_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_LIMIT_BYTES not in versions.sh exactly once (found: $limit_matches)" >&2
            exit 1
          fi
          if [ "$package_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_PACKAGE not in versions.sh exactly once (found: $package_matches)" >&2
            exit 1
          fi
          limit="$(printf '%s\n' "$normalized" | sed -nE "s/$limit_re/\\1/p")"
          package="$(printf '%s\n' "$normalized" | sed -nE "s/$package_re/\\1/p")"
          echo "limit_bytes=$limit" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: "[binary-size] 自己テスト（fixture による上限超過 fail の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash harness/binary-size/self-test.sh
      - name: "[binary-size] feature 無効時のリリースバイナリサイズ検査"
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        env:
          BINARY_SIZE_LIMIT_BYTES: ${{ steps.config.outputs.limit_bytes }}
          BINARY_SIZE_PACKAGE: ${{ steps.config.outputs.package }}
        run: |
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          status=0
          bash harness/binary-size/check-binary-size.sh \
            --package "$BINARY_SIZE_PACKAGE" \
            --limit "$BINARY_SIZE_LIMIT_BYTES" | tee "$out" || status=$?
          {
            echo "### Binary size ($RUNNER_OS)"
            echo
            if grep -q '^binary-size:' "$out"; then
              echo "| host | package | bin | bytes | limit | result |"
              echo "| ---- | ------- | --- | ----- | ----- | ------ |"
              grep '^binary-size:' "$out" | while IFS= read -r line; do
                host="$(printf '%s\n' "$line" | sed -nE 's/.*host=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                package="$(printf '%s\n' "$line" | sed -nE 's/.*package=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bin="$(printf '%s\n' "$line" | sed -nE 's/.*bin=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bytes="$(printf '%s\n' "$line" | sed -nE 's/.*bytes=([0-9]{1,20}).*/\1/p')"
                limit="$(printf '%s\n' "$line" | sed -nE 's/.*limit=([0-9]{1,20}).*/\1/p')"
                result="$(printf '%s\n' "$line" | sed -nE 's/.*result=(pass|fail).*/\1/p')"
                echo "| $host | $package | $bin | $bytes | $limit | $result |"
              done
            else
              echo "(no binary-size output was produced; check-binary-size.sh exited with a usage/build error)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: "[static-link] musl 用 C コンパイラ（musl-tools）の確認・導入"
        if: ${{ !cancelled() }}
        run: |
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends musl-tools
          fi
          dpkg -s musl-tools | grep -E '^(Package|Version):'
      - name: "[static-link] 自己テスト（合成データ・陰性対照による検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-static-link.sh --self-test
      - name: "[static-link] musl 配布バイナリ（既定・軽量）の動的リンクなし検査"
        if: ${{ !cancelled() }}
        run: STATIC_LINK_TARGET_DIR="${RUNNER_TEMP}/static-link-target" make check-static-link
      - name: "cache 保存前に workspace 成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # --------------------------------------------------
  # servo-host-ubuntu（Servo ホストの fmt・clippy・test・分離検証・release。servo 時。PR でも実行）
  # --------------------------------------------------
  # TASK-38（#995・MS-4・RENDER-1）: Servo ホスト（servo-host/。別 workspace・別 Cargo.lock）は
  # 本体の `cargo fmt/clippy/test --workspace` に入らない（exclude）ため、専用ジョブで検査する。
  # 設計 docs/design/servo-host-design.md §4.1・§6.2・§6.3 の案 S2（ubuntu の明示ジョブ）。
  # - 実行条件は servo=true（servo-host/**・crates/fandhe-browser-render/**・scripts/**・.github/** 等。
  #   判定は scripts/ci-changes.sh）。イベントでは絞らず PR・main・workflow_dispatch で走る
  # - ホストの cargo deny は新しい check-run を増やさないよう rust-lint のステップに置く
  # - 分離検証 A〜E は scripts/check-render-isolation.sh（C〜E がホスト側。harness-* の重複ステップは本ジョブへ集約）
  # - release ビルドは main・workflow_dispatch のみ。成果物は RUNNER_TEMP に出し cache しない
  #   （[static-link] と同じ方式）。cache は ubuntu のみ（設計 §6.3）で、key 種別は servohost
  # - 出る check-run は required にする前提（ruleset の更新はオーナーが行う）
  servo-host-ubuntu:
    needs: changes
    if: ${{ needs.changes.outputs.servo == 'true' }}
    runs-on: ubuntu-latest
    # 仮置き。cache なし・ありの計測値 × 約 1.5 に確定する（#995。根拠の run ID は確定時に追記）
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # cache サイズ削減: servo-host/Cargo.toml には `[profile.dev.package."*"]` が無いため、
      # この env が依存を含む全体の debuginfo を行番号のみにする（CI 限定。release には影響しない）
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: "Servo ホストの system 依存の確認・導入"
        run: |
          df -h /
          sudo apt-get update -qq
          # docs/setup/linux.md の apt パッケージ（Ubuntu 公式リポジトリのみ）
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev libssl-dev \
            llvm
          # mozjs_sys の build.rs が llvm-objdump を要求する（無いと "Cannot find llvm-objdump" で失敗）
          for t in clang cmake pkg-config python3 make llvm-objdump; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "error: $t is required but was not found on PATH" >&2
              exit 1
            fi
          done
          clang --version | head -1
          cmake --version | head -1
          python3 --version
          make --version | head -1
      - name: "cargo cache の復元（servo-host）"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            servo-host/target
          key: "rust-${{ runner.os }}-servohost-v1-${{ steps.toolchain.outputs.cachekey }}-\
            ${{ hashFiles('servo-host/Cargo.lock') }}"
          restore-keys: rust-${{ runner.os }}-servohost-v1-${{ steps.toolchain.outputs.cachekey }}-
      - name: "[servo-host] cargo fmt --check"
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path servo-host/Cargo.toml --all --check
      - name: "[servo-host] cargo clippy（dev・--all-targets・-D warnings）"
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path servo-host/Cargo.toml --locked --all-targets -- -D warnings
      - name: "[servo-host] cargo test（dev・契約テストを含む）"
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path servo-host/Cargo.toml --locked
      # 本体の HostRenderer と実 Servo ホストを繋ぐ結合テスト（TASK-38.8b・#998）。real_host は
      # test = false のため --all-targets の clippy にも入らず、ここで明示 clippy・明示実行する。
      - name: "[render-real-host] ホストバイナリの用意（dev）"
        if: ${{ !cancelled() }}
        run: cargo build --manifest-path servo-host/Cargo.toml --locked
      - name: "[render-real-host] cargo clippy（real_host・-D warnings）"
        if: ${{ !cancelled() }}
        run: cargo clippy -p fandhe-browser-render --locked --test real_host -- -D warnings
      - name: "[render-real-host] 実ホスト結合テスト（TASK-38.8b・#998）"
        if: ${{ !cancelled() }}
        env:
          FANDHE_BROWSER_RENDER_HOST: ${{ github.workspace }}/servo-host/target/debug/fandhe-browser-servo-host
        run: |
          set -euo pipefail
          if [ ! -x "$FANDHE_BROWSER_RENDER_HOST" ]; then
            echo "error: servo host binary not found: $FANDHE_BROWSER_RENDER_HOST" >&2
            exit 1
          fi
          log="$RUNNER_TEMP/real_host.log"
          cargo test -p fandhe-browser-render --locked --test real_host -- --test-threads=1 2>&1 | tee "$log"
          # 0 件実行で通さない（fail-closed）
          passed="$(grep -Eo 'test result: ok\. [0-9]+ passed' "$log" | grep -Eo '[0-9]+' | head -1 || true)"
          if [ -z "$passed" ] || [ "$passed" -lt 4 ]; then
            echo "error: real_host ran ${passed:-0} tests (expected >= 4)" >&2
            exit 1
          fi
      - name: "[render-isolation] 自己テスト（合成データによる Servo 系検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh --self-test
      - name: "[render-isolation] 分離検証 A〜E（C〜E がホスト側）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh
      # 保存は release ビルドより前に置く。main は cancel-in-progress のため、最長の release の
      # 途中で次の push が来てジョブごと取り消されても dev の成果物の保存を失わないため
      - name: "cache 保存前に servo-host の成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh --workspace-root servo-host
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            servo-host/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: "[servo-host-release] release ビルド（main・workflow_dispatch のみ）"
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          SERVO_HOST_RELEASE_TARGET_DIR: ${{ runner.temp }}/servo-host-release
        run: |
          cargo build --manifest-path servo-host/Cargo.toml --locked --release \
            --target-dir "$SERVO_HOST_RELEASE_TARGET_DIR"
      # 記録のみ。閾値で fail させない: ホストのバイナリに SSOT 上の閾値は無い
      # （RENDER-2・BINARY_SIZE_LIMIT_BYTES は既定ビルドの cli 向け）。ゲート化はオーナー判断
      - name: "[servo-host-release] リリースバイナリのサイズ記録（main・workflow_dispatch のみ）"
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          SERVO_HOST_RELEASE_TARGET_DIR: ${{ runner.temp }}/servo-host-release
        run: |
          bin="$SERVO_HOST_RELEASE_TARGET_DIR/release/fandhe-browser-servo-host"
          if [ ! -f "$bin" ]; then
            echo "error: release binary not found: $bin" >&2
            exit 1
          fi
          size="$(wc -c < "$bin" | tr -d ' ')"
          if [ "$size" -le 0 ]; then
            echo "error: release binary is empty" >&2
            exit 1
          fi
          echo "servo-host release binary: ${size} bytes"
          {
            echo "### servo-host release binary size"
            echo
            echo "| host | bin | bytes |"
            echo "| ---- | --- | ----- |"
            echo "| ubuntu | fandhe-browser-servo-host | ${size} |"
          } >> "$GITHUB_STEP_SUMMARY"

  harness-macos:
    needs: changes
    if: >-
      ${{ github.event_name != 'pull_request'
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.harness == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      # cache サイズ削減: workspace メンバーを含む全体の debuginfo を行番号のみにする（CI 限定。
      # backtrace のファイル名・行番号は残る。release / bench プロファイルには影響しない）。
      # 依存 crate は Cargo.toml の `[profile.dev.package."*"]` でも同じ値に固定済みで衝突
      # しない（package 指定が優先されるが値が同じ）。メンバーまで行番号のみにするのは本 env だけ
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "cargo cache の復元"
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-harness-v3-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-harness-v3-${{ steps.toolchain.outputs.cachekey }}-
      - name: "前提ツール（jq・node 22 以降）の確認"
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
          if ! node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)'; then
            echo "error: node 22 or later (built-in WebSocket) is required" >&2
            exit 1
          fi
      - name: "[render-isolation] 自己テスト（合成データによる Servo 系検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh --self-test
      - name: "[render-isolation] 既定ビルドの依存グラフ検査"
        if: ${{ !cancelled() }}
        run: bash scripts/check-render-isolation.sh
      - name: "[js-engine-isolation] 自己テスト（合成データによる検出の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash scripts/check-js-engine-isolation.sh --self-test
      - name: "[js-engine-isolation] JS エンジン構成の依存グラフ検査"
        if: ${{ !cancelled() }}
        run: bash scripts/check-js-engine-isolation.sh
      - name: "[compat-regression] 自己テスト（fixture による閾値未満 fail の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash harness/compat-regression/self-test.sh
      - name: "[compat-regression] compat-practical 自己テスト・tasks.json スキーマ検証"
        if: ${{ !cancelled() }}
        run: |
          bash harness/compat-practical/self-test.sh
          bash harness/compat-practical/access_check.sh --validate-only
          bash harness/compat-practical/run_core.sh --validate-only
          bash harness/compat-practical/make_matrix.sh --validate-only
      - name: "[compat-regression] 対象サイト群の動作率回帰チェック"
        if: ${{ !cancelled() }}
        run: |
          bash harness/compat-regression/check-matrix.sh \
            --matrix harness/compat-practical/results/matrix.json \
            --threshold 70 \
            --categories static,spa,form \
            --all-categories \
            --allow-missing
      - name: "[bench-record-selftest] record.sh 自己テスト"
        if: ${{ !cancelled() }}
        run: bash benches/competitor_lightpanda/self-test.sh
      - name: "[puppeteer-connect-selftest] puppeteer-connect 自己テスト・契約テスト"
        if: ${{ !cancelled() }}
        run: bash harness/puppeteer-connect/self-test.sh
      - name: "[mcp-envelope-smoke] MCP エンベロープ e2e smoke"
        if: ${{ !cancelled() }}
        run: make check-mcp-envelope
      - name: "[binary-size] scripts/versions.sh から上限値・package 名を抽出"
        id: config
        if: ${{ !cancelled() }}
        run: |
          normalized="$(tr -d '\r' < scripts/versions.sh)"
          limit_re='^: "\$\{BINARY_SIZE_LIMIT_BYTES:=([0-9]{1,15})\}"$'
          package_re='^: "\$\{BINARY_SIZE_PACKAGE:=([A-Za-z0-9._-]{1,64})\}"$'
          limit_matches="$(printf '%s\n' "$normalized" | grep -cE "$limit_re" || true)"
          package_matches="$(printf '%s\n' "$normalized" | grep -cE "$package_re" || true)"
          if [ "$limit_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_LIMIT_BYTES not in versions.sh exactly once (found: $limit_matches)" >&2
            exit 1
          fi
          if [ "$package_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_PACKAGE not in versions.sh exactly once (found: $package_matches)" >&2
            exit 1
          fi
          limit="$(printf '%s\n' "$normalized" | sed -nE "s/$limit_re/\\1/p")"
          package="$(printf '%s\n' "$normalized" | sed -nE "s/$package_re/\\1/p")"
          echo "limit_bytes=$limit" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: "[binary-size] 自己テスト（fixture による上限超過 fail の証跡確認）"
        if: ${{ !cancelled() }}
        run: bash harness/binary-size/self-test.sh
      - name: "[binary-size] feature 無効時のリリースバイナリサイズ検査"
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        env:
          BINARY_SIZE_LIMIT_BYTES: ${{ steps.config.outputs.limit_bytes }}
          BINARY_SIZE_PACKAGE: ${{ steps.config.outputs.package }}
        run: |
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          status=0
          bash harness/binary-size/check-binary-size.sh \
            --package "$BINARY_SIZE_PACKAGE" \
            --limit "$BINARY_SIZE_LIMIT_BYTES" | tee "$out" || status=$?
          {
            echo "### Binary size ($RUNNER_OS)"
            echo
            if grep -q '^binary-size:' "$out"; then
              echo "| host | package | bin | bytes | limit | result |"
              echo "| ---- | ------- | --- | ----- | ----- | ------ |"
              grep '^binary-size:' "$out" | while IFS= read -r line; do
                host="$(printf '%s\n' "$line" | sed -nE 's/.*host=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                package="$(printf '%s\n' "$line" | sed -nE 's/.*package=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bin="$(printf '%s\n' "$line" | sed -nE 's/.*bin=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bytes="$(printf '%s\n' "$line" | sed -nE 's/.*bytes=([0-9]{1,20}).*/\1/p')"
                limit="$(printf '%s\n' "$line" | sed -nE 's/.*limit=([0-9]{1,20}).*/\1/p')"
                result="$(printf '%s\n' "$line" | sed -nE 's/.*result=(pass|fail).*/\1/p')"
                echo "| $host | $package | $bin | $bytes | $limit | $result |"
              done
            else
              echo "(no binary-size output was produced; check-binary-size.sh exited with a usage/build error)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: "cache 保存前に workspace 成果物を prune"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci-prune-target.sh
      - name: "cargo cache の保存（main のみ・exact hit 時は不要）"
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

