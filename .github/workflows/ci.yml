name: CI

# push/pull_request で自動起動する（TASK-55.2・Issue #59・対象ビヘイビア XOS-1・MS-1）。
# workflow_dispatch は手動再実行・検証用に併存させる。有効化に伴い、本リポに存在しない
# make ターゲット・scripts/ を前提にした vector-db 由来のジョブ（test-default-build
# 以降。前バージョンの本ファイル参照）はすべて削除した。lint-docs が参照する設定
# ファイル（.markdownlint.jsonc 等）の整備・rust-ci の cache-key-prefix のリポ名への
# 変更は TASK-55.3（Issue #60）で完了済み。3 OS matrix 対応（.claude/rules/ci.md）は
# rust-ci ジョブで対応済み（TASK-55.1・Issue #58）。lint-docs は引き続き
# ubuntu-latest 単独実行。clippy -D warnings ゲート（fail-closed）の明文化は
# TASK-5.2（#32・REPAIR-6）を参照。TASK-7（#335・REPAIR-6）が求める
# 「clippy 警告 0 件の維持確認」も、下記 rust-ci・rust-ci-default-features の
# 同ゲートで担保する（新規ジョブ追加ではなく既存ゲートの明文化）。
# TASK-9.1（#338・REPAIR-8）: 下記 deny-license-reject ジョブを追加した。
# 受入基準 1（cargo deny check licenses を CI で実行する）は TASK-77（#64）の
# 時点で rust-ci（deny-checks: ... licenses ...）が満たしており、
# deny-license-reject はその fail-closed 性（許可外ライセンス混入時に確実に
# reject するか）を negative test で継続的に検証する
# TASK-56.1（#195・XOS-6・MS-3）: Servo を組み込む Windows ビルドの前提
# （Windows SDK 10.0.19041.0 以上・MSVC v143・C++ ATL・Python/uv）を、下記
# windows-servo-prereqs ジョブで windows-latest 上に検証（不足分は導入）する形で
# 明記した。Servo 本体の Windows ビルド（--features rendering）の CI 化は
# TASK-58 以降で、docs/setup/windows.md は TASK-56.2（#196）が作成予定
# TASK-34.1（Issue #465・RENDER-1）: 下記 render-isolation ジョブを追加した。
# 従来 `make check-render-isolation` はローカル専用（make ci には含むが CI からは
# 未実行）だったため、PR で Servo 系が混入しても CI では検出できなかった
# （最終防御線は deny.toml の MPL-2.0 不許可のみ）。render-isolation ジョブは
# 同じ判定ロジック（scripts/check-render-isolation.sh）を 3 OS で直接実行する
# TASK-29.7（Issue #158・JS-1・MS-3）: 下記 rust-ci-js-v8 ジョブを追加した。
# rust-ci（--all-features）・rust-ci-default-features（既定）のどちらとも異なる
# `--features js-v8` 単独構成で js crate の TASK-28 共通コンフォーマンステストを
# V8 に対して 3 OS で検証する
# TASK-32.4（Issue #168・JS-1・MS-3）: JS エンジンビルド構成表の残り行を追加した。
# 軽量ビルド（js-boa のみ）は rust-ci-js-boa、依存グラフ検査（軽量ビルドに v8 が
# 無い・エンジンなしに v8 も boa_engine も無い）は js-engine-isolation、両エンジン
# 同梱の共通テストは rust-ci-default-features 内のステップで検証する
# TASK-9.3（#340・REPAIR-8・MS-7）: 受入基準 1（push / pull_request トリガー）は
# TASK-55.2（#59）で、受入基準 2（9.1・9.2 のジョブ統合）は deny-license-reject
# （TASK-9.1・#338）・rust-ci の deny-checks（TASK-77・#64）・compat-regression
# （TASK-9.2・#339）で既に満たしている。本記録は新規ジョブ追加やトリガー変更では
# なく、TASK-9（9.1〜9.3）の本格 CI パイプライン統合が完了したことの明文化
# （TASK-7 の記録と同じ扱い）。compat-regression の --allow-missing は #312
# （TASK-71.3）の完了まで維持する
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う。PR #4 codex P2 指摘）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の集約ジョブ `lint-docs / lint-docs-complete`
  # （fail-closed。各 lint ジョブは boolean input の if: を持つ条件付きジョブとして
  # 明示リストで skipped を判定する）を branch protection の必須チェックに使う。
  # rust-base-ci reusable workflow のジョブは下記 rust-ci として本 workflow に
  # 定義済み（#31。TASK-66 の Cargo.toml 追加で有効化）。3 OS matrix
  # （TASK-55.1・#58）により OS ごとに別名のチェックが生成されるため、
  # branch protection の必須チェックへは、その集約ジョブを OS 数分
  # （`rust-ci (ubuntu-latest|macos-latest|windows-latest) /
  # rust-base-ci-complete` の 3 件）に加え、既定 feature 検証ジョブ（下記。
  # 同じく 3 OS matrix のため OS ごとに別名）の
  # `rust-ci-default-features (ubuntu-latest)`・
  # `rust-ci-default-features (macos-latest)`・
  # `rust-ci-default-features (windows-latest)` の 3 件、および js-v8 単独構成の
  # `rust-ci-js-v8 (ubuntu-latest)`・`rust-ci-js-v8 (macos-latest)`・
  # `rust-ci-js-v8 (windows-latest)` の 3 件、軽量ビルド（js-boa のみ）の
  # `rust-ci-js-boa (<os>)` と JS エンジン分離検査の `js-engine-isolation (<os>)`
  # （いずれも ubuntu-latest・macos-latest・windows-latest の各 3 件）も追加する
  # 必要がある（TASK-32.4・#168。登録はユーザー作業で本変更の対象外）
  # （TASK-55.2・#59 時点で
  # push/pull_request トリガーが有効化されたため、この登録作業はユーザー作業と
  # して実施可能になった。登録自体は本変更の対象外）。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準。AGENTS.md「CI・ワークフローの改変」の例外を参照）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # TASK-66 の workspace 追加（Cargo.toml）に伴い有効化。reusable workflow 側の
  # `test` ジョブが `cargo test --workspace --all-features` を continue-on-error
  # 無しで実行し、集約ジョブ `rust-base-ci-complete` が fmt/clippy/test/deny 各
  # ジョブの result を明示チェックしてフェイルクローズで判定する
  # （TASK-5.1・`REPAIR-5`。本呼び出しからは `rust-ci (<os>) / rust-base-ci-complete`
  # として見える）。branch protection の必須チェックへ追加する運用はユーザー
  # 作業（PR 本文参照）。
  #
  # clippy -D warnings ゲート（TASK-5.2・`REPAIR-6`）: reusable 側 `clippy` ジョブが
  # `cargo clippy --workspace --all-targets --all-features -- -D warnings` を
  # 上記 3 OS で実行し、警告が 1 件でもあれば非ゼロ終了する。`rust-base-ci-complete`
  # は他ジョブと同様に `needs.clippy.result` を検査するため、clippy 失敗時は
  # `rust-ci (<os>) / rust-base-ci-complete` 自体が fail-closed で失敗する。
  # TASK-7（#335・REPAIR-6）の「警告 0 件維持確認」の CI ゲートを兼ねる
  # （--all-features 構成側。確認記録は #335 の PR 本文を参照）。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1・TASK-55.1）: Linux・macOS・Windows の
  # ネイティブ runner で rust-base-ci（fmt/clippy/test/deny）をそれぞれ実行する。
  # fail-fast: false は 1 OS の失敗で他 OS の実行を打ち切らせないため
  # （3 OS すべての結果を必ず得る。ci.md「特定 OS のみの skip で CI を通さない」）。
  # matrix.os の要素数だけ別名のチェックが生成されるため、branch protection の
  # 必須チェックへは OS 数分（3 件）を追加する必要がある。
  rust-ci:
    strategy:
      fail-fast: false
      # windows-latest の Servo 組込ビルド前提（Windows SDK・MSVC v143・C++ ATL・
      # Python/uv。XOS-6・TASK-56.1）は下記 windows-servo-prereqs ジョブが
      # 検証・導入する。本ジョブは Servo を含まないため追加セットアップ不要
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # 3 OS matrix。matrix.os をそのまま runner-label へ渡す
      # （public リポジトリの GitHub ホステッド runner 方針は維持）
      runner-label: ${{ matrix.os }}
      # make deny（Makefile の deny ターゲット）と同一のチェック集合。
      # licenses チェックは TASK-77・OSS-3（MS-1）対応（deny.toml の [licenses] 参照）
      deny-checks: advisories bans licenses sources
      # cargo レジストリ・target の cache（reusable 側のオプトイン入力。
      # `actions/cache`・key は `**/Cargo.lock` のハッシュに加え `runner.os` を
      # 含む形で reusable workflow 側が OS ごとに分離する）。ホステッド runner は
      # 毎回まっさらなため、無効のままだと fmt／clippy／test／deny の各ジョブが
      # 依存クレートを毎回フルビルドすることになる。cache-key-prefix は
      # 他リポジトリ（既定値 `rust-base-ci` や、CI 設定を輸入した際の残置物
      # `vector-db`）との衝突回避のため本リポ名にする（TASK-55.3・Issue #60）
      #
      # windows-latest のみ既定 false（Issue #59 レビュー指摘。PR #409 CI 失敗の
      # 実測: rust-base-ci.yml（Fandhe-AI/actions・@latest）の
      # 「workspace メンバー成果物を prune（cache 保存前・cache 有効時のみ）」
      # ステップが `cargo clippy`/`cargo test` 自体は成功しているにも関わらず、
      # windows-latest のみ ##[error]想定外の crate / target 名を検出したため
      # prune を中止します（名前: fandhe-browser-ai）で exit code 1 になり、
      # rust-ci (windows-latest) / rust-base-ci-complete を fail させていた
      # （ubuntu-latest・macos-latest では未再現。実行ログでは jq 側のエラー出力は
      # 見えず、cargo metadata の出力を読む `while IFS= read -r -d ''` ループの
      # 最初の 1 件目（sort -u で先頭になった fandhe-browser-ai）で即座に失敗して
      # おり、crate 名自体は `^[\p{L}\p{N}_-]+$` を満たす正当な値のため、
      # windows-latest（git-bash/MSYS）環境でこの prune スクリプトの
      # 名前検証ロジックが誤検出している可能性が高い）。原因は本リポではなく
      # 呼び出し先の reusable workflow（Fandhe-AI/actions）側にあり、本リポの
      # crate 構成・PR #409 の差分（ci.yml の cache-key-prefix 変更・render crate
      # 追加等）には起因しない。恒久修正は Fandhe-AI/actions 側の対応を要する
      # ため、それまでの回避策として windows-latest のみ cache を無効化する
      # （現時点は各 crate が雛形のみで依存もなく、cache 無効化によるビルド時間
      # 増加コストは小さい）。Fandhe-AI/actions 側で修正され次第この条件式は削除
      # してよい
      cache: ${{ matrix.os != 'windows-latest' }}
      cache-key-prefix: fandhe-browser

  # --------------------------------------------------
  # rust-ci-default-features（既定 feature でのローカルゲート再現）
  # --------------------------------------------------
  # 上記 rust-ci（reusable workflow）は `cargo clippy/test --all-features` で
  # 検証するため、既定 feature（`--all-features` なし）の構成は別途検証されない。
  # AGENTS.md「ローカルゲート」・.claude/rules/ci.md が要求する
  #   cargo clippy --workspace --all-targets -- -D warnings
  #   cargo test --workspace
  # （いずれも既定 feature）を、pull_request/push で自動起動する本 workflow 内で
  # 直接実行し、既定 feature 側の回帰も CI で検出できるようにする
  # （TASK-55.2・Issue #59 レビュー指摘。REPAIR-5・REPAIR-6）。
  # Makefile の `lint`/`test` ターゲット（既定 feature 用）と同一コマンドを実行する。
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1）に従い、rust-ci と同じ 3 OS matrix で
  # 実行する（既定 feature 構成の OS 依存回帰を --all-features 側だけでは検出できない
  # ため。PR #409 レビュー指摘）。
  #
  # clippy -D warnings ゲート（TASK-5.2・`REPAIR-6`）: 下記 `cargo clippy` ステップは
  # 3 OS すべてで同一コマンドを実行し、1 ステップ 1 コマンドのためステップの
  # 非ゼロ終了がそのままジョブ失敗になる。windows-latest の既定シェルは pwsh だが、
  # Actions が単一コマンドステップの末尾に付与する `exit $LASTEXITCODE` 相当の
  # 挙動により終了コードが伝播し、他 OS と同様に fail-closed で機能する
  # （`shell:` 明示指定は不要。誤って追加修正しないこと）。
  # TASK-7（#335・REPAIR-6）の「警告 0 件維持確認」の CI ゲートを兼ねる
  # （既定 feature 構成側。確認記録は #335 の PR 本文を参照）。
  rust-ci-default-features:
    strategy:
      fail-fast: false
      # windows-latest の Servo 組込ビルド前提（Windows SDK・MSVC v143・C++ ATL・
      # Python/uv。XOS-6・TASK-56.1）は下記 windows-servo-prereqs ジョブが
      # 検証・導入する。本ジョブは Servo を含まないため追加セットアップ不要
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブの無期限実行を防ぐ多層防御（NFR-10・.claude/rules/ci.md）。
    # 他の raw-step ジョブ（release.yml の verify 等）と同じ 30 分を採用する。
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy（既定 feature）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（既定 feature）
        run: cargo test --workspace
      # TASK-30.4（Issue #162・JS-2）: workspace 全体の検証では cli の
      # `default = ["js-v8"]` が feature 統合で core に伝わり、エンジンなし構成の
      # テスト（`cfg(not(any(feature = "js-v8", feature = "js-boa")))`）が
      # コンパイル対象から外れる。core を単独で選んでエンジンなし構成を検証する
      # （依存グラフ検査は js-engine-isolation ジョブ・TASK-32.4 が担い、
      # このテスト実行は含まない）
      - name: cargo clippy（core 単独・エンジンなし）
        run: cargo clippy -p fandhe-browser-core --all-targets -- -D warnings
      - name: cargo test（core 単独・エンジンなし）
        run: cargo test -p fandhe-browser-core
      # TASK-32.4（Issue #168・JS-1）: ビルド構成表の「両エンジン同梱」行。既定ビルドの
      # ジョブ内で共通テスト（js の conformance・core の js_stub_v8 / js_stub_boa）を
      # 両エンジン有効で追加実行する。rust-ci の --all-features は test-support・
      # rendering も同時に有効で表の構成そのものではないため明示的に実行する。
      # macOS では boa が無効（確保時のメモリ上限を強制できず fail-closed）で、
      # テストは cfg(target_os) で期待値を分けている（skip ではない）。
      # `--features` は Windows 既定の pwsh でカンマが配列解釈されるため 2 回書く。
      - name: cargo test（js 両エンジン同梱）
        run: cargo test -p fandhe-browser-js --features js-v8 --features js-boa
      - name: cargo test（core 両エンジン同梱）
        run: cargo test -p fandhe-browser-core --features js-v8 --features js-boa

  # --------------------------------------------------
  # rust-ci-js-v8（js crate を `--features js-v8` 単独で 3 OS 検証）
  # --------------------------------------------------
  # TASK-29.7（Issue #158・JS-1・MS-3）: TASK-28 共通コンフォーマンステスト
  # （crates/fandhe-browser-js/tests/conformance.rs）が V8 で合格することを CI で
  # 継続検証する。rust-ci（--all-features）・rust-ci-default-features（既定）では
  # 検証されない `--features js-v8` 単独構成を対象にする。この構成では js-boa・
  # test-support・rendering が無効で、`required-features = ["test-support"]` の
  # v8_worker テストと bench は対象外になる。
  # テスト出力に `case:` 行と `conformance: all cases passed` が出れば、V8 が
  # スクリプト評価・グローバル関数注入・DOM 風バインディングの 3 カテゴリに合格
  # している。`RUSTFLAGS=-D warnings` は Windows の既存リンカ警告（LNK4098）で
  # 落ちるため test には付けない（clippy はリンクしないため -D warnings 可）。
  rust-ci-js-v8:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy（js-v8 単独）
        run: cargo clippy -p fandhe-browser-js --all-targets --features js-v8 -- -D warnings
      - name: cargo test（js-v8 単独）
        run: cargo test -p fandhe-browser-js --features js-v8

  # --------------------------------------------------
  # rust-ci-js-boa（軽量ビルド `--no-default-features --features js-boa` を 3 OS 検証）
  # --------------------------------------------------
  # TASK-32.4（Issue #168・JS-1・MS-3）: ビルド構成表の「軽量ビルド」行。V8 を
  # 含めない構成で cli のビルド・テストと、js・core の boa 向け共通テスト
  # （conformance・boa_worker・js_stub_boa）を実行する。`--workspace` と
  # `--features` は併用せず、必ず `-p` で指定する。
  # macOS では boa が無効（確保時のメモリ上限を強制できず fail-closed）で、
  # テストは cfg(target_os) で期待値を分けている（skip による回避ではない）。
  # 末尾の `cargo check`（エンジンなし）は表の「エンジンなし: 3 OS で check」行。
  # `RUSTFLAGS=-D warnings` は Windows の既存リンカ警告（LNK4098）で落ちるため
  # test には付けない。release ビルドのサイズ実測は TASK-31 の範囲で対象外。
  rust-ci-js-boa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: cargo build（軽量ビルド）
        run: cargo build -p fandhe-browser-cli --no-default-features --features js-boa
      - name: cargo clippy（cli 軽量ビルド）
        run: cargo clippy -p fandhe-browser-cli --all-targets --no-default-features --features js-boa -- -D warnings
      - name: cargo test（cli 軽量ビルド）
        run: cargo test -p fandhe-browser-cli --no-default-features --features js-boa
      - name: cargo clippy（js js-boa）
        run: cargo clippy -p fandhe-browser-js --all-targets --features js-boa -- -D warnings
      - name: cargo test（js js-boa）
        run: cargo test -p fandhe-browser-js --features js-boa
      - name: cargo test（core js-boa）
        run: cargo test -p fandhe-browser-core --features js-boa
      - name: cargo check（cli エンジンなし）
        run: cargo check -p fandhe-browser-cli --no-default-features

  # --------------------------------------------------
  # render-isolation（既定ビルドの依存グラフに Servo 系クレートが混入していないことの検証）
  # --------------------------------------------------
  # TASK-34.1（Issue #465・RENDER-1・MS-1）: `make check-render-isolation` は
  # これまで CI から未実行のローカル専用ゲートだった。
  # 判定ロジックの正本 scripts/check-render-isolation.sh（Makefile と共有）を
  # ここで直接実行し、PR で Servo 系が既定ビルドの依存グラフへ混入したら
  # fail-closed で検出する。
  #
  # `cargo tree` は既定でホストのターゲットに絞って依存グラフを表示するため、
  # cfg(windows)/cfg(unix) の target 依存（windows-sys・rustix 等）はその OS の
  # ランナーでしか依存グラフに現れない。そのため compat-regression ジョブと同様に
  # 3 OS matrix（.claude/rules/ci.md・XOS-1）で実行し、shell: bash を明示する
  # （Windows 既定の pwsh ではなく git-bash で確実に動かすため）。
  #
  # fandhe-browser-cli crate は追加済み（TASK-41.5・#174）のため、cli 既定
  # feature 検査も実行される。cli の manifest が無い場合はスクリプトが NG にする
  # （fail-closed。REPAIR-5・#633）。
  #
  # self-test（合成データに対して NG を検出できることの証跡。compat-regression
  # ジョブの self-test と同じ趣旨。REPAIR-5・REPAIR-8）を本検査の前に実行し、
  # ゲートが無言で素通りしないことをログへ残す。
  #
  # cargo は依存解決のみを行い（ビルドしない）、cache は使わない。
  #
  # branch protection の必須チェックへ追加する場合は OS 数分
  # （`render-isolation (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`
  # の 3 件）を登録する必要がある（ユーザー作業。本変更の対象外）。
  render-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: 自己テスト（合成データによる Servo 系検出の証跡確認）
        run: bash scripts/check-render-isolation.sh --self-test
      - name: 既定ビルドの依存グラフ検査
        run: bash scripts/check-render-isolation.sh

  # --------------------------------------------------
  # js-engine-isolation（JS エンジン構成ごとの依存グラフ検査）
  # --------------------------------------------------
  # TASK-32.4（Issue #168・JS-1・MS-3）: 軽量ビルドの依存グラフに v8 が無く、
  # エンジンなしに v8・boa_engine が無いことを `cargo tree` で検証する。判定ロジックの
  # 正本は scripts/check-js-engine-isolation.sh（Makefile と共有）。`cargo tree` は
  # ホストのターゲットに絞るため target 依存は当該 OS でしか現れず、3 OS matrix で
  # 実行する。self-test を先に実行しゲートが素通りしないことをログへ残す。
  # cargo は依存解決のみ（ビルドしない）。
  js-engine-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: 自己テスト（合成データによる検出の証跡確認）
        run: bash scripts/check-js-engine-isolation.sh --self-test
      - name: JS エンジン構成の依存グラフ検査
        run: bash scripts/check-js-engine-isolation.sh

  # --------------------------------------------------
  # compat-regression（対象サイト群の動作率マトリクスに対する回帰チェック）
  # --------------------------------------------------
  # TASK-9.2（Issue #339・REPAIR-8。Could）: 対象サイト群の互換性回帰を機械的に
  # 検出する CI ゲート。閾値の根拠は COMPAT-4（全体動作率 70% 以上）・COMPAT-1
  # （静的・SPA・フォーム等の類型別動作率 70% 以上）。判定本体は
  # harness/compat-regression/check-matrix.sh（bash + jq。新規 Cargo 依存・新規
  # サードパーティ action は追加しない。dependency-policy.md）で、スキーマ契約・
  # 終了コードは harness/compat-regression/README.md を参照。
  #
  # self-test を毎回先に実行し、fixture（合成データ）に対して「閾値未満で fail
  # する」ことをこのジョブのログへ証跡として残してから、実マトリクスの判定へ進む
  # （REPAIR-5・REPAIR-8。品質ゲートが無言で素通りしないことの担保）。
  #
  # 実マトリクス harness/compat-practical/results/matrix.json は TASK-71.3
  # （Issue #312）が生成予定でまだ存在しないため、当面 --allow-missing を渡す
  # （ファイル不在時は ::warning:: を出して exit 0）。#312 がマトリクスをコミット
  # したら --allow-missing を削除し、ファイル不在を fail-closed（exit 2）に戻す
  # こと（harness/compat-regression/README.md にも同じ削除条件を明記）。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1）に合わせ ubuntu/macos/windows の
  # 3 OS matrix で実行する。全ステップ shell: bash を明示する（rust-ci-default-
  # features 上部コメントの「shell: 明示不要」は cargo 単一コマンドのステップに
  # のみ当てはまる注記であり、本ジョブの複数コマンド・jq を含むシェルスクリプト
  # 実行には当てはまらないため、Windows（既定 pwsh）でも git-bash で確実に動く
  # よう明示する）。cargo・ネットワークアクセス・secrets は使わない。
  #
  # branch protection の必須チェックへ追加する場合は OS 数分
  # （`compat-regression (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`
  # の 3 件）を登録する必要がある（ユーザー作業。本変更の対象外）。
  compat-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: jq の導入確認
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
      - name: 自己テスト（fixture による閾値未満 fail の証跡確認）
        run: bash harness/compat-regression/self-test.sh
      # TASK-71.1（#310・MEAS-4）: 実測ハーネス compat-practical の自己テストと
      # tasks.json のスキーマ検証。curl はスタブでネットワーク・secrets は使わない。
      - name: compat-practical 自己テスト・tasks.json スキーマ検証
        run: |
          bash harness/compat-practical/self-test.sh
          bash harness/compat-practical/access_check.sh --validate-only
      - name: 対象サイト群の動作率回帰チェック
        run: |
          bash harness/compat-regression/check-matrix.sh \
            --matrix harness/compat-practical/results/matrix.json \
            --threshold 70 \
            --categories static,spa,form \
            --all-categories \
            --allow-missing

  # --------------------------------------------------
  # bench-record-selftest（competitor_lightpanda ベンチ記録スクリプトの自己テスト）
  # --------------------------------------------------
  # TASK-84.2（Issue #212）: competitor_lightpanda ベンチ（TASK-84.1・#211）の
  # 結果を時系列で記録する record.sh（benches/competitor_lightpanda/record.sh）
  # の自己テスト（self-test.sh）を実行する。合成 fixture（record-fixtures/）に
  # 対して `--input` 経由で実行するため cargo を使わず高速に回せる
  # （benches/competitor_lightpanda/README.md 参照）。
  #
  # 本ジョブは record.sh 自体（引数検証・JSONL 追記ロジック・終了コード伝播）
  # の回帰検出が目的で、実際のベンチ実行・実測値の記録（bench-competitor.yml が
  # 別途 workflow_dispatch・毎週の定期実行で担う）とは分離する。
  #
  # 3 OS 一級対応（.claude/rules/ci.md・XOS-1）に合わせ 3 OS matrix で実行する。
  # compat-regression ジョブと同じ理由で shell: bash を明示する。
  #
  # branch protection の必須チェックへ追加する場合は OS 数分
  # （`bench-record-selftest (ubuntu-latest)` / `(macos-latest)` /
  # `(windows-latest)` の 3 件）を登録する必要がある（ユーザー作業）。
  bench-record-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: jq の導入確認
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
      - name: record.sh 自己テスト
        run: bash benches/competitor_lightpanda/self-test.sh

  # --------------------------------------------------
  # deny-license-reject（cargo-deny の許可外ライセンス reject negative test）
  # --------------------------------------------------
  # TASK-9.1（#338・REPAIR-8）: 受入基準 2（許可外ライセンスが混入したら fail
  # することをログで示す）の証跡ジョブ。受入基準 1 の本体（実依存グラフに対する
  # `cargo deny check licenses` の実行）は上記 rust-ci ジョブ（TASK-77・#64・
  # `deny-checks: advisories bans licenses sources`）が 3 OS で担っており、
  # 本ジョブは重ねて追加しない。ここでは `make check-deny-license-reject`
  # （依存ゼロの canary crate へ本リポの deny.toml を当てる negative test。
  # Makefile 側のコメント参照）を実行し、GPL/AGPL/LGPL/MPL-2.0・ライセンス欄なし
  # の canary がいずれも `error[rejected]`/`error[unlicensed]` で reject され、
  # 陽性対照（`MIT OR Apache-2.0`）は通ることをログに残す（fail-closed 性の
  # 継続的な証跡）。
  #
  # ubuntu-latest 単独にする理由: このジョブが検証するのは deny.toml の
  # ライセンス評価という設定意味論であり、OS 差異に依存しない
  # （実依存グラフに対する `cargo deny check` 本体はすでに rust-ci の 3 OS
  # matrix で走っている。lint-docs も同様の理由で ubuntu-latest 単独）。
  # 「特定 OS のみ skip して CI を通す」（ci.md）には当たらない。
  #
  # cargo-deny の導入は `make check-deny-license-reject`（Makefile の
  # `CARGO_DENY_VERSION` を単一の版管理箇所とする）に委ねるため、本ジョブでは
  # 新たに `cargo-deny` 専用の action は追加しない。
  deny-license-reject:
    runs-on: ubuntu-latest
    # ハングしたジョブの無期限実行を防ぐ多層防御（NFR-10・.claude/rules/ci.md）
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: make check-deny-license-reject
        run: make check-deny-license-reject

  # --------------------------------------------------
  # windows-servo-prereqs（Servo 組込 Windows ビルドの前提検証）
  # --------------------------------------------------
  # TASK-56.1（#195・XOS-6・MS-3）: Servo を組み込む Windows ビルドは Windows SDK
  # 10.0.19041.0 以上・MSVC v143 ツールセット・C++ ATL（v143 向け）・Python と uv を
  # 必要とする。本ジョブはそれらが windows-latest で揃うことを fail-closed で検証し、
  # 不足するもの（v143 向け ATL・uv）だけ導入する。
  #
  # 別ジョブにした理由: rust-ci は reusable workflow 呼び出しのためステップを足せず、
  # rust-ci-default-features は Servo を使わないため、前提の不備で既定 feature
  # ゲートが落ちる（単一責務に反する）のを避ける。将来の Windows rendering ビルド
  # ジョブ（TASK-58 等）は本ジョブのステップ群を統合・再利用する。
  #
  # runner の実態（runner-images 公開 README・2026-09 時点）: windows-latest は
  # VS 2026（既定ツールセット v145）。Windows SDK 10.0.26100.0・v143 系ツールセット
  # （MSVC 14.44）・Python 3 は導入済みで検証のみ。v143 向け ATL は未導入の可能性が
  # あるため、無い場合のみ VS Installer で追加する。uv は未導入のためバージョンと
  # sha256 を固定して pip で導入する（iwr | iex や新規サードパーティ action は使わない）。
  #
  # pwsh は末尾でしか $LASTEXITCODE を検査しないため、ネイティブコマンドごとに
  # 明示判定する（rust-ci-default-features 上部の「shell: 明示不要」注記は cargo
  # 単一コマンドのステップにのみ当てはまる）。checkout・secrets は不要。
  #
  # branch protection の必須チェックへ `windows-servo-prereqs` を追加する場合は
  # ユーザー作業（本変更の対象外）。
  windows-servo-prereqs:
    runs-on: windows-latest
    # VS Installer の modify に時間がかかりうるため 30 分。ハング防止（NFR-10）
    timeout-minutes: 30
    # checkout も GitHub API も使わないため権限は不要（最小権限）
    permissions: {}
    defaults:
      run:
        shell: pwsh
    env:
      # Servo の Windows 前提の下限（XOS-6）
      MIN_WINDOWS_SDK: "10.0.19041.0"
      # v143 向け C++ ATL の VS コンポーネント ID（VS 2026 の 14.44 サイドバイサイド）
      ATL_V143_COMPONENT: Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL
      # uv は完全固定（win_amd64 wheel の sha256 で完全性を検証）
      UV_VERSION: "0.12.20"
      UV_WHEEL_SHA256: 1502e03f4da3280cbb493d356d59bdd401bf23197cd71df64e1c6feac156090c
    steps:
      - name: Windows SDK の検証
        run: |
          $min = [version]$env:MIN_WINDOWS_SDK
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $found = @()
          if (Test-Path $root) {
            $found = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Name } |
              Where-Object { $_ -ge $min } | Sort-Object -Descending
          }
          if ($found.Count -eq 0) {
            Write-Host "::error::Windows SDK >= $min not found under $root"
            exit 1
          }
          Write-Host "Windows SDK: $($found[0])"
      - name: VS と MSVC v143 ツールセットの検証
        run: |
          $vsInstaller = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $vsInstaller 'vswhere.exe'
          $installPath = & $vswhere -products * -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installPath)) {
            Write-Host "::error::Visual Studio with the MSVC toolset not found"
            exit 1
          }
          $installPath = $installPath.Trim()
          $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
          # v143 のうち ATL 導入対象（ATL_V143_COMPONENT）と対になる 14.44 系のみを
          # 検証対象にする（ATL は 14.44 固定のため、別版を選ぶと atlbase.h が見つからない）
          $v143 = @()
          if (Test-Path $msvcRoot) {
            $v143 = Get-ChildItem $msvcRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Where-Object { [version]$_.Name -ge [version]'14.44' } |
              Where-Object { [version]$_.Name -lt [version]'14.45' } |
              Sort-Object { [version]$_.Name } -Descending
          }
          if ($v143.Count -eq 0) {
            Write-Host "::error::MSVC v143 toolset 14.44 (paired with the ATL component) not found under $msvcRoot"
            exit 1
          }
          Write-Host "VS: $installPath"
          Write-Host "MSVC v143 toolset: $($v143[0].Name)"
          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSVC_V143_DIR=$($v143[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: v143 向け C++ ATL の検証（無ければ導入）
        run: |
          $header = Join-Path $env:MSVC_V143_DIR 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            Write-Host "ATL for v143 not found; installing $env:ATL_V143_COMPONENT"
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$env:VS_INSTALL_PATH`"",
              '--add', $env:ATL_V143_COMPONENT,
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Write-Host "::error::VS Installer failed with exit code $($p.ExitCode)"
              exit 1
            }
          }
          if (-not (Test-Path $header)) {
            Write-Host "::error::C++ ATL for v143 (atlbase.h) not found under $env:MSVC_V143_DIR"
            exit 1
          }
          Write-Host "C++ ATL for v143: $header"
      - name: Python の検証
        run: |
          $out = python --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^Python 3\.') {
            Write-Host "::error::Python 3.x not found (got: $out)"
            exit 1
          }
          Write-Host $out
      - name: uv の導入（バージョン・ハッシュ固定）
        run: |
          # 導入済みの uv があっても sha256 検証を必ず通すため、まず wheel を
          # 明示取得（--require-hashes で検証）し、その wheel を強制再導入する
          $work = Join-Path $env:RUNNER_TEMP 'uv-wheel'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $req = Join-Path $work 'uv-requirements.txt'
          "uv==$env:UV_VERSION --hash=sha256:$env:UV_WHEEL_SHA256" | Out-File -FilePath $req -Encoding ascii
          python -m pip download --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps -d $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::hash-verified download of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          python -m pip install --disable-pip-version-check --no-cache-dir `
            --require-hashes --only-binary=:all: --no-deps --force-reinstall `
            --no-index --find-links $work -r $req
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install of pinned uv failed"
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          # 出力は "uv 0.12.20 (<hash> <date> <target>)" 形式のため前方一致で比較する
          $ver = python -m uv --version
          if ($LASTEXITCODE -ne 0 -or $ver -notlike "uv $env:UV_VERSION *") {
            Write-Host "::error::unexpected uv version: $ver"
            exit 1
          }
          Write-Host $ver

  # --------------------------------------------------
  # binary-size（feature 無効時のリリースバイナリサイズ検査を CI へ組込み）
  # --------------------------------------------------
  # TASK-34.3（#467・RENDER-2。基準は CORE-2 と同じ「Chromium 比 80% 以上
  # 削減」）。判定本体は harness/binary-size/（TASK-34.2・#466 で導入。契約は
  # 同ディレクトリの README.md を参照）。
  #
  # self-test を先に実行する理由: 上限超過時に確実に exit 1 になることの証跡を
  # 毎回ジョブログへ残すため（compat-regression・deny-license-reject と同じ
  # fail-closed 性の考え方。REPAIR-5・REPAIR-8）。
  #
  # 対象 package（fandhe-browser-cli。TASK-41.5・#174 で追加済み）が workspace
  # に無い場合は exit 2 で fail-closed になる（harness/binary-size/README.md
  # 「計測対象と fail-closed 契約」参照。REPAIR-5・#633）。
  #
  # make を使わない理由: windows-latest に make がある保証がなく、既存の
  # 3 OS ジョブ（compat-regression・bench-record-selftest）はどれもスクリプト
  # を直接呼んでいる（make を使う deny-license-reject は ubuntu 単独ジョブ）。
  # cache を使わない理由: windows-latest には cache prune の既知問題がある
  # （rust-ci ジョブのコメント参照）。ビルド時間増加への cache 導入は別途検討する。
  #
  # 上限値・package 名は Makefile の BINARY_SIZE_LIMIT_BYTES /
  # BINARY_SIZE_PACKAGE を単一真実源とし、ここでは値を重複定義しない
  # （行頭固定の正規表現で 1 件だけ抽出する。0 件・2 件以上は fail-closed）。
  #
  # branch protection の必須チェックに加える場合は OS 数分
  # （`binary-size (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`
  # の 3 件）を登録する必要がある（ユーザー作業。本変更の対象外）。
  binary-size:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # リリースビルドが走るため rust-ci-default-features と同値にする
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # stable（rust-toolchain.toml の channel = "stable" を単一真実源として追従）。
      # self-test の package モードのケースに cargo、スクリプト本体に rustc -vV が必要
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: jq の導入確認
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "error: jq is required but was not found on PATH" >&2
            exit 1
          fi
      - name: Makefile から上限値・package 名を抽出
        id: config
        run: |
          # Windows（git-bash）の CRLF を落としてから行頭固定の正規表現で照合する。
          # 0 件（書式変更・削除）・2 件以上（曖昧）はいずれも fail-closed にする。
          normalized="$(tr -d '\r' < Makefile)"
          limit_re='^BINARY_SIZE_LIMIT_BYTES \?= ([0-9]{1,15})$'
          package_re='^BINARY_SIZE_PACKAGE \?= ([A-Za-z0-9._-]{1,64})$'
          limit_matches="$(printf '%s\n' "$normalized" | grep -cE "$limit_re" || true)"
          package_matches="$(printf '%s\n' "$normalized" | grep -cE "$package_re" || true)"
          if [ "$limit_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_LIMIT_BYTES not found exactly once in Makefile (found: $limit_matches)" >&2
            exit 1
          fi
          if [ "$package_matches" -ne 1 ]; then
            echo "::error::BINARY_SIZE_PACKAGE not found exactly once in Makefile (found: $package_matches)" >&2
            exit 1
          fi
          limit="$(printf '%s\n' "$normalized" | sed -nE "s/$limit_re/\\1/p")"
          package="$(printf '%s\n' "$normalized" | sed -nE "s/$package_re/\\1/p")"
          echo "limit_bytes=$limit" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: 自己テスト（fixture による上限超過 fail の証跡確認）
        run: bash harness/binary-size/self-test.sh
      - name: feature 無効時のリリースバイナリサイズ検査
        env:
          BINARY_SIZE_LIMIT_BYTES: ${{ steps.config.outputs.limit_bytes }}
          BINARY_SIZE_PACKAGE: ${{ steps.config.outputs.package }}
        run: |
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          status=0
          bash harness/binary-size/check-binary-size.sh \
            --package "$BINARY_SIZE_PACKAGE" \
            --limit "$BINARY_SIZE_LIMIT_BYTES" | tee "$out" || status=$?
          {
            echo "### Binary size ($RUNNER_OS)"
            echo
            if grep -q '^binary-size:' "$out"; then
              echo "| host | package | bin | bytes | limit | result |"
              echo "| ---- | ------- | --- | ----- | ----- | ------ |"
              grep '^binary-size:' "$out" | while IFS= read -r line; do
                host="$(printf '%s\n' "$line" | sed -nE 's/.*host=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                package="$(printf '%s\n' "$line" | sed -nE 's/.*package=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bin="$(printf '%s\n' "$line" | sed -nE 's/.*bin=([A-Za-z0-9._-]{1,64}).*/\1/p')"
                bytes="$(printf '%s\n' "$line" | sed -nE 's/.*bytes=([0-9]{1,20}).*/\1/p')"
                limit="$(printf '%s\n' "$line" | sed -nE 's/.*limit=([0-9]{1,20}).*/\1/p')"
                result="$(printf '%s\n' "$line" | sed -nE 's/.*result=(pass|fail).*/\1/p')"
                echo "| $host | $package | $bin | $bytes | $limit | $result |"
              done
            else
              echo "(no binary-size output was produced; check-binary-size.sh exited with a usage/build error)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
