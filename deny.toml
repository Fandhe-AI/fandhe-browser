# cargo-deny 設定。`make deny` が本ファイルと Cargo.toml の両方が存在する時点で
# 自動有効化され、`cargo deny --locked check advisories bans licenses sources` として
# 実行される（実装未着手のため現時点では Makefile 側の HAS_CARGO 判定でスキップされる。
# workspace 作成後に有効化）。
# 依存方針（.claude/rules/dependency-policy.md）: 依存最小・`=x.y.z` 完全固定・
# 追加はユーザー承認制。Fandhe-AI/rust-ai-library の deny.toml と同一方針。

[graph]
# feature gate 配下の optional 依存（`rendering` feature の Servo 等。RENDER-1・
# licensing.md）を既定 feature 集合のみの監査対象から漏らさないため、optional
# 依存を含む全 feature を監査対象にする（fail-closed）。これにより Servo（MPL-2.0）
# 追加時は [licenses] の allow に無い MPL-2.0 が検出され、`[licenses.exceptions]`
# で明示許可するまで `make deny` が意図通り fail する。
all-features = true
# TASK-24.2（Issue #36・ビヘイビア CORE-1）の `fetch` 実装で追加した
# `rustls-platform-verifier`（reqwest の推移依存）は、wasm32 ターゲット限定で
# `webpki-root-certs`（CDLA-Permissive-2.0）に依存する。本リポは 3 OS
# （Linux・macOS・Windows）一級対応が方針であり wasm32 を対象にしないため
# （ci.md「3 OS CI」・README「3 OS 一級対応」）、評価対象ターゲットを
# ネイティブ 3 OS の x86_64/aarch64 組み合わせに限定し、到達不能な wasm32 限定
# 依存を監査対象から外す。これは評価範囲を実際にビルドし得るターゲットへ限定
# するものであり、CDLA-Permissive-2.0 を新たに許可するものではない
# （[licenses] の allow には追加しない。許可判断はライセンス判断のため
# licensing.md に従いユーザーへ報告する）。
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
# RUSTSEC アドバイザリ監査（vulnerability / unmaintained / unsound / yanked）。
# ignore へアドバイザリ ID を追加する場合は、理由・解消予定（追跡 Issue 番号）を
# コメント付きで記録し、レビューを必須とする。
version = 2
ignore = [
]

[licenses]
version = 2
include-dev = true
# TASK-77・OSS-3（MS-1）対応: `cargo deny check licenses` による許可外ライセンス
# （GPL/LGPL/AGPL 系・未許可 MPL-2.0 混入等）の fail-closed 検出
# （`.github/workflows/ci.yml` の `rust-ci` ジョブから呼び出す）。
# 本リポは MIT OR Apache-2.0 のデュアルライセンス。依存もこれと互換な permissive
# ライセンスのみ許可する。allow には互換 permissive の代表集合（rust-ai-library の
# Cargo.lock 全域実測で出現した SPDX 識別子集合と同一）を事前許可しておき、推移的依存が
# BSD/ISC 等の一般的な permissive を持つだけで make deny が不要に失敗しないようにする。
# ここに無い識別子の追加は依存追加のユーザー承認
# （dependency-policy.md）とセットで行い、コピーレフト（GPL/LGPL/MPL 等）は列挙しない
# ことで fail-closed に検出する。
#
# MPL-2.0（Servo）は fandhe-browser-render crate 配下に限定する方針
# （licensing.md・RENDER-1）のため、ここには追加しない。render crate 導入時に
# `[licenses.exceptions]` で Servo 系 crate のみに個別許可する。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]
# allow・[licenses.exceptions] へ識別子を追加する際は、SPDX 識別子の機械判定だけに
# 頼らず、対象クレートのライセンス文言（LICENSE ファイル・Cargo.toml license 欄）を
# 目視確認してから追加する。
confidence-threshold = 0.8

[sources]
# git 依存・代替レジストリの混入をサプライチェーン観点で fail-closed 検出する
# （全依存は crates.io 由来のみを許可）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 同一クレートの複数バージョン混入の検出。`=x.y.z` 完全固定方針では重複は原則
# 発生しない前提だが、推移的依存経由の重複は依存元側の追随を待つほかなく "deny" では
# ノイズが上回るため、警告に留めて CI ログで増加傾向を観測する（rust-ai-library と同一判断）。
multiple-versions = "warn"

# バージョン要求 `*` の依存宣言を拒否する（バージョン無指定はサプライチェーン上
# 任意の最新版を受け入れる宣言であり、`=x.y.z` 完全固定方針に反するため fail-closed で弾く）。
wildcards = "deny"
# workspace 内クレート（core / js / ai / cdp / render / profile / cli / mcp）は
# `publish = false` の private クレートで、相互参照はバージョン無しの path 依存
# （cargo 上は `*` 扱い）のため、private クレートの path 依存に限り wildcards の
# 対象外とする。
allow-wildcard-paths = true
