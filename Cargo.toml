# fandhe-browser の workspace ルート manifest。
#
# REPAIR-1（TASK-1・TASK-1（1.1）・MS-1）: fandhe-browser を
# `-core`/`-js`/`-render`/`-cdp`/`-ai`/`-profile`/`-cli`/`-mcp` の 8 crate に
# 分割する Cargo workspace 化の第一歩として、このルート manifest だけを作成する
# （各 crate 本体は TASK-1.2〜1.7 が個別に `crates/fandhe-browser-*/Cargo.toml`
# として追加する）。

[workspace]
resolver = "3"
# `crates/*` へのグロブ採用。TASK-1（1.3）が「最初に merge される crate 追加
# PR がこの行を空配列から `["crates/*"]` へ書き換える」契約（当時のコメント）
# に従い、`fandhe-browser-js` 追加でこの行を書き換えた（空配列時点では glob が
# 1 件も解決せず `cargo metadata` 等がエラーになるため使えなかった）。root 側を
# 固定メンバー列挙にすると、並列実装される後続タスク（各 crate 追加。
# `fandhe-browser-ai`（TASK-1・旧 TASK-1.5・Issue #26）を含む）がすべて本ファイルの
# 同じ行を編集する必要が生じ、並列 PR 間でコンフリクトを誘発するため、
# グロブ表記を採用する。以降の `crates/` 配下の crate 追加 PR は本ファイルの変更を
# 伴わない。
# 例外: `harness/` 配下のツール crate（`harness/wpt_subset_runner`。PLUG-10・
# TASK-101.2.1・#553）は他の harness ディレクトリが Cargo.toml を持たず
# `harness/*` グロブが使えないため、明示パスで列挙する。
# `make check-workspace-manifest`（`make ci` に含む）が `cargo verify-project`
# で常時この manifest の妥当性を検証する。
members = ["crates/*", "harness/wpt_subset_runner"]

[workspace.package]
# 各 crate 側は `version.workspace = true` 等（`edition`/`license` も同様）で
# ここから継承する契約とする（TASK-1.2〜1.7 向けの申し送り）。
#
# `publish` は Cargo の仕様上、他フィールドと異なり member crate が
# `publish.workspace = true` を明示しない限り自動継承されない（省略した crate は
# Cargo の既定値 `publish = true` になり公開可能な状態になってしまう）。
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate はすべて
# `publish = false` の private crate」という前提に立っているため、**新規 crate を
# 追加する各 TASK（1.2〜1.7 等）は自身の `Cargo.toml` に必ず
# `publish.workspace = true`（または直接 `publish = false`）を明記する**契約とし、
# `make check-publish-private`（`make ci` に含む）で全 member crate に対して機械的に検証する。
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate は
# `publish = false` の private crate」という前提に立っているため、ここで明示する。
publish = false

# TASK-33（33.1）・RENDER-1・MS-1: `fandhe-browser-render`（Servo・MPL-2.0）を
# feature gate `rendering` 経由の optional 依存として持つのは唯一
# `fandhe-browser-cli`（`optional = true` + `rendering = ["dep:fandhe-browser-render"]`）
# の想定（PoC-6 `docs/spec/03-poc/rendering-layer-servo/two-layer-workspace/` 準拠）。
# ここでは cli 側から `{ workspace = true }` で参照できるよう path 参照のみを
# 登録し、cli crate が `optional = true` で参照する（TASK-33.4・Issue #459）。
# 外部（registry）クレートの追加・更新は本エントリと異なり、
# dependency-policy.md のユーザー承認制（`=x.y.z` 完全固定）に従う。
[workspace.dependencies]
fandhe-browser-render = { path = "crates/fandhe-browser-render" }

# TASK-14.2（Issue #93・AISNAP-1）: 生 HTML のトークン量（cl100k_base）計測用。
# 採否・バージョンは Issue #92 に記録済み。ライセンスは MIT。配置は
# fandhe-browser-ai の [dev-dependencies] のみ（配布バイナリに含めない）。
# BPE データは crate 同梱でネットワーク取得はない。
tiktoken-rs = { version = "=0.12.1" }

# fandhe-browser-profile（TASK-50（50.1）・ビヘイビア PROF-1）: unix でディレクトリ
# ハンドル（fd）基準の openat/mkdirat/fchmod を使い、パス文字列の再解決に伴う
# TOCTOU（symlink 差し替え競合。PR #437 レビュー指摘）を解消するために使う。
# ユーザー承認済み（2026-09-26）。Windows 側では使わない（unix 限定の
# target dependency として crate 側へ登録する）。
# `process` feature は TASK-29（Issue #503・JS-1）で追加した（ユーザー承認
# 2026-09-28）。JS ワーカーの子プロセスが自身に RLIMIT_DATA を設定し、V8 ヒープ外
# メモリ（ArrayBuffer の backing store 等）にも OS 側の上限を掛けるために使う
# （`rustix::process::setrlimit` は safe API のため unsafe を追加しない）。
rustix = { version = "=1.1.5", default-features = false, features = [
  "fs",
  "process",
  "std",
] }

# TASK-24.2（Issue #36・ビヘイビア CORE-1）: fetch モジュールの HTTP クライアント。
# Issue #35（TASK-24.hdep）で採用承認済み（2026-09-25）。crypto provider は
# aws-lc-rs（cmake・NASM を要し musl でも問題がある）を避け、ring を明示 install
# する方針のため rustls は provider 未同梱の `rustls-no-provider` で導入する。
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
# `fandhe-browser-core::fetch` が `rustls::crypto::ring::default_provider()` を
# 1 回だけ install するために直接依存する（reqwest 自体は provider を同梱しない
# ため、ここで ring feature を有効にした rustls を明示的に引き込む）。
rustls = { version = "=0.23.45", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# `reqwest`（hyper 経由）は既に tokio へ通常の推移依存として依存しており、
# ここでの直接依存は `fandhe-browser-core` の dev-dependencies のみ（結合
# テスト `tests/fetch.rs` が `#[tokio::test]` を使うため）。`Fetcher::get`
# 自体はランタイムを内蔵せず async fn として提供するが、呼び出し元（cdp・
# CLI 等）は tokio ランタイム上で await する契約とする（reqwest/hyper が
# tokio 前提のため。呼び出し元がランタイムを保有する）。
tokio = { version = "=1.53.1", default-features = false, features = [
  "rt",
  "macros",
] }

# TASK-29（29.1）・JS-1・MS-3: 既定 JS エンジン V8（rusty_v8 = crates.io の
# `v8` crate）。Issue #151（TASK-29.hdep）でユーザー承認済み（2026-09-25）。
# ライセンス MIT（crate 自体）。prebuilt static lib に内包される V8
# 本体（BSD-3-Clause）・libc++（Apache-2.0 WITH LLVM-exception）・
# ICU（Unicode-3.0）は permissive だが cargo-deny の対象外のため、帰属表示は
# TASK-76（NOTICE）で扱う。既定では build.rs が GitHub Releases から
# prebuilt（denoland/rusty_v8）をダウンロードしてリンクする方式で、
# ソースビルドは行わない（bindgen/libclang 不要）。既定 feature
# `use_custom_libcxx` は明示的に維持する（外すと libstdc++ への動的リンクに
# 切り替わり、3 OS 一級対応（ci.md）の前提が崩れるため）。
# 使用箇所は `fandhe-browser-js`（feature `js-v8`）のみで、既定ビルド
# （`js-v8` 無効）の依存グラフには含まれない（`cargo tree` で確認。RENDER-1
# の Servo 隔離と同様の考え方）。
v8 = { version = "=152.2.0" }

# TASK-32（32.1）・JS-1・MS-3: 軽量 JS エンジン boa（`boa_engine` crate）。
# Issue #164（TASK-32.hdep）でユーザー承認済み（2026-09-25）。
# ライセンスは Unlicense OR MIT（licensing.md の許可範囲内）。純 Rust で
# C/C++ ビルドを要さず、3 OS ともネイティブビルド不要。
# feature は既定（`float16`・`xsum`・`temporal`）のまま使い、`intl` 系は有効化しない。
# 使用箇所は `fandhe-browser-js`（feature `js-boa`）のみで、既定ビルド
# （`js-boa` 無効）の依存グラフには含まれない（RENDER-1 と同じ隔離の考え方）。
boa_engine = { version = "=0.22.0" }

# TASK-29（Issue #503・JS-1）: Windows で JS ワーカーの子プロセスに OS 強制の
# コミットメモリ上限（Job Object の ProcessMemoryLimit）を掛け、親側で子の
# コミット量（PrivateUsage）を取得するために Win32 API を直接呼ぶ。win32job の
# safe API では ProcessMemoryLimit を設定できないため（ExtendedLimitInfo の内部が
# pub(crate)）。unsafe はこの Win32 呼び出しに限定する（ユーザー承認 2026-09-28）。
# 既に推移依存として Cargo.lock にある 0.61.2 を直接固定する。
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

# TASK-91（91.1）・Issue #214: `fandhe-browser.toml` の設定読み込み基盤
# （`fandhe-browser-core::config`）が使う TOML パーサーと (de)serialize 基盤。
# Issue #213（TASK-91.hdep）でユーザー承認済み（2026-09-25）。配置は
# `fandhe-browser-core` のみ（config.rs の doc コメント参照。他 crate から
# `toml`/`serde` を直接使わない）。ライセンスはいずれも MIT OR Apache-2.0。
# `derive` feature は `RawConfig`/`RawProfile`（config.rs 内の非公開型）の
# `#[derive(Deserialize)]` に使う。`toml` は既定 feature（`std`・`serde`・
# `parse`・`display`）のまま使う（#213 の推移依存記録が既定 feature 前提の
# ため、feature を絞らない）。推移的依存: `serde_core`・`serde_spanned`・
# `toml_datetime`・`toml_parser`・`winnow`・`toml_writer`、ビルド時のみ
# `syn`/`quote`/`proc-macro2`（serde_derive）。`serde_json` は #213 の承認
# 範囲外のため追加しない。
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.6" }
# Cargo はバージョン要件の build metadata（`+spec-1.1.0`）を無視するため、
# 上記の `=1.1.6` は #213 で承認された `toml = "=1.1.6+spec-1.1.0"` と
# 同一クレート（`toml-1.1.6+spec-1.1.0`）に解決される。

# TASK-41.3（Issue #172・CDP-1・MS-3）: cdp crate の HTTP ルータ（`/json/*`）と
# JSON 応答の生成に使う。`fandhe-backend-http`・`fandhe-backend-routes` は Issue #171
# でユーザー承認済み（2026-09-29 に 0.4.2 へ更新）、`serde_json` は Issue #419 で
# 承認済み。ライセンスはいずれも MIT OR Apache-2.0。配置は `fandhe-browser-cdp` のみ。
# TASK-41.4（Issue #173・CDP-1・MS-3）: `fandhe-backend-core`（feature `websocket`）を
# `/devtools/browser/{id}` の WS 受け口（`WebSocketConfig`・`WsMessageHandler`）に使う。
# Issue #171 で 0.4.2 の採用が承認済み。ライセンスは MIT OR Apache-2.0。配置は
# `fandhe-browser-cdp`（通常依存）と `fandhe-browser-cli`（TASK-41.5・#616。
# `fandhe-backend-core`・`fandhe-backend-routes` は通常依存、`fandhe-backend-http` は dev 依存）。推移依存は
# tokio-tungstenite（handshake のみ）・sha1・futures-util で、C/C++ ビルドは不要。
fandhe-backend-core = { version = "=0.4.2", features = ["websocket"] }
fandhe-backend-http = { version = "=0.4.2" }
fandhe-backend-routes = { version = "=0.4.2" }
serde_json = { version = "=1.0.151" }

[profile.release]
# release ビルドは panic 発生時に unwind せず即座に中断する前提
# （coding-rust.md「release は panic = "abort" 前提のため catch_unwind に頼らない」）。
# 仮想 manifest のルートにしか置けない設定のため、workspace 作成時に確定させる。
panic = "abort"

# boa（`fandhe-browser-js` の `js-boa`。TASK-32.2・Issue #166）の debug ビルド最適化。
# boa の `ArrayBuffer` 確保は 0 埋め（`resize`）を含み、最適化なしだとバイト単位の
# ループになって遅い。`tests/boa_worker.rs` のメモリ上限ケースが、遅い CI ランナー
# でも親の評価期限（4 秒）内に RSS 監視のしきい値へ到達できるよう、boa だけ
# opt-level を上げる（他の crate・release は変えない。依存の追加・更新ではない）。
[profile.dev.package.boa_engine]
opt-level = 2
