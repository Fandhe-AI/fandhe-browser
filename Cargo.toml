# fandhe-browser の workspace ルート manifest。
#
# REPAIR-1（TASK-1・TASK-1（1.1）・MS-1）: fandhe-browser を
# `-core`/`-js`/`-render`/`-cdp`/`-ai`/`-profile`/`-cli`/`-mcp` の 8 crate に
# 分割する Cargo workspace 化の第一歩として、このルート manifest だけを作成する
# （各 crate 本体は TASK-1.2〜1.7 が個別に `crates/fandhe-browser-*/Cargo.toml`
# として追加する）。

[workspace]
resolver = "3"
# `crates/*` へのグロブ採用。TASK-1（1.3）が「最初に merge される crate 追加
# PR がこの行を空配列から `["crates/*"]` へ書き換える」契約（当時のコメント）
# に従い、`fandhe-browser-js` 追加でこの行を書き換えた（空配列時点では glob が
# 1 件も解決せず `cargo metadata` 等がエラーになるため使えなかった）。root 側を
# 固定メンバー列挙にすると、並列実装される後続タスク（各 crate 追加。
# `fandhe-browser-ai`（TASK-1・旧 TASK-1.5・Issue #26）を含む）がすべて本ファイルの
# 同じ行を編集する必要が生じ、並列 PR 間でコンフリクトを誘発するため、
# グロブ表記を採用する。以降の crate 追加 PR は本ファイルの変更を伴わない。
# `make check-workspace-manifest`（`make ci` に含む）が `cargo verify-project`
# で常時この manifest の妥当性を検証する。
members = ["crates/*"]

[workspace.package]
# 各 crate 側は `version.workspace = true` 等（`edition`/`license` も同様）で
# ここから継承する契約とする（TASK-1.2〜1.7 向けの申し送り）。
#
# `publish` は Cargo の仕様上、他フィールドと異なり member crate が
# `publish.workspace = true` を明示しない限り自動継承されない（省略した crate は
# Cargo の既定値 `publish = true` になり公開可能な状態になってしまう）。
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate はすべて
# `publish = false` の private crate」という前提に立っているため、**新規 crate を
# 追加する各 TASK（1.2〜1.7 等）は自身の `Cargo.toml` に必ず
# `publish.workspace = true`（または直接 `publish = false`）を明記する**契約とし、
# `make check-publish-private`（`make ci` に含む）で全 member crate に対して機械的に検証する。
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate は
# `publish = false` の private crate」という前提に立っているため、ここで明示する。
publish = false

# TASK-33（33.1）・RENDER-1・MS-1: `fandhe-browser-render`（Servo・MPL-2.0）を
# feature gate `rendering` 経由の optional 依存として持つのは唯一
# `fandhe-browser-cli`（`optional = true` + `rendering = ["dep:fandhe-browser-render"]`）
# の想定（PoC-6 `docs/spec/03-poc/rendering-layer-servo/two-layer-workspace/` 準拠）。
# ここでは cli 側から `{ workspace = true }` で参照できるよう path 参照のみを
# 登録する。cli crate（TASK-41.5・Issue #174）が未作成のため、現時点ではどの
# member crate もこのエントリを参照していない（既定ビルドの依存グラフへは無影響な
# 準備変更）。cli crate 追加後、その `Cargo.toml` 側で optional 依存・feature 定義を
# 行う（本ファイルの変更は不要）。
# 外部（registry）クレートの追加・更新は本エントリと異なり、
# dependency-policy.md のユーザー承認制（`=x.y.z` 完全固定）に従う。
[workspace.dependencies]
fandhe-browser-render = { path = "crates/fandhe-browser-render" }

# fandhe-browser-profile（TASK-50（50.1）・ビヘイビア PROF-1）: unix でディレクトリ
# ハンドル（fd）基準の openat/mkdirat/fchmod を使い、パス文字列の再解決に伴う
# TOCTOU（symlink 差し替え競合。PR #437 レビュー指摘）を解消するために使う。
# ユーザー承認済み（2026-09-26）。Windows 側では使わない（unix 限定の
# target dependency として crate 側へ登録する）。
rustix = { version = "=1.1.5", default-features = false, features = [
  "fs",
  "std",
] }

# TASK-24.2（Issue #36・ビヘイビア CORE-1）: fetch モジュールの HTTP クライアント。
# Issue #35（TASK-24.hdep）で採用承認済み（2026-09-25）。crypto provider は
# aws-lc-rs（cmake・NASM を要し musl でも問題がある）を避け、ring を明示 install
# する方針のため rustls は provider 未同梱の `rustls-no-provider` で導入する。
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
# `fandhe-browser-core::fetch` が `rustls::crypto::ring::default_provider()` を
# 1 回だけ install するために直接依存する（reqwest 自体は provider を同梱しない
# ため、ここで ring feature を有効にした rustls を明示的に引き込む）。
rustls = { version = "=0.23.45", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# `reqwest`（hyper 経由）は既に tokio へ通常の推移依存として依存しており、
# ここでの直接依存は `fandhe-browser-core` の dev-dependencies のみ（結合
# テスト `tests/fetch.rs` が `#[tokio::test]` を使うため）。`Fetcher::get`
# 自体はランタイムを内蔵せず async fn として提供するが、呼び出し元（cdp・
# CLI 等）は tokio ランタイム上で await する契約とする（reqwest/hyper が
# tokio 前提のため。呼び出し元がランタイムを保有する）。
tokio = { version = "=1.53.1", default-features = false, features = [
  "rt",
  "macros",
] }

[profile.release]
# release ビルドは panic 発生時に unwind せず即座に中断する前提
# （coding-rust.md「release は panic = "abort" 前提のため catch_unwind に頼らない」）。
# 仮想 manifest のルートにしか置けない設定のため、workspace 作成時に確定させる。
panic = "abort"
