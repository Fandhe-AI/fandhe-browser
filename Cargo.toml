# fandhe-browser の workspace ルート manifest。
#
# REPAIR-1（TASK-1・TASK-1（1.1）・MS-1）: fandhe-browser を
# `-core`/`-js`/`-render`/`-cdp`/`-ai`/`-profile`/`-cli`/`-mcp` の 8 crate に
# 分割する Cargo workspace 化の第一歩として、このルート manifest だけを作成する
# （各 crate 本体は TASK-1.2〜1.7 が個別に `crates/fandhe-browser-*/Cargo.toml`
# として追加する）。

[workspace]
resolver = "3"
# 暫定的に空配列（実機検証済み: cargo は glob パターンが 1 件も解決しないと
# `members = ["crates/*"]` 自体を不正な manifest として `cargo metadata` 等を
# エラーにする。`crates/` 配下が空の TASK-1.1 完了直後の状態ではこのグロブ表記を
# 使えない）。将来的には `crates/*` へのグロブ採用が望ましい: root 側を固定
# メンバー列挙にすると、並列実装される後続タスク（各 crate 追加）がすべて
# 本ファイルの同じ行を編集する必要が生じ、並列 PR 間でコンフリクトを誘発する
# ため。**最初に merge される crate 追加 PR（TASK-1.2〜1.7 のいずれか）が、
# この行を `members = ["crates/*"]` へ書き換える契約とする**（その 1 回だけは
# 本ファイルの編集を伴うが、以降の crate 追加 PR はグロブが吸収するため
# root 側の変更が不要になる）。`make check-workspace-manifest`（`make ci` に
# 含む）が `cargo verify-project` で常時この manifest の妥当性を検証する。
members = []

[workspace.package]
# 各 crate 側は `version.workspace = true` 等（`edition`/`license` も同様）で
# ここから継承する契約とする（TASK-1.2〜1.7 向けの申し送り）。
#
# `publish` は Cargo の仕様上、他フィールドと異なり member crate が
# `publish.workspace = true` を明示しない限り自動継承されない（省略した crate は
# Cargo の既定値 `publish = true` になり公開可能な状態になってしまう）。
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate はすべて
# `publish = false` の private crate」という前提に立っているため、**新規 crate を
# 追加する各 TASK（1.2〜1.7 等）は自身の `Cargo.toml` に必ず
# `publish.workspace = true`（または直接 `publish = false`）を明記する**契約とし、
# `make check-publish-private`（`make ci` に含む）で全 member crate に対して機械的に検証する。
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# `deny.toml` の `allow-wildcard-paths = true` は「workspace 内 crate は
# `publish = false` の private crate」という前提に立っているため、ここで明示する。
publish = false

# 現時点で追加する依存はない（依存最小方針）。将来 workspace 共通依存を追加する際は
# ここに `[workspace.dependencies]` テーブルを設け、dependency-policy.md の
# ユーザー承認制（`=x.y.z` 完全固定）に従う。

[profile.release]
# release ビルドは panic 発生時に unwind せず即座に中断する前提
# （coding-rust.md「release は panic = "abort" 前提のため catch_unwind に頼らない」）。
# 仮想 manifest のルートにしか置けない設定のため、workspace 作成時に確定させる。
panic = "abort"
