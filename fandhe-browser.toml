# fandhe-browser 設定サンプル（TASK-91 / MS-3）。
# 読み込み・検証の仕様は crates/fandhe-browser-core/src/config.rs を参照。
# cli は環境変数 FANDHE_BROWSER_CONFIG で指定したときだけ読み込む（暫定。TASK-47 で引数化予定）。
# 相対パスは、この設定ファイルの親ディレクトリを基準に解決される。

[profile]
# プロファイル保存先。設定ファイルの親ディレクトリ配下に限る
# （親ディレクトリの外へ解決されるパスは拒否される。".." による脱出も同様。
# 親ディレクトリ配下に解決される絶対パスは受理される）。
# 省略時は既定の保存先を使う。
# root = "profiles"
# 分離強度。現在受理される値は "data-directory"（既定）のみ。
isolation = "data-directory"

[js]
# JS エンジン。"v8" または "boa"。省略時は同梱エンジンから v8、boa の順で選ぶ。
# 未同梱のエンジンを指定すると設定エラーになる（別エンジンへはフォールバックしない）。
# engine = "v8"
# ページ内の <script> を実行するか（既定 false。TASK-112・JS-1・JS-4）。
# true にはエンジンの同梱が必要で、エンジンなしのビルドでは設定エラーになる。
execute_page_scripts = false
# ページ内の <script type="module"> も実行するか（既定 false。JS-4・Issue #1118）。
# execute_page_scripts = true のときだけ効く（単独では何も実行しない）。
# エンジンなしのビルドで true にすると設定エラーになる。
# 制約: module の取得は同一オリジンのみ（別オリジンは拒否）。件数は最大 64、
# グラフ深さは最大 32、バイト数・実時間にも上限があり、超過は fail-closed。
# 応答は JavaScript の MIME type が必須。実行順は文書順の近似（defer 相当ではない）。
# boa は動的 import() と top-level await に未対応。動的 import() は #1117 の完了まで未対応。
execute_modules = false

[rendering]
# レンダリング層（Servo）の有効化。既定は false。
# true はレンダリング層を同梱したビルドでのみ受理される。現時点では同梱ビルドが
# 存在しないため、true を指定すると設定エラーになる（暫定挙動。最終仕様は
# rendering-layer.md と合わせて決定する）。
enabled = false
