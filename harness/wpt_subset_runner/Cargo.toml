# wpt-subset-runner: WPT サブセット（PLUG-10・TASK-101）を core 経由で実行する
# ハーネス用ツール crate。TASK-101.2.1（#553）では testharness.js が動く最小の
# グローバル環境と結果の受け渡しだけを提供し、TASK-101.2.2（#554）が取得結果の実行・
# 合否分類（runner）を足し、TASK-101.3（#275）がプロファイル別実行の指定を足す
# #276 が合格率の集計・レポート出力（report）を足し、TASK-101.6（#278）がダミーケースの
# 結合テスト（tests/runner.rs）とサブセット定義の契約テスト（tests/subset_schema.rs）を足す。
#
# 依存は `fandhe-browser-core` のみ（path 依存。外部 crate は追加しない）。
# AGENTS.md「crate 間の許可依存」により js crate へは直接依存しない。

[package]
name = "wpt-subset-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
# `make check-publish-private` が検証する契約（root Cargo.toml 参照）。
publish.workspace = true

[dependencies]
fandhe-browser-core = { path = "../../crates/fandhe-browser-core" }

# `default` は必ず空にする。既定 feature でエンジンを有効にすると feature unification により
# `cargo test --workspace` の既定構成で core・js の「エンジンなし」前提のテストが壊れる。
[features]
default = []
js-v8 = ["fandhe-browser-core/js-v8"]
js-boa = ["fandhe-browser-core/js-boa"]

# 子プロセス版 JS ワーカーの役割を兼ねる独自 `main` を持つため `harness = false`
# （core の `tests/js_stub_v8.rs` と同じ理由）。
[[test]]
name = "testharness_env"
harness = false

[[test]]
name = "runner_subset"
harness = false

# TSV からレポート JSON までの一気通貫テスト（TASK-101.6）。同じ理由で `harness = false`。
[[test]]
name = "runner"
harness = false
